<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>臺中市公車路廊即時地圖</title>
    <script>
        // 外觀模版：dark (預設) / light (淺色) / glass (Apple iOS Liquid Glass)
        (function () {
            let t = window.__THEME__;
            try { t = t || new URLSearchParams(location.search).get('theme') || localStorage.getItem('txg_theme'); } catch (e) {}
            if (t === 'light' || t === 'glass') document.documentElement.dataset.theme = 'glass';   // 淺色模式已併入 Liquid Glass
        })();
        const THEMES = [['dark', '深色'], ['glass', 'Liquid Glass']];
        function cycleTheme() {
            const cur = document.documentElement.dataset.theme || 'dark';
            const next = THEMES[(THEMES.findIndex(x => x[0] === cur) + 1) % THEMES.length];
            if (next[0] === 'dark') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next[0];
            try { localStorage.setItem('txg_theme', next[0]); } catch (e) {}
            themeIcon();
        }
        // 外觀按鈕：圖示顯示目前外觀，深色＝月亮、Liquid Glass (淺色)＝太陽
        const THEME_IC = {
            dark: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6Z"/></svg>',
            glass: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>'
        };
        function themeIcon() {
            const b = document.getElementById('btn-theme');
            if (!b) return;
            const cur = document.documentElement.dataset.theme === 'glass' ? 'glass' : 'dark';
            b.innerHTML = THEME_IC[cur];
            b.title = `外觀：${THEMES.find(x => x[0] === cur)[1]} (點擊切換 深色 / Liquid Glass)`;
        }
        document.addEventListener('DOMContentLoaded', themeIcon);
    </script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <style>
        :root { --bg-color: #1a1a1a; --panel-bg: rgba(30, 30, 30, 0.95); --text-color: #ffffff; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: sans-serif; overflow: hidden; color: var(--text-color); }
        #scene-container { width: 100vw; height: 100vh; cursor: grab; }
        #scene-container:active { cursor: grabbing; }
        svg { display: block; width: 100%; height: 100%; }

        /* 路廊代表線 (收合狀態) */
        /* 線寬三級 (班次密集程度)：粗 14 / 中 9 / 細 5 */
        .metro-line { fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; opacity: 0.95; transition: 0.3s; cursor: pointer; }
        .metro-line:hover { opacity: 1; stroke-width: 16; }
        .metro-line.faded { opacity: 0.18; stroke-width: 8; }
        .metro-line.secondary { stroke-width: 9; }
        .metro-line.secondary:hover { stroke-width: 11; }
        .metro-line.minor { stroke-width: 5; opacity: 0.8; }
        .reserve-line { fill: none; stroke-width: 8; stroke-dasharray: 2 14; stroke-linecap: round; opacity: 0.55; pointer-events: none; }
        .reserve-label { font-size: 17px; font-weight: bold; opacity: 0.75; pointer-events: none; paint-order: stroke; stroke: var(--bg-color, #fff); stroke-width: 4px; }
        .station-sq { stroke: #4a4a4a !important; stroke-width: 2.5; }
        .line-badge { cursor: pointer; }
        .line-badge text { font-size: 15px; font-weight: 800; pointer-events: none; font-family: Arial, sans-serif; }
        .metro-line.minor:hover { stroke-width: 7; opacity: 0.9; }
        /* 一般站：白色圓點、路線色外框 (參考捷運路線圖) */
        .station-dot { fill: #fff; stroke-width: 2.5; cursor: pointer; transition: 0.2s; transform-box: fill-box; transform-origin: center; }
        .station-dot:hover { transform: scale(1.2); }
        /* 全圖時只顯示轉乘站與端點站名，放大後才顯示逐站站名 */
        #metro-svg:not(.show-labels) .station-label.minor-label { display: none; }
        .rail-center { fill: none; stroke: #1a1a1a; stroke-width: 3; stroke-dasharray: 10 8; pointer-events: none; }

        /* 展開後的路線束 */
        .band { fill: none; opacity: 0.10; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
        .route-line { transition: opacity 0.2s; cursor: pointer; }
        .route-line .seg { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        .route-line .seg.express { stroke-dasharray: 1 7; stroke-width: 5; }
        .route-line .seg.detour, .route-line .seg.skip { stroke-dasharray: 6 5; stroke-width: 2.5; opacity: 0.85; }
        .route-line .stub { stroke-width: 3; stroke-linecap: round; fill: none; }
        .route-line .stub-tip { stroke: none; }
        .route-line .serve-dot { fill: #fff; pointer-events: none; }
        .route-line .hit { fill: none; stroke: transparent; stroke-width: 10; pointer-events: stroke; }
        .route-line .stub-label { font-size: 10px; fill: #ddd; pointer-events: none; text-shadow: 1px 1px 2px #000; }
        .route-line.dim { opacity: 0.12; }
        .route-line.hl .seg { stroke-width: 6; }

        .station-marker { fill: #FFFFFF; stroke: #000000; stroke-width: 2.5; cursor: pointer; transition: 0.2s; transform-box: fill-box; transform-origin: center; }
        .station-marker:hover { transform: scale(1.1); }

        .station-label { font-size: 19px; fill: #eee; font-weight: 500; pointer-events: none; text-shadow: 1px 1px 2px #000; opacity: 0.85; }
        /* 觸控裝置：放大到看得清楚才顯示逐站站名 */
        #metro-svg.zoom-labels:not(.show-labels) .station-label { display: none; }
        .corridor-title { cursor: pointer; }
        .corridor-title text { font-size: 15px; font-weight: bold; fill: #fff; pointer-events: none; }

        /* 轉乘站 */
        .xfer-outer { stroke: #000; stroke-linecap: round; fill: none; }
        .xfer-inner { stroke: #fff; stroke-linecap: round; fill: none; }
        .xfer-walk { stroke: #999; stroke-width: 2; stroke-dasharray: 3 4; fill: none; }
        .xfer-label { font-weight: bold; fill: #fff; opacity: 1; font-size: 21px; }
        .station-marker.xfer-rail { stroke-width: 3; }

        /* 車輛：收合 = 白色圓角方塊+行車方向；展開 = 路線色漸變圓點 */
        .veh { transition: transform 1s linear; cursor: pointer; }
        .veh-box { fill: #fff; stroke: #111; stroke-width: 0.8; }
        .veh-arrow { fill: #222; }
        .veh-mini { stroke: #111; stroke-width: 0.6; }
        .veh.dim { opacity: 0.15; }
        /* 即將入線 / 離線：閃爍 */
        .veh.blink .veh-body { animation: veh-blink 0.9s infinite ease-in-out; }
        @keyframes veh-blink { 50% { opacity: 0.15; } }
        /* 入線：本路廊代表色閃爍；離線後接續其他路廊：接續路廊代表色閃爍 */
        .veh.blink-color .veh-box, .veh.blink-color .veh-mini { animation: veh-blink-fill 0.9s infinite ease-in-out; }
        @keyframes veh-blink-fill { 50% { fill: var(--blink); } }

        /* 點擊公車：只亮出該路線的行駛區間，其他降低亮度 */
        #map-root.focus-mode .metro-line { opacity: 0.2; }
        #map-root.focus-mode .route-line { opacity: 0.1; }
        #map-root.focus-mode .station-label { opacity: 0.3; }
        #map-root.focus-mode .station-label.on-route { opacity: 1; }
        .focus-route-bg { fill: none; stroke: #fff; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; pointer-events: none; }
        .focus-route { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
        .focus-route.gap { stroke-dasharray: 6 6; stroke-width: 3; }
        .focus-route.offmap { stroke-dasharray: 12 9; stroke-width: 6; }
        .focus-arrows path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
        .focus-start { fill: #fff; stroke-width: 4; pointer-events: none; }
        .focus-head { pointer-events: none; }
        .focus-end { font-size: 12px; font-weight: bold; fill: #fff; pointer-events: none; text-shadow: 1px 1px 3px #000; }
        /* 路線代號：游標指向或點擊 (固定) 時顯示 */
        .veh-tag { display: none; pointer-events: none; }
        .veh:hover .veh-tag, .veh.pinned .veh-tag { display: inline; }
        .veh-tag rect { fill: rgba(0, 0, 0, 0.85); stroke: #fff; stroke-width: 0.6; }
        .veh-tag text { font-size: 9px; font-weight: bold; fill: #fff; }

        #info-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(150%);
            width: 90%; max-width: 520px; max-height: 60vh; overflow-y: auto; box-sizing: border-box;
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        #info-panel.active { transform: translateX(-50%) translateY(0); }
        #info-panel h2 { margin: 0 30px 5px 0; font-size: 20px; }
        #info-panel p { margin: 0; color: #aaa; font-size: 14px; line-height: 1.5; }

        #line-badges {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .line-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px;
            min-width: 0;
        }
        .route-badge { padding: 4px 8px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: bold; }
        .route-badge .tk-ic { width: 1.2em; height: 1.2em; vertical-align: -0.25em; margin: 0 3px 0 -2px; background: #fff; border-radius: 50%; padding: 1px; box-sizing: content-box; }
        .bus-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 13px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }
        .bus-info-row:last-child { border-bottom: none; margin-bottom: 0; }
        .bus-dir {
            background: #444;
            color: #fff;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
        }
        .bus-dir small { color: #bbb; }
        .arrival-time {
            width: 100%;
            margin-top: 6px;
            font-size: 12px;
            color: #00bcd4;
            font-family: monospace;
        }
        .live-time, .eta-text { white-space: nowrap; }
        .coming-soon { color: #ffeb3b; font-weight: bold; }
        .arriving { color: #ff5252; font-weight: bold; }
        .muted { color: #888; }

        /* 路廊面板：共線/分岔卡片 */
        .grp-card { grid-column: 1 / -1; display: flex; gap: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 10px; cursor: pointer; border: 1px solid transparent; }
        .grp-card.hl { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); }
        .grp-bar { width: 6px; border-radius: 3px; flex: none; }
        .grp-body { min-width: 0; }
        .grp-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .grp-info { font-size: 12px; color: #bbb; line-height: 1.5; }
        .grp-mini { grid-column: 1 / -1; font-size: 12px; color: #aaa; }
        .grp-mini .route-badge { display: inline-block; margin: 2px; cursor: pointer; border: 1px solid transparent; }
        .grp-mini .route-badge.hl { border-color: #fff; }
        .panel-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
        .panel-btn { background: #333; color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }

        /* 站牌卡片：依行進方向分欄 (左＝往低站序端、右＝往高站序端、中＝下一站離開路廊) */
        .dir-card { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .dir-card.with-mid { grid-template-columns: 1fr 0.9fr 1fr; }
        .dir-col { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 6px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .dir-col.mid { background: rgba(255,255,255,0.09); border: 1px dashed rgba(255,255,255,0.25); }
        .dir-head { font-size: 12px; font-weight: bold; color: #ddd; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.12); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dir-head.right { text-align: right; }
        .dir-item { cursor: pointer; border-radius: 6px; padding: 3px 4px; }
        .dir-item:hover { background: rgba(255,255,255,0.08); }
        .dir-item.done { opacity: 0.45; }
        .dir-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: #00bcd4; font-family: monospace; }
        .dir-line .route-badge { padding: 2px 6px; font-family: inherit; }
        .dir-to { font-size: 10px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
        .dir-empty { font-size: 11px; color: #777; }
        .dly { font-size: 10px; padding: 0 4px; border-radius: 3px; font-family: inherit; white-space: nowrap; }
        .dly.late { background: #5a2323; color: #ff9e9e; }
        .dly.early { background: #1f3f5a; color: #9fd3ff; }
        .dly.ontime { background: #24452a; color: #a5e0ad; }
        /* 路線面板 */
        .tp-box { grid-column: 1 / -1; font-size: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
        .tp-title { font-size: 11px; color: #aaa; margin-bottom: 3px; }
        .tp-row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 2px 0; border-top: 1px solid rgba(255,255,255,0.06); }
        .tp-plate { font-family: ui-monospace, Consolas, monospace; min-width: 64px; }
        .rt-head, .rt-row { grid-column: 1 / -1; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 76px; gap: 6px; align-items: center; }
        .rt-head { font-size: 11px; color: #888; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 3px; }
        .rt-list { grid-column: 1 / -1; display: flex; flex-direction: column; }
        .rt-row { font-size: 13px; padding: 4px 2px; border-bottom: 1px dashed rgba(255,255,255,0.08); cursor: pointer; }
        .rt-row:hover { background: rgba(255,255,255,0.05); }
        .rt-row.here { background: rgba(255,235,59,0.12); }
        .rt-dot { width: 8px; height: 8px; border-radius: 50%; border: 3px solid; background: #fff; }
        .rt-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rt-eta { display: flex; gap: 4px; align-items: center; font-family: monospace; color: #00bcd4; font-size: 12px; white-space: nowrap; }
        .rt-sch { font-size: 11px; color: #bbb; font-family: monospace; text-align: right; }
        .rt-times { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 3px 8px; font-family: monospace; font-size: 11px; color: #ddd; padding: 4px 0 2px; }
        .rt-times .past { color: #666; }
        @media (max-width: 440px) {
            .dir-card.with-mid { grid-template-columns: 1fr 0.8fr 1fr; gap: 4px; }
            .dir-col { padding: 4px; }
            .rt-head, .rt-row { grid-template-columns: 12px minmax(0, 1fr) auto 62px; }
        }

        /* 行程規劃 */
        .plan-pin text { font-size: 11px; font-weight: bold; fill: #fff; pointer-events: none; }
        .plan-pin { pointer-events: none; }
        .plan-card { grid-column: 1 / -1; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 10px; cursor: pointer; border: 1px solid transparent; }
        .plan-card.sel { border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.1); }
        .plan-sum { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .plan-sum small { font-weight: normal; color: #aaa; font-size: 12px; }
        .panel-btn.nav-go { background: #0a84ff; color: #fff; border-color: #0a84ff; font-weight: bold; margin-top: 6px; }
        .plan-leg { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; font-size: 12px; margin: 3px 0; }
        .plan-leg .route-badge { cursor: pointer; }
        .plan-leg .lg-main { color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .plan-leg .lg-sub { grid-column: 2; color: #9a9a9a; font-size: 11px; }
        .plan-leg .route-badge.alt { padding: 1px 5px; font-size: 10px; margin-right: 3px; }
        .plan-xfer { font-size: 11px; color: #ffcc80; margin: 2px 0 2px 4px; }
        .src { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #3b4148; color: #ccc; margin-left: 4px; }
        .src.live { background: #1b5e20; color: #b9f6ca; }
        .src.sched { background: #283593; color: #c5cae9; }
        .plan-hint { grid-column: 1 / -1; font-size: 13px; color: #ddd; }

        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

        .controls {
            position: absolute; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 1000;
        }
        .ctrl-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(50,50,50,0.8); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.15s; }
        .ctrl-btn:hover { background: #444; }
        .ctrl-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }

        /* API 額度狀態 */
        #api-status {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(50,50,50,0.8); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 6px 12px; font-size: 12px; color: #ccc; cursor: pointer;
            max-width: calc(100vw - 110px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #api-status { font-variant-numeric: tabular-nums; }
        #key-dlg { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; }
        #key-dlg .key-box { background: #222; border: 1px solid #444; border-radius: 12px; padding: 16px; width: min(420px, 100%); color: #eee; font-size: 14px; }
        #key-dlg p { color: #aaa; font-size: 13px; line-height: 1.6; }
        #key-dlg a { color: #8ab4f8; }
        #key-dlg input { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 8px; background: #2b2e33; color: #eee; border: 1px solid #555; border-radius: 6px; font-size: 14px; }
        #key-dlg .key-row { display: flex; gap: 8px; margin-top: 8px; }
        #key-dlg button { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
        #key-dlg button#key-ok { background: #2e6b3a; }
        #api-status.open { border-radius: 10px; line-height: 1.6; max-width: min(320px, 70vw); }
        #api-status .pill-btn { display: inline-block; margin-top: 4px; padding: 1px 8px; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: #fff; }
        #api-status.warn { color: #ffeb3b; }
        #api-status.err { color: #ff8a80; }

        /* ===================== 外觀模版：淺色 / Liquid Glass ===================== */
        html[data-theme] { --bg-color: #eef0f4; --panel-bg: rgba(255, 255, 255, 0.96); --text-color: #111; }
        html[data-theme] .rail-center { stroke: var(--bg-color); }
        html[data-theme] .station-label, html[data-theme] .xfer-label, html[data-theme] .corridor-title text, html[data-theme] .focus-end, html[data-theme] .route-line .stub-label {
            fill: #1c1c1e; text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 5px #fff; }
        html[data-theme] .station-label { opacity: 0.92; }
        html[data-theme] #info-panel { border-color: rgba(0,0,0,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.18); }
        html[data-theme] #info-panel p, html[data-theme] .grp-info, html[data-theme] .grp-mini, html[data-theme] .tp-title, html[data-theme] .plan-sum small,
        html[data-theme] .dir-to, html[data-theme] .rt-head, html[data-theme] .muted, html[data-theme] .plan-leg .lg-sub, html[data-theme] .rt-sch, html[data-theme] .dir-empty { color: #666; }
        html[data-theme] .line-group, html[data-theme] .grp-card, html[data-theme] .dir-col, html[data-theme] .tp-box, html[data-theme] .plan-card { background: rgba(0,0,0,0.045); }

                return k in memStore ? memStore[k] : null;
            },
            set(k, v) {
                memStore[k] = v;
                try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
            },
            del(k) {
                delete memStore[k];
                try { localStorage.removeItem(k); } catch (e) {}
            }
        };

        // ==========================================
        //  PART 2: API 額度控管 (滑動視窗，跨分頁共用)
        // ==========================================
        //   1. 站牌依 URL 長度切成少數「資料區塊」，一個區塊一次請求就涵蓋整段路廊；點站只讀快取
        //   2. 所有請求都先向 ApiBudget 取得額度，60 秒內最多 3 次 (記錄在 localStorage，多分頁共用)
        //   3. 快取 25 秒內視為新鮮；額度不足時排隊，額度釋出才補抓
        //   4. 車輛位置由 ETA 的車牌 + 倒數推算，捷運由官方班距推算，都不另外呼叫 API

        const ApiBudget = {
            KEY: 'txg_api_calls',
            BLOCK_KEY: 'txg_api_block',
            stamps() {
                const now = Date.now();
                return (store.get(this.KEY) || []).filter(t => now - t < 60000);
            },
            used() { return this.stamps().length; },
            waitMs() {
                const now = Date.now();
                const s = this.stamps();
                const windowWait = s.length < API_POLICY.maxCallsPerMinute ? 0 : (s[0] + 60000 - now);
                const blockWait = (store.get(this.BLOCK_KEY) || 0) - now;
                return Math.max(0, windowWait, blockWait);
            },
            take() {
                if (this.waitMs() > 0) return false;
                const s = this.stamps();
                s.push(Date.now());
                store.set(this.KEY, s);
                return true;
            },
            blockFor(ms) { store.set(this.BLOCK_KEY, Date.now() + ms); },
            // TDX 有回 RateLimit 標頭時，以伺服器為準 (CORS 未開放時讀不到就忽略)
            syncServer(res) {
                const remain = res.headers.get('X-RateLimit-Remaining-Minute');
                const reset = res.headers.get('RateLimit-Reset');
                if (remain !== null && Number(remain) <= 0) this.blockFor((Number(reset) || 60) * 1000);
            }
        };

        // TDX 金鑰：優先用使用者在本機設定的 (localStorage)，其次才是檔案內建的 TDX_CONFIG (公開部署版留空)
        const tdxKey = () => {
            const k = store.get('txg_tdx_key');
            if (k && k.id && k.secret) return k;
            return TDX_CONFIG.clientId && TDX_CONFIG.clientSecret ? { id: TDX_CONFIG.clientId, secret: TDX_CONFIG.clientSecret } : null;
        };
        function openKeyDialog() {
            let d = document.getElementById('key-dlg');
            if (!d) {
                d = document.createElement('div');
                d.id = 'key-dlg';
                document.body.appendChild(d);
            }
            const k = store.get('txg_tdx_key') || {};
            d.innerHTML = `<div class="key-box"><b>TDX API 金鑰</b>
                <p>即時資料來自交通部 TDX 運輸資料流通服務。請到 <a href="https://tdx.transportdata.tw/" target="_blank" rel="noopener">tdx.transportdata.tw</a> 免費註冊，在「會員中心 → API 金鑰」取得 Client ID 與 Client Secret。金鑰只存在這台裝置的瀏覽器，不會上傳。</p>
                <input id="key-id" placeholder="Client ID" value="${k.id || ''}" autocomplete="off">
                <input id="key-secret" placeholder="Client Secret" value="${k.secret || ''}" autocomplete="off" type="password">
                <div class="key-row"><button id="key-ok">儲存並更新</button><button id="key-clear">清除</button><button id="key-close">關閉</button></div></div>`;

                const id = d.querySelector('#key-id').value.trim(), secret = d.querySelector('#key-secret').value.trim();
                if (!id || !secret) return;
                store.set('txg_tdx_key', { id, secret });
                store.del('txg_tdx_token');
                d.style.display = 'none';
                EtaStore.lastError = null;
                CHUNKS.forEach(c => EtaStore.request(c.id, { force: true }));
            };
            d.querySelector('#key-clear').onclick = () => { store.del('txg_tdx_key'); store.del('txg_tdx_token'); openKeyDialog(); };
            d.querySelector('#key-close').onclick = () => { d.style.display = 'none'; };
        }

        async function getToken() {
            const cached = store.get('txg_tdx_token');
            if (cached && cached.exp > Date.now() + 60000) return cached.token;
            const key = tdxKey();
            if (!key) throw new Error('尚未設定 TDX 金鑰（點左上角狀態列設定）');

            console.log("正在取得 TDX Token...");
            const res = await fetch(TDX_CONFIG.authUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'client_credentials',
                    client_id: key.id,
                    client_secret: key.secret
                })
            });
            if (!res.ok) throw new Error('Token 取得失敗 ' + res.status);
            const data = await res.json();
            store.set('txg_tdx_token', { token: data.access_token, exp: Date.now() + data.expires_in * 1000 });
            console.log("Token 取得成功!");
            return data.access_token;
        }

        // ==========================================
        //  PART 3: ETA 資料區塊與快取
        // ==========================================

        // 全部公車路廊 (查詢區塊固定用全部站名)；BUS_LINES = 目前模式顯示的路廊
        // 主線排前面：查詢區塊依此順序建立，開頁時主線資料先到
        const ALL_BUS_LINES = ['bl', 'or', 'rd', 'pp', 'ge', 'gs', 'bt', 'xt', 'gy', 'hn', 'hd', 'zj', 'jm', 'yl', 'lm', 'mq'];
        const CENTER_ONLY = [];   // 只在「中區節點」模式出現
        let BUS_LINES = ALL_BUS_LINES.filter(l => !CENTER_ONLY.includes(l));
        const ETA_SELECT = 'RouteName,SubRouteName,StopName,Direction,EstimateTime,StopStatus,NextBusTime,SrcUpdateTime,PlateNumb';
        const aliasesOf = st => st.aliases || [st.name];

        function etaUrl(names) {
            const params = new URLSearchParams({
                '$filter': names.map(n => `StopName/Zh_tw eq '${n.replace(/'/g, "''")}'`).join(' or '),
                '$select': ETA_SELECT,
                '$format': 'JSON'
            });
            return `${TDX_CONFIG.etaUrl}?${params}`;
        }

        // 依序把站名塞進區塊，URL 超過上限就開新區塊
        const CHUNKS = (function buildChunks() {
            const chunks = [];
            const seen = new Set();
            let cur = null;
            ALL_BUS_LINES.forEach(lid => {
                DATA[lid].stops.forEach(st => aliasesOf(st).forEach(name => {
                    if (seen.has(name)) return;
                    seen.add(name);
                    if (!cur || etaUrl(cur.names.concat(name)).length > API_POLICY.maxUrlLength) {
                        cur = { id: 'c' + chunks.length, names: [] };
                        chunks.push(cur);
                    }
                    cur.names.push(name);
                }));
            });
            return chunks;
        })();
        const CHUNK_OF_NAME = new Map();
        CHUNKS.forEach(c => c.names.forEach(n => CHUNK_OF_NAME.set(n, c.id)));

        // 每條路廊的「主要區塊」= 包含最多其站名的區塊
        function primaryChunkOf(lid) {
            const count = {};
            DATA[lid].stops.forEach(st => aliasesOf(st).forEach(n => {
                const c = CHUNK_OF_NAME.get(n);
                count[c] = (count[c] || 0) + 1;
            }));
            return Object.keys(count).sort((a, b) => count[b] - count[a])[0];
        }
        const chunkOfStation = (lid, idx) => CHUNK_OF_NAME.get(aliasesOf(DATA[lid].stops[idx])[0]);

        // 壓縮後的一筆：[站名, 子路線, 方向, 預計抵達時刻(ms)|null, StopStatus, NextBusTime|null, 車牌, 站序]
        function etaRow(item, receivedAt) {
            let deadline = null;
            if (item.EstimateTime !== undefined && item.EstimateTime !== null) {
                // 扣掉資料產生到收到之間的延遲；使用者時鐘不準時限制在 0~90 秒
                const src = Date.parse(item.SrcUpdateTime);
                const latency = isNaN(src) ? 0 : Math.min(90, Math.max(0, (receivedAt - src) / 1000));
                deadline = Math.round(receivedAt + (item.EstimateTime - latency) * 1000);
            }
            const sub = (item.SubRouteName && item.SubRouteName.Zh_tw) || item.RouteName.Zh_tw;
            const row = [item.StopName.Zh_tw, sub, item.Direction, deadline, item.StopStatus, item.NextBusTime || null, item.PlateNumb || ''];
            if (item.StopSequence != null) row.push(item.StopSequence);
            return row;
        }

        // 其他 API 呼叫 (路線即時、時刻表) 共用同一個額度；low = 背景比對用，只在額度寬裕時執行
        const ApiTasks = {
            q: [], busy: false, timer: null,
            run(url, { low = false } = {}) {
                return new Promise((resolve, reject) => {
                    this.q.push({ url, low, resolve, reject });
                    this.q.sort((a, b) => a.low - b.low);
                    this._pump();
                });
            },
            pending() { return this.q.length + (this.busy ? 1 : 0); },
            _pump() {
                if (this.busy || this.timer || !this.q.length) return;
                const t = this.q[0];
                let wait = ApiBudget.waitMs();
                if (!wait && t.low && (EtaStore.queue.length || EtaStore.inflight || ApiBudget.used() >= API_POLICY.maxCallsPerMinute - 1)) wait = 5000;
                if (!wait && document.visibilityState !== 'visible') wait = 5000;
                if (wait) { this.timer = setTimeout(() => { this.timer = null; this._pump(); }, wait + 300); return; }
                this.q.shift();
                this.busy = true;
                this._fetch(t.url, true).then(t.resolve, t.reject).finally(() => { this.busy = false; this._pump(); });
            },
            async _fetch(url, retry) {
                const token = await getToken();
                if (!ApiBudget.take()) {
                    await new Promise(r => setTimeout(r, ApiBudget.waitMs() + 300));
                    return this._fetch(url, retry);
                }
                const res = await fetch(url, { headers: { authorization: 'Bearer ' + token } });
                ApiBudget.syncServer(res);
                if (res.status === 401 && retry) { store.del('txg_tdx_token'); return this._fetch(url, false); }
                if (res.status === 429) { ApiBudget.blockFor(60000); throw new Error('已達 API 頻率上限 (429)'); }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            }
        };

        const EtaStore = {
            CACHE_KEY: 'txg_eta_cache_v2',
            snaps: {},
            byStop: new Map(),
            inflight: null,
            queue: [],
            pendingTimer: null,
            lastError: null,
            listeners: [],

            init() {
                const c = store.get(this.CACHE_KEY);
                if (c) { this.snaps = c; this._reindex(); }
                // 其他分頁抓到新資料時直接沿用，不重複呼叫
                window.addEventListener('storage', e => {
                    if (e.key !== this.CACHE_KEY) return;
                    const c = store.get(this.CACHE_KEY);
                    if (!c) return;
                    let changed = false;
                    Object.keys(c).forEach(id => {
                        if (!this.snaps[id] || c[id].fetchedAt > this.snaps[id].fetchedAt) { this.snaps[id] = c[id]; changed = true; }
                    });
                    if (changed) this._reindex();
                });
            },
            onChange(fn) { this.listeners.push(fn); },
            notify(kind) { this.listeners.forEach(fn => fn(kind)); },
            age(chunkId) { const s = this.snaps[chunkId]; return s ? Date.now() - s.fetchedAt : Infinity; },
            hasData() { return Object.keys(this.snaps).length > 0; },
            busy() { return !!(this.inflight || this.queue.length || this.pendingTimer); },
            rowsForStation(st) { return aliasesOf(st).flatMap(n => this.byStop.get(n) || []); },

            _reindex() {
                this.byStop = new Map();
                Object.values(this.snaps).forEach(s => s.rows.forEach(r => {
                    if (!this.byStop.has(r[0])) this.byStop.set(r[0], []);
                    this.byStop.get(r[0]).push(r);
                }));
                this.notify('data');
            },

            // 唯一的對外入口：需要某區塊資料時呼叫，是否真的打 API 由這裡決定
            request(chunkId, { force = false } = {}) {
                if (!chunkId) return;
                if (!force && this.age(chunkId) < API_POLICY.freshMs) return;
                if (this.inflight !== chunkId && !this.queue.includes(chunkId)) this.queue.push(chunkId);
                this._pump();
            },

            _pump() {
                if (this.inflight || this.pendingTimer || !this.queue.length) return;
                if (document.visibilityState !== 'visible') return;   // 背景分頁不耗額度
                const wait = ApiBudget.waitMs();
                if (wait > 0) {
                    this.pendingTimer = setTimeout(() => { this.pendingTimer = null; this._pump(); }, wait + 300);
                    this.notify('status');
                    return;
                }
                const id = this.queue.shift();
                if (this.age(id) < API_POLICY.freshMs) { this._pump(); return; }   // 其他分頁剛更新過
                this.inflight = id;
                this.notify('status');
                this._fetch(id, true).finally(() => {
                    this.inflight = null;
                    this.notify('status');
                    this._pump();
                });
            },

            async _fetch(chunkId, allowRetry) {
                this.lastError = null;
                try {
                    const token = await getToken();
                    if (!ApiBudget.take()) { this.queue.unshift(chunkId); return; }

                    const chunk = CHUNKS.find(c => c.id === chunkId);
                    const res = await fetch(etaUrl(chunk.names), { headers: { authorization: 'Bearer ' + token } });
                    ApiBudget.syncServer(res);

                    if (res.status === 401 && allowRetry) {
                        store.del('txg_tdx_token');
                        return this._fetch(chunkId, false);
                    }
                    if (res.status === 429) {
                        ApiBudget.blockFor(60000);
                        throw new Error('已達 API 頻率上限 (429)');
                    }
                    if (!res.ok) throw new Error('HTTP ' + res.status);

                    const json = await res.json();
                    const receivedAt = Date.now();
                    const rows = json.map(item => etaRow(item, receivedAt));
                    this.snaps[chunkId] = { fetchedAt: receivedAt, rows };
                    store.set(this.CACHE_KEY, this.snaps);
                    this._reindex();
                } catch (err) {
                    console.error("API Error:", err);
                    this.lastError = err.message || String(err);
                }
            }
        };

        // ==========================================

            return d + ` L ${f(z[0])} ${f(z[1])}`;
        }

        function makePath(pts) {
            const segs = [];
            let L = 0;
            for (let i = 0; i < pts.length - 1; i++) {
                const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
                const len = Math.hypot(x1 - x0, y1 - y0);
                segs.push({ x0, y0, len, start: L, ux: (x1 - x0) / len, uy: (y1 - y0) / len });
                L += len;
            }
            return { segs, L };
        }

        // 點 (x, y) 投影到折線上的距離 (用於錨點)
        function distOf(P, x, y) {
            let best = null;
            P.segs.forEach(s => {
                const t = Math.min(Math.max((x - s.x0) * s.ux + (y - s.y0) * s.uy, 0), s.len);
                const px = s.x0 + s.ux * t, py = s.y0 + s.uy * t;
                const err = Math.hypot(px - x, py - y);
                if (!best || err < best.err) best = { err, d: s.start + t };
            });
            return best.d;
        }

        // 取得折線上距離 d 的點，off = 沿法線方向的偏移 (轉角處用斜接，平行線才不會斷開)
        function pointAt(P, d, off = 0) {
            let i = P.segs.findIndex(s => d <= s.start + s.len + 1e-6);
            if (i < 0) i = P.segs.length - 1;
            const s = P.segs[i];
            const t = Math.min(Math.max(d - s.start, 0), s.len);
            let nx = -s.uy, ny = s.ux, scale = 1;
            const next = P.segs[i + 1];
            if (next && s.len - t < 0.5) {
                let mx = nx - next.uy, my = ny + next.ux;
                const ml = Math.hypot(mx, my);
                mx /= ml; my /= ml;
                scale = 1 / (mx * nx + my * ny);
                nx = mx; ny = my;
            }
            return { x: s.x0 + s.ux * t + nx * off * scale, y: s.y0 + s.uy * t + ny * off * scale, nx, ny, ux: s.ux, uy: s.uy };
        }

        function offsetPolyline(P, d0, d1, off) {
            const out = [];
            const a = pointAt(P, d0, off);
            out.push([a.x, a.y]);
            P.segs.forEach((s, i) => {
                if (i > 0 && s.start > d0 + 0.5 && s.start < d1 - 0.5) {
                    const v = pointAt(P, s.start, off);
                    out.push([v.x, v.y]);
                }
            });
            const b = pointAt(P, d1, off);
            out.push([b.x, b.y]);
            return out;
        }

        const baseRoute = name => /跳蛙/.test(name) ? name : ((name.match(/^[^\d]*\d+/) || [name])[0]);

        function splitRuns(cov) {
            const runs = [];
            cov.forEach(i => {
                const last = runs[runs.length - 1];
                if (last && i === last[1] + 1) last[1] = i; else runs.push([i, i]);
            });
            return runs;
        }

        const laneOffset = j => (j === 0 ? 0 : (j % 2 ? (j + 1) / 2 : -j / 2));

        // 同一組停靠站序的路線合併成一條「共線束」，再依區間不重疊原則共用車道
        function buildGroups(lid) {
            const map = new Map();
            DATA[lid].routes.forEach(r => {
                const key = lid + ':' + r.cov.join(',');
                if (!map.has(key)) map.set(key, { key, lid, cov: r.cov, routes: [] });
                map.get(key).routes.push(r);
            });
            const groups = [...map.values()].sort((a, b) => b.cov.length - a.cov.length || b.routes.length - a.routes.length);
            const lanes = [];
            groups.forEach((g, j) => {
                const a = g.cov[0] - 1, b = g.cov[g.cov.length - 1] + 1;
                g.lane = null;
                for (let k = 0; k < MAX_LANES; k++) {
                    lanes[k] = lanes[k] || [];
                    if (lanes[k].every(([x, y]) => b < x || a > y)) { lanes[k].push([a, b]); g.lane = k; break; }
                }
                g.off = g.lane === null ? null : laneOffset(g.lane) * LANE;
                g.color = j === 0 ? LINES[lid].color : GROUP_PALETTE[(j - 1) % GROUP_PALETTE.length];
                const span = g.cov[g.cov.length - 1] - g.cov[0] + 1;
                g.express = g.cov.length / span < 0.6;
                g.ends = groupEnds(g);
            });
            return groups;
        }

        // 低端/高端的路線延伸方向 (分岔去哪裡)
        function groupEnds(g) {
            const low = new Set(), high = new Set();
            g.routes.forEach(r => {
                const ds = Object.values(r.dirs);
                const inc = ds.find(x => x.enter <= x.leave), dec = ds.find(x => x.enter > x.leave);
                if (dec && dec.after) low.add(dec.to); else if (inc && inc.before) low.add('經 ' + inc.before);
                if (inc && inc.after) high.add(inc.to); else if (dec && dec.before) high.add('經 ' + dec.before);
            });
            return { low: [...low], high: [...high] };
        }

        // 共線束與版面無關，只算一次
        Object.values(LINES).forEach(Ln => {
            Ln.n = stopsOf(Ln.id).length;
            // 線寬分三級 (依班次密集程度＝平均每站停靠路線數)：1 粗 ≥10、2 中 4~10、3 細 <4；捷運為粗線
            // 規劃捷運路線 (plan) 一律粗線；其餘公車路廊依密度畫中／細線
            if (Ln.kind === 'bus') {
                const dens = DATA[Ln.id].routes.reduce((a, r) => a + r.cov.length, 0) / Ln.n;
                Ln.density = Math.round(dens * 10) / 10;
                Ln.tier = Ln.plan ? 1 : dens >= 10 ? 2 : 3;
            } else Ln.tier = 1;
            Ln.keys = new Set((MAP_DESIGN.keys || {})[Ln.id] || []);
            Ln.main = Ln.tier === 1;
            Ln.minor = Ln.tier === 3;
            if (Ln.kind === 'bus') {
                Ln.groups = buildGroups(Ln.id);
                Ln.groupOfRoute = {};
                Ln.groups.forEach(g => g.routes.forEach(r => { Ln.groupOfRoute[r.name] = g; }));
                const drawn = Ln.groups.filter(g => g.lane !== null).map(g => g.off);
                Ln.offMin = Math.min(...drawn);
                Ln.offMax = Math.max(...drawn);
            }
        });

        // 套用版面：站距由錨點分段等分
        let RESERVE_LAY = [];
        function applyLayout(name) {
            layoutName = name;
            const lay = LAYOUTS[name];
            VB = lay.vb;
            RESERVE_LAY = lay.reserve || [];
            document.getElementById('metro-svg').setAttribute('viewBox', `0 0 ${VB.w} ${VB.h}`);
            Object.values(LINES).forEach(Ln => {
                Ln.hidden = !lay[Ln.id] || (mapMode === 'base' && CENTER_ONLY.includes(Ln.id));
                if (!lay[Ln.id]) return;
                Object.assign(Ln, { labelSide: {}, labelAt: {} }, lay[Ln.id]);
                Ln.path = makePath(Ln.pts);
                const anchors = [[0, 0], ...Ln.anchors.map(([i, x, y]) => [i, distOf(Ln.path, x, y)]), [Ln.n - 1, Ln.path.L]];
                Ln.dist = [];
                for (let a = 0; a < anchors.length - 1; a++) {
                    const [i0, d0] = anchors[a], [i1, d1] = anchors[a + 1];
                    for (let i = i0; i <= i1; i++) Ln.dist[i] = d0 + (d1 - d0) * (i - i0) / Math.max(1, i1 - i0);
                }
            });
        }
        const preferredLayout = () => window.__EDITOR__ ? 'landscape' : (window.innerWidth < window.innerHeight ? 'portrait' : 'landscape');
        const visibleLines = () => Object.values(LINES).filter(Ln => !Ln.hidden);
        applyLayout(preferredLayout());

        const stopDist = (lid, i) => LINES[lid].dist[i];
        const stopPoint = (lid, i, off = 0) => pointAt(LINES[lid].path, stopDist(lid, i), off);

        // 站名位置：依「往外」方向決定旋轉與對齊，避免壓到線
        function labelPlacement(v) {
            // 文字只用水平或 45°
            if (v.y < -0.5) return v.x < -0.3 ? { rot: 45, anchor: 'end' } : { rot: -45, anchor: 'start' };
            if (v.y > 0.5) return v.x < -0.3 ? { rot: -45, anchor: 'end' } : { rot: 45, anchor: 'start' };
            return v.x >= 0 ? { rot: 0, anchor: 'start' } : { rot: 0, anchor: 'end' };
        }

        // ==========================================
        //  PART 5: 車輛位置推算
        // ==========================================

        // 公車：同一車牌在路廊上各站的預計抵達時刻 → 目前位於哪兩站之間
        let BUS_TRACKS = {};
        function rebuildBusTracks() {
            BUS_TRACKS = {};
            BUS_LINES.forEach(lid => {
                const idxOf = new Map();
                DATA[lid].stops.forEach((st, i) => aliasesOf(st).forEach(n => idxOf.set(n, i)));
                const tracks = new Map();
                idxOf.forEach((i, name) => {
                    (EtaStore.byStop.get(name) || []).forEach(r => {
                        const [, sub, dir, dl, , , plate] = r;
                        if (!plate || dl === null) return;
                        const key = plate + '|' + sub + '|' + dir;
                        if (!tracks.has(key)) tracks.set(key, { key, plate, sub, dir, base: baseRoute(sub), pts: [] });
                        tracks.get(key).pts.push({ idx: i, dl });
                    });
                });
                tracks.forEach(t => {
                    t.pts.sort((a, b) => a.dl - b.dl);
                    // 行車方向：依序到達的站序遞增 = +1
                    t.sign = 0;
                    for (let k = 1; k < t.pts.length && !t.sign; k++) t.sign = Math.sign(t.pts[k].idx - t.pts[0].idx);
                    if (!t.sign) {
                        const r = DATA[lid].routes.find(x => x.name === t.base);
                        const d = r && r.dirs[String(t.dir)];
                        t.sign = d && d.enter > d.leave ? -1 : 1;
                    }
                    // 本路線在路廊的進入站 / 離開站 (依行車方向)
                    const r = DATA[lid].routes.find(x => x.name === t.base);
                    t.entry = r ? (t.sign > 0 ? r.cov[0] : r.cov[r.cov.length - 1]) : null;
                    t.exit = r ? (t.sign > 0 ? r.cov[r.cov.length - 1] : r.cov[0]) : null;
                    t.nextLine = (DATA.NEXT[lid] || {})[t.sub + '|' + t.dir] || null;   // 離開後接續的路廊
                });
                BUS_TRACKS[lid] = [...tracks.values()];
            });
        }

        function busPosition(lid, t, now) {
            const pts = t.pts;
            const j = pts.findIndex(p => p.dl > now);
            if (j === -1) {
                const last = pts[pts.length - 1];
                return now - last.dl > 30000 ? null : { d: stopDist(lid, last.idx), leaving: last.idx === t.exit };
            }
            const next = pts[j];
            // 即將入線：正從路廊外開向第一站；即將離線：1 分鐘內抵達最後一站後駛離路廊
            const entering = j === 0 && next.idx === t.entry;
            const leaving = next.idx === t.exit && next.dl - now < 60000;
            let prevIdx, prevDl;
            if (j > 0) {
                prevIdx = pts[j - 1].idx; prevDl = pts[j - 1].dl;
            } else {
                prevIdx = next.idx - t.sign;
                const T = pts[1] ? Math.min(300000, Math.max(30000, pts[1].dl - next.dl)) : 90000;
                prevDl = next.dl - T;
                if (now < prevDl) return null;               // 還沒開進路廊
                if (prevIdx < 0 || prevIdx >= LINES[lid].n) return next.dl - now < 20000 ? { d: stopDist(lid, next.idx), entering, leaving } : null;
            }
            const f = next.dl > prevDl ? Math.min(1, Math.max(0, (now - prevDl) / (next.dl - prevDl))) : 1;
            const d0 = stopDist(lid, prevIdx), d1 = stopDist(lid, next.idx);
            return { d: d0 + (d1 - d0) * f, entering, leaving };
        }

        // 捷運：依官方班距由兩端發車，套用站間行駛/停站秒數推算位置 (非即時)
        function hm(str, base) {
            const [h, m] = str.split(':').map(Number);
            return base + (h * 60 + m) * 60000;
        }
        function mrtDepartures(now) {
            const deps = [];
            [-1, 0].forEach(dayShift => {
                const day = new Date(now);
                day.setHours(0, 0, 0, 0);
                day.setDate(day.getDate() + dayShift);
                const base = day.getTime();
                const wd = day.getDay();
                const table = MRT.headways[(wd === 0 || wd === 6) ? 'holiday' : 'weekday'];
                const end = hm(MRT.end, base);
                let t = hm(MRT.start, base);
                while (t <= end) {
                    deps.push(t);
                    const h = table.find(([s, e]) => t >= hm(s, base) && t < hm(e, base));
                    t += (h ? h[2] : 20) * 60000;
                }
            });
            return deps;
        }
        function mrtTrains(now) {
            const deps = mrtDepartures(now);
            const out = [];
            [['south', 1], ['north', -1]].forEach(([dirKey, sign]) => {
                const prof = MRT[dirKey];
                const total = prof.arr[prof.arr.length - 1];
                deps.forEach(dep => {
                    const e = (now - dep) / 1000;
                    if (e < 0 || e > total) return;
                    let k = 0;
                    while (k < prof.arr.length - 1 && e >= prof.arr[k + 1]) k++;
                    let pos;   // 以行進方向的站序計
                    if (e < prof.dep[k]) pos = k;
                    else pos = k + Math.min(1, (e - prof.dep[k]) / (prof.arr[k + 1] - prof.dep[k]));
                    const n = MRT.stations.length;
                    const idx = sign > 0 ? pos : (n - 1 - pos);
                    const i0 = Math.floor(idx), i1 = Math.min(n - 1, i0 + 1);
                    const d = stopDist('mrt', i0) + (stopDist('mrt', i1) - stopDist('mrt', i0)) * (idx - i0);
                    out.push({ key: 'mrt|' + dirKey + '|' + dep, d, sign });
                });
            });
            return out;
        }
        // 某站某方向接下來的列車抵達時刻
        function mrtNextArrivals(idx, dirKey, now, count = 2) {
            const prof = MRT[dirKey];
            const n = MRT.stations.length;
            const k = dirKey === 'south' ? idx : n - 1 - idx;
            if (k >= n - 1) return [];   // 終點站不顯示此方向
            return mrtDepartures(now).map(dep => dep + prof.dep[k] * 1000).filter(t => t >= now).slice(0, count);
        }

        // ==========================================
        //  PART 6: 渲染
        // ==========================================

        const UI = {
            expanded: null,      // 目前展開的路廊
            highlight: null,     // 高亮的共線束 key
            panelMode: null,     // 'station' | 'corridor' | 'mrtline'
            current: null,       // { lid, idx }
            focus: null,         // 點擊的公車 { key, lid, base, sub, dir, plate, color }
            breath: null         // { lid, idx, until }
        };

        const mapRoot = document.getElementById('map-root');
        const defs = document.getElementById('svg-defs');
        let vehLayer = null;
        let vehEls = new Map();

        function renderMap() {
            mapRoot.innerHTML = '';
            const L = {};
            ['walk', 'trunks', 'routes', 'stations', 'labels', 'vehicles', 'titles'].forEach(k => L[k] = el('g', {}, mapRoot));
            const focus = UI.focus && !UI.focus.mrt ? UI.focus : null;
            document.getElementById('btn-live').classList.toggle('active', liveOn());
            mapRoot.classList.toggle('focus-mode', !!focus);
            const focusCov = {};
            if (focus) focusList(focus).forEach(f => BUS_LINES.forEach(l => {
                const r = DATA[l].routes.find(x => x.name === f.base);
                if (r) { focusCov[l] = focusCov[l] || new Set(); r.cov.forEach(i => focusCov[l].add(i)); }
            }));
            vehLayer = L.vehicles;
            vehEls = new Map();

            const labelReqs = [], titleBoxes = [];
            // 預留路廊：淡色虛線＋名稱 (沒有站點、車輛)
            RESERVE_LAY.forEach(r => {
                el('path', { d: roundedD(r.pts), stroke: r.color, class: 'reserve-line' }, L.walk);
                if (r.label) el('text', { x: r.label[0], y: r.label[1], 'text-anchor': 'middle', 'dominant-baseline': 'middle', class: 'reserve-label', fill: r.color }, L.walk).textContent = r.name;
            });
            visibleLines().forEach(Ln => {
                const ex = UI.expanded === Ln.id;
                const lineD = roundedD(Ln.pts);
                el('path', { d: lineD, stroke: Ln.color, class: 'metro-line' + (ex ? ' faded' : '') + (Ln.tier === 2 ? ' secondary' : '') + (Ln.tier === 3 ? ' secondary minor' : ''),
                             'data-act': 'trunk', 'data-lid': Ln.id }, L.trunks);
                if (Ln.kind === 'mrt') el('path', { d: lineD, class: 'rail-center' }, L.trunks);
                if (ex) drawGroups(Ln, L.routes);

                const [lo, hi] = ex ? [Ln.offMin, Ln.offMax] : (Ln.main ? [-4, 4] : [-2, 2]);
                stopsOf(Ln.id).forEach((st, i) => {
                    const p = stopPoint(Ln.id, i);
                    let xf = XFER_OF.get(Ln.id + ':' + i);
                    if (xf && xf.kind === 'join') {
                        if (xf.at[0][0] !== Ln.id || xf.at[0][1] !== i) return;   // 接續站只畫第一條路廊的站點
                        xf = null;
                    }
                    // 只畫重點站 (轉乘站、端點、指定重點站；捷運全部車站)；小站只用來推算車輛位置，展開路廊時才顯示
                    if (!ex && !xf && Ln.kind !== 'mrt' && i !== 0 && i !== Ln.n - 1 && !Ln.keys.has(i)) return;
                    if (!xf) {
                        const isBreath = UI.breath && UI.breath.lid === Ln.id && UI.breath.idx === i && UI.breath.until > Date.now();
                        const common = { class: 'station-marker' + (isBreath ? ' breathing' : ''), id: `station-${Ln.id}-${i}`,
                                         'data-act': 'station', 'data-lid': Ln.id, 'data-idx': i };
                        let mk;
                        if (ex) {
                            // 展開：橫跨平行線束的膠囊
                            const ang = Math.atan2(-p.nx, p.ny) * 180 / Math.PI;
                            const g = el('g', { transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})` }, L.stations);
                            mk = el('rect', { ...common, x: -6, y: lo - 6, width: 12, height: hi - lo + 12, rx: 6, ry: 6 }, g);
                        } else {
                            // 收合：白色圓角方塊、深灰外框 (捷運路網圖風格)；次要路廊用小圓點
                            if (Ln.tier === 1) {
                                const s = 13;
                                mk = el('rect', { ...common, class: common.class + ' station-dot station-sq', x: (p.x - s / 2).toFixed(1), y: (p.y - s / 2).toFixed(1),
                                                  width: s, height: s, rx: 3.5, ry: 3.5 }, L.stations);
                            } else {
                                mk = el('circle', { ...common, class: common.class + ' station-dot', cx: p.x.toFixed(1), cy: p.y.toFixed(1),
                                                    r: [0, 6.5, 5, 4][Ln.tier], style: `stroke:${Ln.color}` }, L.stations);
                            }
                        }
                        el('title', {}, mk).textContent = st.name;   // 游標指向顯示完整站名
                    } else if (xf.at[0][0] !== Ln.id || xf.at[0][1] !== i) {
                        return;   // 轉乘站名只寫一次
                    }

                    // 相鄰兩站簡稱相同 (如 逢甲大學(逢甲路)/(福星路)) 只寫一次
                    if (!xf && i > 0 && shortName(Ln.id, stopsOf(Ln.id)[i - 1].name) === shortName(Ln.id, st.name)) return;
                    // 轉乘站與端點站名常駐，其他站名放大後才顯示
                    const keyLabel = !!xf || i === 0 || i === Ln.n - 1;
                    const pad = ex ? 14 : (Ln.main ? 20 : 16);
                    const pref = (xf && xf.side) || Ln.labelSide[i] || -1;
                    const cands = [];
                    if (xf) {
                        // 轉乘站：先試四個斜角與上下左右 (避開交會的兩條線)
                        const ext = Math.max(...xf.at.map(([l]) => UI.expanded === l ? Math.max(-LINES[l].offMin, LINES[l].offMax) : 0));
                        [20, 32].forEach(r0 => {
                            const r = r0 + ext;
                            [[1, -1], [1, 1], [-1, -1], [-1, 1]].forEach(([dx, dy]) =>
                                cands.push({ x: p.x + dx * r, y: p.y + dy * r, rot: 0, anchor: dx > 0 ? 'start' : 'end' }));
                            [[0, -1, 'middle'], [0, 1, 'middle'], [1, 0, 'start'], [-1, 0, 'end']].forEach(([dx, dy, a]) =>
                                cands.push({ x: p.x + dx * (r + 6), y: p.y + dy * (r + 6), rot: 0, anchor: a }));
                        });
                    }
                    [pref, -pref].forEach(side => [0, 12, 26].forEach(extra => {
                        const lp = stopPoint(Ln.id, i, side < 0 ? lo - pad - extra : hi + pad + extra);
                        const pl = labelPlacement({ x: p.nx * side, y: p.ny * side });
                        cands.push({ x: lp.x, y: lp.y, rot: pl.rot, anchor: pl.anchor });
                        // 其他候選也只用 0° / ±45°
                        if (pl.rot) {
                            [-9, 9].forEach(sh => cands.push({ x: lp.x + p.ux * sh, y: lp.y + p.uy * sh, rot: pl.rot, anchor: pl.anchor }));
                        } else {
                            [-9, 9].forEach(sh => cands.push({ x: lp.x + p.ux * sh, y: lp.y + p.uy * sh, rot: 0, anchor: pl.anchor }));
                            [-45, 45].forEach(rt => cands.push({ x: lp.x, y: lp.y, rot: rt, anchor: pl.anchor }));
                        }
                    }));
                    if (i === 0 || i === Ln.n - 1) {
                        // 端點：線段外側
                        const dir = i === 0 ? -1 : 1, ox = p.ux * dir, oy = p.uy * dir;
                        cands.push({ x: p.x + ox * 16, y: p.y + oy * 16, rot: 0,
                                     anchor: Math.abs(ox) < 0.3 ? 'middle' : (ox > 0 ? 'start' : 'end') });
                    }
                    labelReqs.push({
                        text: xf ? xf.name : shortName(Ln.id, st.name), bold: !!xf,
                        prio: (xf ? 0 : keyLabel ? 1 : 2) + (Ln.main ? 0 : 0.5),
                        cls: 'station-label' + (xf ? ' xfer-label' : '') + (keyLabel ? '' : ' minor-label') +
                             (focusCov[Ln.id] && focusCov[Ln.id].has(i) ? ' on-route' : ''),
                        cands
                    });
                });

                // 規劃路線端點：路線代號方塊 (同色路線接續的端點不畫)
                if (Ln.plan && Ln.code) [0, Ln.n - 1].forEach(i => {
                    const xf = XFER_OF.get(Ln.id + ':' + i);
                    if (xf && xf.at.some(([l]) => l !== Ln.id && LINES[l].plan)) return;   // 端點是捷運轉乘站 (接續/環狀) 不畫
                    const p = stopPoint(Ln.id, i), s = i === 0 ? -1 : 1;
                    const cx = p.x + p.ux * s * 34, cy = p.y + p.uy * s * 34, bw = Ln.code.length > 1 ? 34 : 26;
                    const g = el('g', { class: 'line-badge', 'data-act': 'trunk', 'data-lid': Ln.id }, L.titles);
                    el('rect', { x: cx - bw / 2, y: cy - 13, width: bw, height: 26, rx: 5, fill: Ln.color }, g);
                    el('text', { x: cx, y: cy + 1, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: textColorFor(Ln.color) }, g).textContent = Ln.code;
                    titleBoxes.push([[cx - bw / 2 - 4, cy - 17], [cx + bw / 2 + 4, cy - 17], [cx + bw / 2 + 4, cy + 17], [cx - bw / 2 - 4, cy + 17]]);
                });
                // 路線名稱 (點擊展開/收合)；短接續路廊不放名稱
                if (!Ln.title) return;
                const [tx, ty] = Ln.title;
                const t = el('g', { class: 'corridor-title', 'data-act': 'trunk', 'data-lid': Ln.id }, L.titles);
                const label = Ln.name + (Ln.kind === 'bus' ? (ex ? ' ▾' : ' ▸') : '');
                const w = label.length * 15 + 20;
                const x0 = tx - w / 2;
                el('rect', { x: x0, y: ty - 14, width: w, height: 28, rx: 14, fill: Ln.color }, t);
                titleBoxes.push([[x0 - 4, ty - 18], [x0 + w + 4, ty - 18], [x0 + w + 4, ty + 18], [x0 - 4, ty + 18]]);
                el('text', { x: x0 + w / 2, y: ty + 1, 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, t).textContent = label;
            });

            if (!window.__FAST__) placeLabels(labelReqs, titleBoxes, L.labels);
            if (focus) focusList(focus).forEach(f => drawFocusRoute(f, L.routes));

            // 轉乘站：單一圖形
            INTERCHANGES.forEach(x => {
                const [a, b] = x.at.map(([lid, i]) => stopPoint(lid, i));
                if (x.walk) {
                    el('path', { d: `M ${a.x} ${a.y} L ${b.x} ${b.y}`, class: 'xfer-walk' }, L.walk);
                    return;
                }
                if (x.kind === 'join') return;
                const ext = Math.max(...x.at.map(([lid]) => UI.expanded === lid ? Math.max(-LINES[lid].offMin, LINES[lid].offMax) : 0));
                const [fl, fi] = x.at[0];
                const isBreath = UI.breath && UI.breath.until > Date.now() && x.at.some(([l, i]) => l === UI.breath.lid && i === UI.breath.idx);
                const attrs = { class: `station-marker xfer-${x.kind}` + (isBreath ? ' breathing' : ''), id: `station-${fl}-${fi}`,
                                'data-act': 'station', 'data-lid': fl, 'data-idx': fi };
                if (x.kind === 'rail') {
                    // 收合：圓角方形；所屬路廊展開時：沿該路廊法線拉長，蓋住平行線束但不遮住車輛
                    const exAt = x.at.find(([lid]) => UI.expanded === lid);
                    const q = exAt ? stopPoint(exAt[0], exAt[1]) : null;
                    const rot = q ? Math.atan2(-q.nx, q.ny) * 180 / Math.PI : 0;
                    const h = 13 + ext;
                    const g = el('g', { transform: `translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${rot.toFixed(1)})` }, L.stations);
                    el('rect', { ...attrs, x: -13, y: -h, width: 26, height: 2 * h, rx: 7, ry: 7 }, g);
                } else {
                    // 同點 (交叉)：沿第一條線的法線橫跨；兩點 (並排)：連接兩站
                    const dist = Math.hypot(b.x - a.x, b.y - a.y);
                    if (dist < 1 && !ext) {
                        // 同點交會：圓形轉乘站 (不帶方向)
                        el('circle', { ...attrs, cx: a.x.toFixed(1), cy: a.y.toFixed(1), r: 10 }, L.stations);
                        return;
                    }
                    const ang = dist < 1 ? Math.atan2(a.ny, a.nx) : Math.atan2(b.y - a.y, b.x - a.x);
                    const len = dist + 2 * (11 + ext);
                    const g = el('g', { transform: `translate(${((a.x + b.x) / 2).toFixed(1)} ${((a.y + b.y) / 2).toFixed(1)}) rotate(${(ang * 180 / Math.PI).toFixed(1)})` }, L.stations);
                    el('rect', { ...attrs, x: -len / 2, y: -8, width: len, height: 16, rx: 8, ry: 8 }, g);
                }
            });

            // 行程規劃：起訖站標記
            if (UI.plan) [['from', '起', '#43a047'], ['to', '迄', '#e53935']].forEach(([k, txt, c]) => {
                const s = UI.plan[k];
                if (!s || !LINES[s.lid]) return;
                const p = stopPoint(s.lid, s.idx);
                const g = el('g', { class: 'plan-pin', transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})` }, L.titles);
                el('path', { d: 'M 0 -6 L -9 -22 A 11 11 0 1 1 9 -22 Z', fill: c, stroke: '#fff', 'stroke-width': 2 }, g);
                el('text', { x: 0, y: -26, 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, g).textContent = txt;
            });

            updateVehicles();
        }
        // 聚焦可為單一路線或行程的多段路線
        const focusList = f => f.legs ? f.legs : [f];

        // 站名 → 路線圖上的位置 [(lid, idx)]
        let NAME_POS = null;
        function namePos(name) {
            if (!NAME_POS) {
                NAME_POS = new Map();
                Object.values(LINES).filter(Ln => Ln.kind === 'bus').forEach(Ln => DATA[Ln.id].stops.forEach((st, i) => aliasesOf(st).forEach(n => {
                    if (!NAME_POS.has(n)) NAME_POS.set(n, []);
                    NAME_POS.get(n).push([Ln.id, i]);
                })));
            }
            const out = (NAME_POS.get(name) || []).filter(([l]) => !LINES[l].hidden);
            // 「捷運○○站(…)」公車站牌 → 綠線車站 (沿文心路的公車可沿綠線畫)
            const m = !out.length && name.match(/^捷運(.+?)站/);
            if (m) { const i = MRT.stations.findIndex(s => s.name === m[1]); if (i >= 0) out.push(['mrt', i]); }
            return out;
        }
        // 點擊公車／路線：只畫選定方向，沿實際站序一路連續畫出 (在路線圖上的路段沿路線，
        //   離開路線圖的路段以虛線直接連到下一個回到路線圖的站)，箭頭標示行駛方向、終點標示去向
        function drawFocusRoute(f, layer) {
            const R = f.sub && (f.dir === 0 || f.dir === 1) ? routeStops(f.sub, f.dir) : null;
            if (!R) {
                if (!window.TXG_ROUTES && f.sub) loadRouteTable().then(() => { if (UI.focus) renderMap(); });
                return drawFocusRouteRuns(f, layer);
            }
            // 每站選一個位置：優先沿用上一站所在路線 (站序相鄰)，其次選後面幾站也在的路線
            const seq = [];
            let prev = null;
            R.s.forEach((name, k) => {
                const C = namePos(name);
                if (!C.length) { seq.push(null); return; }
                let pick = prev && C.find(([l, i]) => l === prev[0] && Math.abs(i - prev[1]) <= 4);
                if (!pick) {
                    const ahead = R.s.slice(k + 1, k + 4).map(n => namePos(n));
                    pick = C.find(([l, i]) => ahead.some(A => A.some(([l2, i2]) => l2 === l && Math.abs(i2 - i) <= 4))) || C[0];
                }
                seq.push(pick);
                prev = pick;
            });
            const mapped = seq.map((p, k) => p ? { p, k } : null).filter(Boolean);
            if (!mapped.length) return;
            const P = ([l, i]) => { const q = stopPoint(l, i); return [q.x, q.y]; };
            const solid = [], dashed = [];
            let cur = [P(mapped[0].p)];
            for (let m = 1; m < mapped.length; m++) {
                const a = mapped[m - 1], b = mapped[m];
                const [la, ia] = a.p, [lb, ib] = b.p;
                if (la === lb && Math.abs(ia - ib) <= 4 && b.k - a.k <= 4) {
                    const d0 = stopDist(la, ia), d1 = stopDist(lb, ib);
                    const pts = offsetPolyline(LINES[la].path, Math.min(d0, d1), Math.max(d0, d1), 0);
                    if (d1 < d0) pts.reverse();
                    cur.push(...pts.slice(1));
                } else {
                    // 換到另一條路線或離開路線圖：結束目前的實線，用虛線連到下一站
                    const pa = P(a.p), pb = P(b.p);
                    if (cur.length > 1) solid.push(cur);
                    dashed.push([pa, pb]);
                    cur = [pb];
                }
            }
            if (cur.length > 1) solid.push(cur);
            const all = [...solid, ...dashed];
            all.forEach(pts => el('path', { d: ptsToD(pts), class: 'focus-route-bg' }, layer));
            dashed.forEach(pts => el('path', { d: ptsToD(pts), class: 'focus-route offmap', stroke: f.color }, layer));
            solid.forEach(pts => el('path', { d: ptsToD(pts), class: 'focus-route', stroke: f.color }, layer));
            // 行駛方向箭頭 (每隔一段距離)
            const path = []; solid.concat(dashed).length && (() => {
                let acc = 0;
                const segs = [];
                solid.forEach(pts => { for (let k = 1; k < pts.length; k++) segs.push([pts[k - 1], pts[k]]); });
                dashed.forEach(([a, b]) => segs.push([a, b]));
                segs.forEach(([a, b]) => {
                    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
                    if (L < 1) return;
                    for (let t = (120 - acc % 120); t < L; t += 120) {
                        const x = a[0] + (b[0] - a[0]) * t / L, y = a[1] + (b[1] - a[1]) * t / L, ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
                        path.push(`<path d="M -5 -6 L 4 0 L -5 6" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})"/>`);
                    }
                    acc += L;
                });
            })();
            const ar = el('g', { class: 'focus-arrows' }, layer);
            ar.innerHTML = path.join('');
            // 起點圓點、終點箭頭＋去向 (起終點不在路線圖上時標出前後站名)
            const first = mapped[0], last = mapped[mapped.length - 1];
            const p0 = P(first.p), p1 = P(last.p);
            el('circle', { cx: p0[0], cy: p0[1], r: 7, class: 'focus-start', stroke: f.color }, layer);
            const prevPt = (() => { const sl = solid[solid.length - 1], dl = dashed[dashed.length - 1]; const lastSeg = sl && sl[sl.length - 1][0] === p1[0] && sl[sl.length - 1][1] === p1[1] ? sl.slice(-2) : dl || [p0, p1]; return lastSeg[0]; })();
            let vx = p1[0] - prevPt[0], vy = p1[1] - prevPt[1]; const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
            const tx = p1[0] + vx * 26, ty = p1[1] + vy * 26;
            el('path', { d: `M ${p1[0]} ${p1[1]} L ${tx} ${ty}`, class: 'focus-route', stroke: f.color }, layer);
            el('path', { d: `M -7 -8 L 6 0 L -7 8 Z`, transform: `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${(Math.atan2(vy, vx) * 180 / Math.PI).toFixed(1)})`, fill: f.color, class: 'focus-head' }, layer);
            const dest = (DEST[f.sub] && DEST[f.sub][f.dir]) || R.s[R.s.length - 1];
            const anchor = Math.abs(vx) < 0.3 ? 'middle' : (vx < 0 ? 'end' : 'start');
            el('text', { x: tx + vx * 12, y: ty + vy * 16 + 4, 'text-anchor': anchor, class: 'focus-end' }, layer).textContent =
                `${f.sub} 往 ${dest}` + (last.k < R.s.length - 1 ? `（之後不在圖上，再 ${R.s.length - 1 - last.k} 站）` : '');
            if (first.k > 0) el('text', { x: p0[0], y: p0[1] - 16, 'text-anchor': 'middle', class: 'focus-end' }, layer).textContent = `起站 ${R.s[0]}（${first.k} 站前）`;
        }

        // 舊畫法 (沒有站序資料時)：在每個行經的路廊畫出該路線的行駛區間與兩端去向
        function drawFocusRouteRuns(f, layer) {
            BUS_LINES.forEach(lid => {
                const Ln = LINES[lid];
                const r = DATA[lid].routes.find(x => x.name === f.base);
                if (!r) return;
                const g = Ln.groupOfRoute[f.base];
                const off = UI.expanded === lid && g && g.lane !== null ? g.off : 0;
                const D = i => stopDist(lid, i);
                const runs = splitRuns(r.cov);
                runs.forEach((run, k) => {
                    const pts = ptsToD(offsetPolyline(Ln.path, D(run[0]), D(run[1]), off));
                    if (run[1] > run[0]) {
                        el('path', { d: pts, class: 'focus-route-bg' }, layer);
                        el('path', { d: pts, class: 'focus-route', stroke: f.color }, layer);
                    }
                    if (k > 0) el('path', { d: ptsToD(offsetPolyline(Ln.path, D(runs[k - 1][1]), D(run[0]), off)), class: 'focus-route gap', stroke: f.color }, layer);
                });
                const ends = groupEnds({ routes: [r] });
                [['low', r.cov[0], -1], ['high', r.cov[r.cov.length - 1], 1]].forEach(([side, idx, s]) => {
                    if (!ends[side].length) return;
                    const p = stopPoint(lid, idx, off);
                    const tx = p.x + p.ux * s * 30, ty = p.y + p.uy * s * 30;
                    el('path', { d: `M ${p.x} ${p.y} L ${tx} ${ty}`, class: 'focus-route', stroke: f.color }, layer);
                    const anchor = Math.abs(p.ux) < 0.3 ? 'middle' : (p.ux * s < 0 ? 'end' : 'start');
                    el('text', { x: tx + p.ux * s * 8, y: ty + p.uy * s * 14 + 4, 'text-anchor': anchor, class: 'focus-end' }, layer)
                        .textContent = '→ ' + ends[side].join('、');
                });
            });
        }

        // ---------- 站名避讓：依優先序逐一擺放，選第一個不壓線、不壓字的候選位置 ----------
        // 以實際字型量測文字寬高 (快取)
        const textSizeCache = new Map();
        function textSize(s, cls, layer) {
            const key = cls + '|' + s;
            if (!textSizeCache.has(key)) {
                const m = el('text', { x: 0, y: 0, class: cls, 'dominant-baseline': 'middle', style: 'visibility:hidden; display:inline' }, layer);
                m.textContent = s;
                const b = m.getBBox();
                m.remove();
                textSizeCache.set(key, b.width > 0 ? [b.width + 5, b.height + 3] : [[...s].length * 11.5 + 5, 17]);
            }
            return textSizeCache.get(key);
        }
        function labelPoly(c, w, h = 14) {
            const x0 = c.anchor === 'start' ? c.x : c.anchor === 'end' ? c.x - w : c.x - w / 2;
            const pts = [[x0, c.y - h / 2], [x0 + w, c.y - h / 2], [x0 + w, c.y + h / 2], [x0, c.y + h / 2]];
            if (!c.rot) return pts;
            const a = c.rot * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
            return pts.map(([x, y]) => [c.x + (x - c.x) * co - (y - c.y) * si, c.y + (x - c.x) * si + (y - c.y) * co]);
        }
        function polysOverlap(A, B) {
            for (const P of [A, B]) for (let i = 0; i < P.length; i++) {
                const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length], nx = y2 - y1, ny = x1 - x2;
                const pa = A.map(([x, y]) => x * nx + y * ny), pb = B.map(([x, y]) => x * nx + y * ny);
                if (Math.max(...pa) <= Math.min(...pb) + 1 || Math.max(...pb) <= Math.min(...pa) + 1) return false;
            }
            return true;
        }
        function nearPoly(P, x, y, r) {
            let inside = true, s = 0;
            for (let i = 0; i < P.length; i++) {
                const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length];
                const c = (x2 - x1) * (y - y1) - (y2 - y1) * (x - x1);
                if (c !== 0) { if (!s) s = Math.sign(c); else if (Math.sign(c) !== s) inside = false; }
                const L2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
                const tt = Math.max(0, Math.min(1, ((x - x1) * (x2 - x1) + (y - y1) * (y2 - y1)) / L2));
                if (Math.hypot(x - x1 - tt * (x2 - x1), y - y1 - tt * (y2 - y1)) < r) return true;
            }
            return inside;
        }
        let skippedLabels = [];
        function placeLabels(reqs, titleBoxes, layer) {
            skippedLabels = [];
            const CELL = 40, grid = new Map();
            const bboxOf = P => [Math.min(...P.map(p => p[0])), Math.min(...P.map(p => p[1])), Math.max(...P.map(p => p[0])), Math.max(...P.map(p => p[1]))];
            const cells = ([x0, y0, x1, y1]) => {
                const out = [];
                for (let cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++)
                    for (let cy = Math.floor(y0 / CELL); cy <= Math.floor(y1 / CELL); cy++) out.push(cx + ',' + cy);
                return out;
            };
            const add = (item, bb) => cells(bb).forEach(k => { if (!grid.has(k)) grid.set(k, []); grid.get(k).push(item); });
            // 障礙物：所有路線 (沿線取樣點，半徑＝線寬一半＋間隙)、轉乘站圖形、路線名稱膠囊
            visibleLines().forEach(Ln => {
                const ex = UI.expanded === Ln.id;
                const r = ex ? Math.max(-Ln.offMin, Ln.offMax) + 8 : (Ln.main ? 10 : 7);
                for (let d = 0; d <= Ln.path.L; d += 4) {
                    const q = pointAt(Ln.path, d);
                    add({ pt: [q.x, q.y], r }, [q.x - r, q.y - r, q.x + r, q.y + r]);
                }
            });
            INTERCHANGES.filter(x => !x.walk && x.kind !== 'join').forEach(x => x.at.forEach(([l, i]) => {
                if (LINES[l].hidden) return;
                const q = stopPoint(l, i);
                add({ pt: [q.x, q.y], r: 17 }, [q.x - 17, q.y - 17, q.x + 17, q.y + 17]);
            }));
            titleBoxes.forEach(P => add({ poly: P }, bboxOf(P)));

            reqs.sort((a, b) => a.prio - b.prio).forEach(req => {
                let [w, h] = textSize(req.text, req.cls.replace(' minor-label', ''), layer);
                if (req.bold) { w += 6; h += 4; }   // 轉乘站名留較大間距
                let best = null;
                for (const c of req.cands) {
                    const P = labelPoly(c, w, h), bb = bboxOf(P);
                    const seen = new Set();
                    let score = 0;
                    cells(bb).forEach(k => (grid.get(k) || []).forEach(o => {
                        if (seen.has(o)) return;
                        seen.add(o);
                        if (o.pt ? nearPoly(P, o.pt[0], o.pt[1], o.r) : polysOverlap(P, o.poly)) score += o.pt ? 3 : 2;
                    }));
                    if (!best || score < best.score) best = { c, P, bb, score };
                    if (score === 0) break;
                }
                // 找不到空位時：逐站站名 (放大才顯示) 寧可不寫，也不疊字；轉乘站／端點仍寫出
                if (best.score > 0 && req.prio >= 2) { skippedLabels.push(req.text); return; }
                const { c, P, bb } = best;
                add({ poly: P }, bb);
                el('text', { x: c.x.toFixed(1), y: c.y.toFixed(1), 'text-anchor': c.anchor,
                             transform: c.rot ? `rotate(${c.rot} ${c.x.toFixed(1)} ${c.y.toFixed(1)})` : '',
                             class: req.cls, 'dominant-baseline': 'middle' }, layer).textContent = req.text;
            });
        }

        function drawGroups(Ln, layer) {
            el('path', { d: ptsToD(Ln.pts), class: 'band', stroke: Ln.color, 'stroke-width': Ln.offMax - Ln.offMin + 20 }, layer);
            const D = i => stopDist(Ln.id, i);

            Ln.groups.forEach(g => {
                const isHl = UI.highlight === g.key;
                if (g.lane === null && !isHl) return;    // 短程路線：只有被點選時才畫
                const off = g.lane === null ? Ln.offMax + LANE * 1.5 : g.off;
                let cls = 'route-line';
                if (UI.highlight) cls += isHl ? ' hl' : ' dim';
                const ge = el('g', { class: cls, 'data-act': 'group', 'data-key': g.key }, layer);
                const first = g.cov[0], last = g.cov[g.cov.length - 1];
                const sgn = off >= 0 ? 1 : -1;

                if (g.express) {
                    // 跳站 / 快速公車：點狀線貫穿，白點標出停靠站
                    el('path', { d: ptsToD(offsetPolyline(Ln.path, D(first), D(last), off)), stroke: g.color, class: 'seg express' }, ge);
                } else {
                    const runs = splitRuns(g.cov);
                    runs.forEach((r, ri) => {
                        if (r[1] > r[0]) el('path', { d: ptsToD(offsetPolyline(Ln.path, D(r[0]), D(r[1]), off)), stroke: g.color, class: 'seg' }, ge);
                        if (ri === 0) return;
                        const prev = runs[ri - 1];
                        const gap = r[0] - prev[1] - 1;
                        if (gap <= 5) {
                            // 短暫離開路廊 (繞行)：向外拱出的虛線
                            const p0 = stopPoint(Ln.id, prev[1], off), p1 = stopPoint(Ln.id, r[0], off);
                            const m = pointAt(Ln.path, (D(prev[1]) + D(r[0])) / 2, off + sgn * 30);
                            const cx = 2 * m.x - (p0.x + p1.x) / 2, cy = 2 * m.y - (p0.y + p1.y) / 2;
                            el('path', { d: `M ${p0.x} ${p0.y} Q ${cx} ${cy} ${p1.x} ${p1.y}`, stroke: g.color, class: 'seg detour' }, ge);
                        } else {
                            el('path', { d: ptsToD(offsetPolyline(Ln.path, D(prev[1]), D(r[0]), off)), stroke: g.color, class: 'seg skip' }, ge);
                        }
                    });
                }

                g.cov.forEach(i => {
                    const p = stopPoint(Ln.id, i, off);
                    el('circle', { cx: p.x, cy: p.y, r: 1.6, class: 'serve-dot' }, ge);
                });

                // 分岔短線：路線在此端離開路廊
                [['low', first, -1], ['high', last, 1]].forEach(([side, idx, dirSign]) => {
                    const dests = g.ends[side];
                    if (!dests.length) return;
                    const p = stopPoint(Ln.id, idx, off);
                    let vx = p.ux * dirSign, vy = p.uy * dirSign;
                    if (off !== 0) { vx += p.nx * sgn * 0.9; vy += p.ny * sgn * 0.9; }
                    const vl = Math.hypot(vx, vy); vx /= vl; vy /= vl;
                    const tx = p.x + vx * 24, ty = p.y + vy * 24;
                    el('path', { d: `M ${p.x} ${p.y} L ${tx} ${ty}`, stroke: g.color, class: 'stub' }, ge);
