                    el('circle', { cx: tx, cy: ty, r: 3, fill: g.color, class: 'stub-tip' }, ge);
                    if (isHl) {
                        const anchor = Math.abs(vx) < 0.3 ? 'middle' : (vx < 0 ? 'end' : 'start');
                        const txt = dests.slice(0, 3).join('、') + (dests.length > 3 ? ' 等' : '');
                        el('text', { x: tx + vx * 6, y: ty + vy * 6 + (Math.abs(vx) < 0.3 ? vy * 6 : 3), 'text-anchor': anchor, class: 'stub-label' }, ge)
                            .textContent = '→ ' + txt;
                    }
                });

                el('path', { d: ptsToD(offsetPolyline(Ln.path, D(first), D(last), off)), class: 'hit' }, ge);
            });
        }

        // 每秒更新車輛位置 (沿用同一個元素，CSS transition 讓移動連續)
        //   收合：白色方塊 (路線兩側，右側通行)；展開：路線色小方塊 (所屬路線車道兩側)
        const tagWidth = s => [...s].reduce((w, c) => w + (/[\x00-\x7f]/.test(c) ? 5.5 : 9.5), 8);
        const dimForFocus = t => !!(UI.focus && (UI.focus.mrt || !focusList(UI.focus).some(f => f.base === t.base)));
        // 即時車輛開關 (關閉時不畫車輛、不在背景抓全部站牌即時資料；點站牌仍會查該站到站時間)
        const LIVE_KEY = 'txg_live';
        const liveOn = () => { try { return localStorage.getItem(LIVE_KEY) !== '0'; } catch (e) { return true; } };
        function toggleLive() {
            const on = !liveOn();
            try { localStorage.setItem(LIVE_KEY, on ? '1' : '0'); } catch (e) {}
            document.getElementById('btn-live').classList.toggle('active', on);
            if (on) CHUNKS.forEach(c => EtaStore.request(c.id));
            updateVehicles();
        }
        function updateVehicles() {
            if (!vehLayer) return;
            if (!liveOn()) { vehEls.forEach(e => e.remove()); vehEls.clear(); return; }
            const now = Date.now();
            const want = new Map();

            BUS_LINES.forEach(lid => {
                const Ln = LINES[lid];
                const ex = UI.expanded === lid;
                (BUS_TRACKS[lid] || []).forEach(t => {
                    const pos = busPosition(lid, t, now);
                    if (!pos) return;
                    let off, style;
                    if (ex) {
                        const g = Ln.groupOfRoute[t.base];
                        if (!g) return;
                        const isHl = UI.highlight === g.key;
                        if (g.lane === null && !isHl) return;
                        const laneOff = g.lane === null ? Ln.offMax + LANE * 1.5 : g.off;
                        off = laneOff + t.sign * 4;
                        style = { kind: 'mini', color: g.color, dim: (UI.highlight && !isHl) || dimForFocus(t) };
                    } else {
                        off = t.sign * (Ln.main ? VEH_OFF : 12);
                        style = { kind: 'box', dim: dimForFocus(t) };
                    }
                    const blinkColor = pos.entering ? Ln.color : (pos.leaving && t.nextLine ? LINES[t.nextLine].color : null);
                    want.set(lid + '|' + t.key, { lid, d: pos.d, off, sign: t.sign, style, blink: pos.entering || pos.leaving, blinkColor, tag: t.sub });
                });
            });
            mrtTrains(now).forEach(tr => {
                want.set(tr.key, { lid: 'mrt', d: tr.d, off: tr.sign * VEH_OFF, sign: tr.sign, style: { kind: 'box', dim: !!(UI.focus && !UI.focus.mrt) },
                                   blink: false, tag: tr.sign > 0 ? '綠線 往高鐵臺中站' : '綠線 往北屯總站' });
            });

            vehEls.forEach((e, k) => {
                const v = want.get(k);
                if (!v || e.dataset.kind !== v.style.kind) { e.remove(); vehEls.delete(k); }
            });
            want.forEach((v, k) => {
                const p = pointAt(LINES[v.lid].path, v.d, v.off);
                const ang = Math.atan2(p.uy * v.sign, p.ux * v.sign) * 180 / Math.PI;
                let e = vehEls.get(k);
                if (!e) {
                    e = el('g', { class: 'veh', 'data-act': 'veh', 'data-key': k }, vehLayer);
                    e.dataset.kind = v.style.kind;
                    const body = el('g', { class: 'veh-body' }, e);
                    if (v.style.kind === 'box') {
                        el('rect', { x: -5, y: -5, width: 10, height: 10, rx: 3, class: 'veh-box' }, body);
                        el('path', { d: 'M -2.5 -3 L 3 0 L -2.5 3 Z', class: 'veh-arrow' }, body);
                    } else {
                        el('rect', { x: -3.5, y: -3.5, width: 7, height: 7, rx: 2, class: 'veh-mini', fill: v.style.color }, body);
                        el('path', { d: 'M -1.6 -2 L 2 0 L -1.6 2 Z', fill: textColorFor(v.style.color) }, body);
                    }
                    // 路線代號標籤 (不跟著車頭旋轉)
                    const tag = el('g', { class: 'veh-tag' }, e);
                    const w = tagWidth(v.tag), top = v.style.kind === 'box' ? -20 : -16;
                    el('rect', { x: -w / 2, y: top, width: w, height: 13, rx: 4 }, tag);
                    el('text', { x: 0, y: top + 7, 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, tag).textContent = v.tag;
                    e.style.transition = 'none';
                    e.style.transform = `translate(${p.x}px, ${p.y}px)`;
                    void e.getBoundingClientRect();
                    e.style.transition = '';
                    vehEls.set(k, e);
                } else {
                    e.style.transform = `translate(${p.x}px, ${p.y}px)`;
                }
                e.firstChild.setAttribute('transform', `rotate(${ang.toFixed(1)})`);
                e.classList.toggle('dim', !!v.style.dim);
                e.classList.toggle('pinned', !!(UI.focus && UI.focus.key === k));
                e.classList.toggle('blink', !!v.blink && !v.blinkColor);
                e.classList.toggle('blink-color', !!v.blinkColor);
                if (v.blinkColor) e.style.setProperty('--blink', v.blinkColor);
            });
        }

        // ==========================================
        //  PART 7: 縮放與互動
        // ==========================================

        const elem = document.getElementById('scene-container');
        const panzoom = Panzoom(elem, { maxScale: 6, minScale: 0.4, startScale: 1.0 });
        elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel);
        document.getElementById('zoom-in').addEventListener('click', panzoom.zoomIn);
        document.getElementById('zoom-out').addEventListener('click', panzoom.zoomOut);
        document.getElementById('reset').addEventListener('click', panzoom.reset);

        // 逐站站名：字高換算到螢幕上 >= 9px 才顯示 (轉乘站／端點站名常駐)
        const svgEl = document.getElementById('metro-svg');
        function updateLabelVisibility(scale = panzoom.getScale()) {
            const k = Math.min(elem.clientWidth / VB.w, elem.clientHeight / VB.h);
            svgEl.classList.toggle('show-labels', 19 * k * scale >= 9);
        }
        elem.addEventListener('panzoomchange', e => updateLabelVisibility(e.detail.scale));
        updateLabelVisibility();

        // 分支功能：放大中區交通節點 (五權路／民權路／雙十路接續段)，再按一次回到簡化路網
        function toggleCenterMode() {
            mapMode = mapMode === 'base' ? 'center' : 'base';
            INTERCHANGES = mapMode === 'center' ? CENTER_INTERCHANGES : BASE_INTERCHANGES;
            BUS_LINES = ALL_BUS_LINES.filter(l => mapMode === 'center' || !CENTER_ONLY.includes(l));
            indexInterchanges();
            if (UI.expanded && CENTER_ONLY.includes(UI.expanded)) UI.expanded = null;
            UI.focus = null; UI.highlight = null;
            closePanel();
            applyLayout(layoutName);
            rebuildBusTracks();
            renderMap();
            updateLabelVisibility();
            if (mapMode === 'center') {
                const p = stopPoint('zx', 34);
                focusSvgPoint(p.x, p.y, readableScale());
            } else {
                panzoom.reset();
            }
        }

        // 轉向 (直式 ↔ 橫式) 時切換版面
        window.addEventListener('resize', () => {
            const want = preferredLayout();
            if (want === layoutName) { updateLabelVisibility(); return; }
            applyLayout(want);
            panzoom.reset({ animate: false });
            renderMap();
            updateLabelVisibility(1);
            if (UI.current) setTimeout(() => { const p = stopPoint(UI.current.lid, UI.current.idx); focusSvgPoint(p.x, p.y, readableScale()); }, 30);
            else if (UI.expanded) setTimeout(() => fitCorridor(UI.expanded), 30);
        });

        // 拖曳地圖時不要誤觸站點
        let downXY = null;
        document.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; }, true);
        const wasDrag = e => downXY && Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 8;

        document.getElementById('metro-svg').addEventListener('click', e => {
            if (window.__EDITOR__ || wasDrag(e)) return;
            const t = e.target.closest('[data-act]');
            if (!t) { closePanel(); return; }
            const act = t.dataset.act;
            if (act === 'station') handleStationClick(t.dataset.lid, Number(t.dataset.idx));
            else if (act === 'trunk') toggleCorridor(t.dataset.lid);
            else if (act === 'group') selectGroup(t.dataset.key, true);
            else if (act === 'veh') focusVehicle(t.dataset.key);
        });

        // 點站／中區節點時的放大倍率：至少讓逐站站名在螢幕上有 9.5px (手機直式需要放大較多)
        function readableScale() {
            const k = Math.min(elem.clientWidth / VB.w, elem.clientHeight / VB.h);
            return Math.min(6, Math.max(2.4, 9.5 / (11 * k)));
        }

        // 把 SVG 座標 (x, y) 移到「面板上方剩餘空間」的中心
        function focusSvgPoint(x, y, scale) {
            const W = elem.clientWidth, H = elem.clientHeight;
            const k = Math.min(W / VB.w, H / VB.h);
            const px = (W - VB.w * k) / 2 + k * x;
            const py = (H - VB.h * k) / 2 + k * y;
            const panelH = panel.classList.contains('active') ? panel.offsetHeight + 20 : 0;
            const targetX = W / 2, targetY = (H - panelH) / 2;
            // Panzoom: transform = scale(s) translate(tx, ty)，原點在元素中心
            const tx = W / 2 + (targetX - W / 2) / scale - px;
            const ty = H / 2 + (targetY - H / 2) / scale - py;
            panzoom.zoom(scale, { animate: true, duration: 600 });
            panzoom.pan(tx, ty, { animate: true, duration: 600, force: true });
        }

        function fitCorridor(lid) {
            const Ln = LINES[lid];
            const xs = Ln.pts.map(p => p[0]), ys = Ln.pts.map(p => p[1]);
            const bw = Math.max(...xs) - Math.min(...xs) + 200, bh = Math.max(...ys) - Math.min(...ys) + 200;
            const W = elem.clientWidth, H = elem.clientHeight;
            const k = Math.min(W / VB.w, H / VB.h);
            const panelH = panel.offsetHeight + 20;
            const s = Math.min(3, Math.max(0.5, Math.min(W / (bw * k), (H - panelH) / (bh * k))));
            focusSvgPoint((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2, s);
        }

        // ==========================================
        //  PART 8: 面板
        // ==========================================

        const panel = document.getElementById('info-panel');
        const title = document.getElementById('panel-title');
        const desc = document.getElementById('panel-desc');
        const badgesContainer = document.getElementById('line-badges');

        let isAutoRefreshOn = false;

        const STATUS_TEXT = { 1: '尚未發車', 2: '交管不停靠', 3: '末班車已過', 4: '今日未營運' };

        function textColorFor(hex) {
            const n = parseInt(hex.slice(1), 16);
            const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
            return lum > 0.65 ? '#111' : '#fff';
        }
        // 幹線：路線號碼底色、幹線名稱、幹線 icon (只加在主線號碼)；與 taichung-query.html 同一份規則
        const TRUNK = [
            { re: /^100$/, c: '#595758', name: '復興幹線', main: '100' },
            { re: /^200(跳蛙公車)?$/, c: '#987557', name: '中興幹線', main: '200' },
            { re: /^300$/, c: '#1E9CC2', name: '台灣大道幹線', main: '300' },
            { re: /^(30[1-9]|310)(?![0-9])/, c: '#1E9CC2' },
            { re: /^500(?![0-9])/, c: '#E3925D', name: '中清幹線', main: '500' },
            { re: /^700(?![0-9])/, c: '#F0DE00', name: '崇德幹線', main: '700' },
            { re: /^900(?![0-9])/, c: '#860000', name: '北屯幹線', main: '900' }
        ];
        const trunkOf = sub => { const t = TRUNK.find(x => x.re.test(String(sub))); return t ? { c: t.c, name: t.name || '', icon: t.main === String(sub) } : null; };
        function badgeHtml(name, color, extra = '', cls = '') {
            const t = name === '捷運' ? null : trunkOf(name);
            if (t) color = t.c;
            const ic = t && t.icon ? '<img class="tk-ic" src="data/trunk.png" alt="">' : '';
            return `<span class="route-badge ${cls}" style="background:${color}; color:${textColorFor(color)}"${t && t.name ? ` title="${t.name}"` : ''} ${extra}>${ic}${name}</span>`;
        }
        function hhmm(iso) {
            const d = new Date(iso);
            return isNaN(d) ? '' : d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        function remainHtml(deadline) {
            const s = Math.floor((deadline - Date.now()) / 1000);
            if (s <= 30) return '<span class="arriving">進站中</span>';
            const m = Math.floor(s / 60), ss = String(s % 60).padStart(2, '0');
            return s < 180 ? `<span class="coming-soon">${m}分 ${ss}秒</span>` : `${m}分 ${ss}秒`;
        }

        function dataAgeText(chunkId) {
            const snap = EtaStore.snaps[chunkId];
            if (!snap) {
                if (EtaStore.lastError) return '更新失敗：' + EtaStore.lastError;
                return '資料載入中...';
            }
            const t = new Date(snap.fetchedAt).toLocaleTimeString('zh-TW', { hour12: false });
            let s = `資料更新時間: ${t}（${Math.round(EtaStore.age(chunkId) / 1000)} 秒前）`;
            if (EtaStore.inflight === chunkId) s += ' · 更新中...';
            else if (EtaStore.queue.includes(chunkId) && EtaStore.pendingTimer) s += ` · 額度用完，${Math.ceil(ApiBudget.waitMs() / 1000)} 秒後更新`;
            if (EtaStore.lastError) s += ' · ' + EtaStore.lastError;
            return s;
        }

        function transferButtons(lid, idx) {
            const btns = [];
            INTERCHANGES.forEach(x => {
                if (x.kind === 'join' || !x.at.some(([l, i]) => l === lid && i === idx)) return;
                x.at.forEach(([l, i]) => {
                    if (l === lid && i === idx) return;
                    btns.push(`<button class="panel-btn" onclick="handleStationClick('${l}', ${i})">⇄ ${LINES[l].name}・${stopsOf(l)[i].name}${x.walk ? '（步行）' : ''}</button>`);
                });
            });
            if (lid !== 'mrt') btns.push(`<button class="panel-btn" onclick="location.href='taichung-query.html?station=' + encodeURIComponent('${stopsOf(lid)[idx].name.replace(/'/g, "\\'")}')">🔍 站位時刻表</button>`);
            btns.push(`<button class="panel-btn" onclick="setPlanPoint('from', '${lid}', ${idx})">🚩 從這裡出發</button>`,
                      `<button class="panel-btn" onclick="setPlanPoint('to', '${lid}', ${idx})">🏁 到這裡</button>`);
            return `<div class="panel-actions">${btns.join('')}</div>`;
        }

        // 主要入口：處理車站點擊的所有連動行為
        function handleStationClick(lid, idx) {
            const st = stopsOf(lid)[idx];
            if (!st) return;
            if (UI.planPick) { setPlanPoint(UI.planPick, lid, idx); return; }   // 行程規劃：點地圖選起訖站
            UI.focus = null;
            UI.current = { lid, idx };
            UI.panelMode = 'station';
            UI.breath = { lid, idx, until: Date.now() + 3000 };
            setTimeout(() => { UI.breath = null; const m = document.getElementById(`station-${lid}-${idx}`); if (m) m.classList.remove('breathing'); }, 3000);

            renderStationPanel(true);
            renderMap();
            if (LINES[lid].kind === 'bus') EtaStore.request(chunkOfStation(lid, idx));   // 快取新鮮就不會打 API

            setTimeout(() => {
                const p = stopPoint(lid, idx);
                focusSvgPoint(p.x, p.y, readableScale());
            }, 30);
        }

        function renderStationPanel(fresh) {
            const { lid, idx } = UI.current;
            if (LINES[lid].kind === 'mrt') return renderMrtStationPanel(idx);
            if (LINES[lid].kind === 'bus' && DATA[lid]) return renderDirStationPanel(fresh);
            const st = DATA[lid].stops[idx];
            const Ln = LINES[lid];
            const keepScroll = fresh ? 0 : panel.scrollTop;
            const chunkId = chunkOfStation(lid, idx);

            title.textContent = st.name;
            desc.innerHTML = `${Ln.full} · <span id="data-age" data-chunk="${chunkId}">${dataAgeText(chunkId)}</span>`;
            panel.classList.add('active');

            const colorOf = name => {
                const g = Ln.groupOfRoute[name];
                return g ? (UI.expanded === lid ? g.color : Ln.color) : '#555';
            };

            const xfer = transferButtons(lid, idx);
            if (!EtaStore.snaps[chunkId]) {
                // 尚無資料：先畫出路廊路線的骨架
                badgesContainer.innerHTML = xfer + Object.keys(Ln.groupOfRoute).slice(0, 12).map(name =>
                    `<div class="line-group">${badgeHtml(name, colorOf(name))}<div class="arrival-time"><span class="muted">Loading...</span></div></div>`
                ).join('');
                return;
            }

            // 依路線分組；同子路線同方向若有多個站牌 (如不同月台) 取最快的一筆
            const byRoute = new Map();
            EtaStore.rowsForStation(st).forEach(r => {
                const base = baseRoute(r[1]);
                if (!byRoute.has(base)) byRoute.set(base, new Map());
                const m = byRoute.get(base), key = r[1] + '|' + r[2], prev = m.get(key);
                if (!prev || (r[3] !== null && (prev[3] === null || r[3] < prev[3]))) m.set(key, r);
            });

            const groups = [...byRoute.entries()].map(([base, m]) => {
                const list = [...m.values()].sort((a, b) => (a[3] ?? Infinity) - (b[3] ?? Infinity) || a[2] - b[2]);
                return { base, list, soonest: list[0][3] ?? Infinity };
            }).sort((a, b) => a.soonest - b.soonest || a.base.localeCompare(b.base, 'zh-TW', { numeric: true }));

            if (!groups.length) {
                badgesContainer.innerHTML = xfer + '<span class="muted">此站目前無預估資料</span>';
                return;
            }

            badgesContainer.innerHTML = xfer + groups.map(g => {
                const rowsHtml = g.list.map(r => {
                    const [, sub, dir, deadline, status, nextBus] = r;
                    const to = DEST[sub] && DEST[sub][dir];
                    const dirText = to ? '往 ' + to : (dir === 0 ? '去程' : '返程');
                    const subTag = sub !== g.base ? `<small>[${sub}]</small> ` : '';
                    let eta;
                    if (deadline !== null) eta = `<span class="live-time" data-deadline="${deadline}">${remainHtml(deadline)}</span>`;
                    else if (status === 1 && nextBus) eta = `<span class="eta-text muted">${hhmm(nextBus)} 發車</span>`;
                    else eta = `<span class="eta-text muted">${STATUS_TEXT[status] || '--'}</span>`;
                    return `<div class="bus-info-row"><span class="bus-dir" title="${sub} ${dirText}">${subTag}${dirText}</span>${eta}</div>`;
                }).join('');
                return `<div class="line-group">${badgeHtml(g.base, colorOf(g.base))}<div class="arrival-time">${rowsHtml}</div></div>`;
            }).join('');
            panel.scrollTop = keepScroll;
        }

        // ==========================================
        //  PART 8b: 路線站序、每日時刻表、路線即時
        // ==========================================
        const BUS_API = 'https://tdx.transportdata.tw/api/basic/v2/Bus';

        // 子路線完整站序 (taichung-routes.js，靜態檔，不耗 API)
        function loadRouteTable() {
            if (window.TXG_ROUTES) return Promise.resolve();
            if (!loadRouteTable.p) loadRouteTable.p = new Promise(resolve => {
                const s = document.createElement('script');
                s.src = 'taichung-routes.js';
                s.onload = () => {
                    resolve();
                    if (UI.panelMode === 'station' && UI.current) renderStationPanel(false);
                    if (UI.panelMode === 'route') renderRoutePanel();
                };
                s.onerror = () => resolve();
                document.head.appendChild(s);
            });
            return loadRouteTable.p;
        }
        const routeStops = (sub, dir) => (window.TXG_ROUTES && TXG_ROUTES[sub] && TXG_ROUTES[sub][dir]) || null;
        // TDX 的 RouteName (子路線如 151延 本身就是一條 Route)；時刻表與路線即時都以此為單位
        const routeOf = sub => (window.TXG_ROUTES && TXG_ROUTES[sub] && TXG_ROUTES[sub].r) || sub;

        const hmToMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
        const minToHm = m => { const r = Math.round(m); return `${String(Math.floor(r / 60) % 24).padStart(2, '0')}:${String(r % 60).padStart(2, '0')}`; };
        const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
        const msToMin = ms => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
        const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

        // 市區公車每日營運時刻表：一條路線一次呼叫，當日快取 (localStorage)
        //   1. DailyTimeTable：逐班次、逐站時刻 (大部分路線有)
        //   2. 沒有時改用 DailyStopTimeTable：通常只有起訖站時刻，中間站依里程內插 (標示「推估」)
        const Sched = {
            PREFIX: 'txg_sched_v1:',
            mem: new Map(), loading: new Map(), errors: new Map(),
            init() {
                try {
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const k = localStorage.key(i);
                        if (!k || !k.startsWith(this.PREFIX)) continue;
                        const v = JSON.parse(localStorage.getItem(k));
                        if (!v || v.date !== todayStr()) localStorage.removeItem(k);
                    }
                } catch (e) {}
            },
            get(route) {
                let v = this.mem.get(route);
                if (!v) { v = store.get(this.PREFIX + route); if (v) this.mem.set(route, v); }
                // ver 2 起保留班次 ID；舊格式 (或查詢頁寫入的) 視為未載入，重新抓一次
                return v && v.date === todayStr() && v.ver >= 2 ? v : null;
            },
            state(route) { return this.get(route) ? 'ok' : this.loading.has(route) ? 'loading' : this.errors.has(route) ? 'err' : 'none'; },
            load(route, opts = {}) {
                const hit = this.get(route);
                if (hit) return Promise.resolve(hit);
                if (this.loading.has(route)) return this.loading.get(route);
                this.errors.delete(route);
                const p = this._load(route, opts)
                    .then(v => { this.mem.set(route, v); store.set(this.PREFIX + route, v); return v; })
                    .catch(e => { this.errors.set(route, e.message || String(e)); throw e; })
                    .finally(() => { this.loading.delete(route); onSchedLoaded(route); });
                this.loading.set(route, p);
                return p;
            },
            async _load(route, { low = false } = {}) {
                await loadRouteTable();
                const q = path => `${BUS_API}/${path}/City/Taichung?` + new URLSearchParams({ '$filter': `RouteName/Zh_tw eq '${route.replace(/'/g, "''")}'`, '$format': 'JSON' });
                const v = { date: todayStr(), ver: 2, subs: {} };
                // ids[k] = 第 k 班的 TripID (DailyTimeTable) 或 Sequence (DailyStopTimeTable)，與 trips[k] 對齊
                const put = (sub, dir, kind, stops, trips, known, ids) => { (v.subs[sub] = v.subs[sub] || {})[dir] = known ? { kind, stops, trips, known, ids } : { kind, stops, trips, ids }; };

                const tt = await ApiTasks.run(q('DailyTimeTable'), { low });
                tt.forEach(r => {
                    const sub = (r.SubRouteName && r.SubRouteName.Zh_tw) || r.RouteName.Zh_tw, dir = r.Direction;
                    const trips0 = (r.Timetables || []).filter(t => (t.StopTimes || []).length >= 2);
                    if (!trips0.length) return;
                    const ref = routeStops(sub, dir);
                    const stops = ref ? ref.s : trips0.reduce((a, t) => t.StopTimes.length > a.length ? t.StopTimes.map(s => s.StopName.Zh_tw) : a, []);
                    const pos = new Map(); stops.forEach((n, i) => { if (!pos.has(n)) pos.set(n, i); });
                    const trips = trips0.map(t => {
                        const row = new Array(stops.length).fill(null);
                        t.StopTimes.forEach(s => { const i = pos.get(s.StopName.Zh_tw); if (i !== undefined && s.ArrivalTime) row[i] = hmToMin(s.ArrivalTime); });
                        return row;
                    });
                    put(sub, dir, 'table', stops, trips, null, trips0.map((t, k) => String(t.TripID != null ? t.TripID : k + 1)));
                });
                if (Object.keys(v.subs).length) return v;

                // 只有起訖站時刻：依里程內插中間站
                const st = await ApiTasks.run(q('DailyStopTimeTable'), { low });
                st.forEach(r => {
                    const sub = (r.SubRouteName && r.SubRouteName.Zh_tw) || r.RouteName.Zh_tw;
                    const known = (r.Stops || []).filter(s => (s.TimeTables || []).length);
                    // 方向：Direction 有給就用；否則找「已知站在站序中、且時間隨站序遞增」的方向
                    let dir = r.Direction, ref = dir != null ? routeStops(sub, dir) : null;
                    if (!ref) for (const d of [0, 1]) {
                        const R = routeStops(sub, d);
                        if (!R) continue;
                        const ks = known.map(s => ({ i: R.s.indexOf(s.StopName.Zh_tw), t: hmToMin(s.TimeTables[0].ArrivalTime) })).filter(x => x.i >= 0).sort((a, b) => a.i - b.i);
                        if (ks.length >= 2 && ks.every((x, k) => !k || x.t >= ks[k - 1].t)) { dir = d; ref = R; break; }
                    }
                    if (!ref || (v.subs[sub] && v.subs[sub][dir])) return;
                    const bySeq = new Map();
                    known.forEach(s => {
                        const i = ref.s.indexOf(s.StopName.Zh_tw);
                        if (i < 0) return;
                        s.TimeTables.forEach(t => { if (!bySeq.has(t.Sequence)) bySeq.set(t.Sequence, []); bySeq.get(t.Sequence).push([i, hmToMin(t.ArrivalTime)]); });
                    });
                    const seqs = [...bySeq.keys()].sort((a, b) => a - b);
                    const rows = seqs.map(k => {
                        const pts = bySeq.get(k).sort((a, b) => a[0] - b[0]);
                        return ref.s.map((_, i) => {
                            const hi = pts.findIndex(p => p[0] >= i);
                            if (hi < 0) return null;
                            if (pts[hi][0] === i) return pts[hi][1];
                            if (hi === 0) return null;
                            const [i0, t0] = pts[hi - 1], [i1, t1] = pts[hi];
                            const d0 = ref.d[i0], d1 = ref.d[i1], f = d1 > d0 ? (ref.d[i] - d0) / (d1 - d0) : (i - i0) / (i1 - i0);
                            return Math.round((t0 + (t1 - t0) * f) * 10) / 10;
                        });
                    });
                    const keep = rows.map((row, k) => row.some(x => x !== null) ? k : -1).filter(k => k >= 0);
                    const trips = keep.map(k => rows[k]), ids = keep.map(k => String(seqs[k]));
                    // known = TDX 有給時刻的站 (其餘為里程內插)
                    const knownIdx = [...new Set([...bySeq.values()].flat().map(p => p[0]))].sort((a, b) => a - b);
                    if (trips.length) put(sub, dir, 'interp', ref.s, trips, knownIdx, ids);
                });
                // 兩種時刻表都沒有＝今日不營運 (例如只在特定日行駛的延駛/區間車)；照樣快取，避免重複查詢
                if (!Object.keys(v.subs).length) v.none = true;
                return v;
            },
            // 某站今日所有表定時刻 (分鐘，已排序)
            // apiOnly：只回傳 TDX 直接提供的時刻 (排除里程內插的中間站)
            timesAt(sub, dir, names, apiOnly = false) {
                const v = this.get(routeOf(sub));
                const e = v && v.subs[sub] && v.subs[sub][dir];
                if (!e) return null;
                const i = e.stops.findIndex(n => names.includes(n));
                if (i < 0) return null;
                if (apiOnly && e.kind === 'interp' && !(e.known && e.known.includes(i))) return null;
                const times = e.trips.map(t => t[i]).filter(x => x !== null).sort((a, b) => a - b);
                return times.length ? { times, kind: e.kind } : null;
            },
            entry(sub, dir) { const v = this.get(routeOf(sub)); return (v && v.subs[sub] && v.subs[sub][dir]) || null; },
            // 預估到站 vs 表定 → 正值＝晚到
            //   1. 有車牌且線上車輛已配對到班次 (TripLive)：比對「這一班」在此站的表定時刻
            //   2. 否則退回比對最接近的表定時刻 (班距短時可能對錯班，tip 會註明)
            compare(sub, dir, names, deadline, plate) {
                if (deadline == null) return null;
                const arr = msToMin(deadline);
                const e = this.entry(sub, dir);
                const m = plate && e ? TripLive.match(sub, dir) : null;
                const hit = m && m.byPlate.get(plate);
                if (hit) {
                    const i = e.stops.findIndex(n => names.includes(n));
                    const t = i >= 0 ? e.trips[hit.k][i] : null;
                    if (t !== null && t !== undefined)
                        return { diff: Math.round(arr - t), sched: t, kind: e.kind, trip: hit.label, plate };
                }
                const s = this.timesAt(sub, dir, names);
                if (!s) return null;
                let best = null;
                s.times.forEach(t => { const d = arr - t; if (!best || Math.abs(d) < Math.abs(best.diff)) best = { diff: d, sched: t }; });
                if (!best || Math.abs(best.diff) > 30) return null;
                return { diff: Math.round(best.diff), sched: best.sched, kind: s.kind, nearest: true };
            },
            // 第 k 班的起站表定發車 (分鐘) 與顯示用標籤 (依發車時刻排序的班次序 + TripID)
            tripInfo(e) {
                if (e._info) return e._info;
                const dep = e.trips.map(row => { const t = row.find(x => x !== null && x !== undefined); return t === undefined ? null : t; });
                const order = dep.map((d, k) => k).filter(k => dep[k] !== null).sort((a, b) => dep[a] - dep[b]);
                const rank = new Array(dep.length).fill(null);
                order.forEach((k, n) => rank[k] = n + 1);
                const label = k => `第${rank[k]}班` + (e.ids && e.ids[k] ? `（${e.kind === 'table' ? 'TripID ' : '序號 '}${e.ids[k]}）` : '');
                Object.defineProperty(e, '_info', { value: { dep, order, rank, label }, enumerable: false });
                return e._info;
            }
        };
        Sched.init();

        function onSchedLoaded() {
            if (UI.panelMode === 'station' && UI.current) renderStationPanel(false);
            if (UI.panelMode === 'route') renderRoutePanel();
            if (UI.panelMode === 'plan') runPlan();
        }

        function delayHtml(c) {
            if (!c) return '';
            const tip = (c.trip ? `${c.plate} ${c.trip}，` : '') + `表定 ${minToHm(c.sched)}`
                + (c.kind === 'interp' ? '（依起訖站時刻推估）' : '')
                + (c.nearest ? '（未配對到班次，比對最接近的表定時刻）' : '');
            const est = c.kind === 'interp' ? '≈' : '';
            if (c.diff >= 1) return `<span class="dly late" title="${tip}">${est}晚${c.diff}分</span>`;
            if (c.diff <= -1) return `<span class="dly early" title="${tip}">${est}早${-c.diff}分</span>`;
            return `<span class="dly ontime" title="${tip}">${est}準點</span>`;
        }

        // 單一路線即時 (點路線時才呼叫，一次涵蓋整條路線所有站)
        const RouteEta = {
            data: new Map(), loading: new Set(), errors: new Map(),
            age(route) { const c = this.data.get(route); return c ? Date.now() - c.at : Infinity; },
            request(route, force = false) {
                if (this.loading.has(route) || (!force && this.age(route) < API_POLICY.freshMs)) return;
                this.loading.add(route);
                this.errors.delete(route);
                const url = `${TDX_CONFIG.etaUrl}/${encodeURIComponent(route)}?` + new URLSearchParams({ '$select': ETA_SELECT + ',StopSequence', '$format': 'JSON' });
                ApiTasks.run(url)
                    .then(json => { const at = Date.now(); this.data.set(route, { at, rows: json.map(it => etaRow(it, at)) }); })
                    .catch(e => this.errors.set(route, e.message || String(e)))
                    .finally(() => { this.loading.delete(route); if (UI.panelMode === 'route') renderRoutePanel(); if (UI.panelMode === 'plan') runPlan(); });
                if (UI.panelMode === 'route') renderRoutePanel();
            }
        };

        // 線上車輛 → 今日班次配對 (RealTimeNearStop A2：車牌 + TripStartTime 該趟實際發車時刻)
        //   每日時刻表沒有車牌，所以用「線上車牌的發車時刻」對到「表定發車時刻」：
        //   同子路線同方向的車依發車先後、班次依表定先後，做保序配對 (不交叉、一車一班)
        //   配對到的車 → 發車晚/早 = TripStartTime − 表定發車；各站比對用這一班的表定時刻
        //   表定已過、卻沒有任何車 (含更晚班次) 配對到 → 尚未發車，遲發 = 現在 − 表定發車
        const TRIP_MATCH = { early: 10, late: 45, skipCost: 60, pendingWindow: 60, maxTripMin: 150, earlyWeight: 3 };
        const TripLive = {
            data: new Map(), loading: new Set(), errors: new Map(), cache: new Map(),
            age(route) { const c = this.data.get(route); return c ? Date.now() - c.at : Infinity; },
            request(route, force = false) {
                if (this.loading.has(route) || (!force && this.age(route) < API_POLICY.freshMs)) return;
                this.loading.add(route);
                this.errors.delete(route);
                const url = `${BUS_API}/RealTimeNearStop/City/Taichung/${encodeURIComponent(route)}?` + new URLSearchParams({ '$format': 'JSON' });
                ApiTasks.run(url)
                    .then(json => {
                        const byPlate = new Map();
                        json.forEach(it => {
                            const sub = (it.SubRouteName && it.SubRouteName.Zh_tw) || (it.RouteName && it.RouteName.Zh_tw);
                            const start = it.TripStartTime ? Date.parse(it.TripStartTime) : NaN;
                            const v = {
                                plate: it.PlateNumb, sub, dir: it.Direction, seq: it.StopSequence,
                                stop: it.StopName && it.StopName.Zh_tw, event: it.A2EventType,
                                start: isNaN(start) ? null : start, gps: it.GPSTime ? Date.parse(it.GPSTime) : null
                            };
                            if (!v.plate || v.plate === '-1') return;
                            const prev = byPlate.get(v.plate);
                            if (!prev || (v.gps || 0) > (prev.gps || 0)) byPlate.set(v.plate, v);
                        });
                        this.data.set(route, { at: Date.now(), vehicles: [...byPlate.values()] });
                        this.cache.clear();
                    })
                    .catch(e => this.errors.set(route, e.message || String(e)))
                    .finally(() => {
                        this.loading.delete(route);
                        if (UI.panelMode === 'route') renderRoutePanel();
                        if (UI.panelMode === 'station' && UI.current) renderStationPanel(false);
                    });
            },
            // → { byPlate: Map(車牌 → {k, label, dep, start, late}), running: [...], pending: [{k, label, dep, late}], idle: [車] } 或 null
            match(sub, dir) {
                const route = routeOf(sub), d = this.data.get(route), e = Sched.entry(sub, dir);
                if (!d || !e) return null;
                const key = `${sub}|${dir}`, nowM = Math.floor(nowMin());
                const c = this.cache.get(key);
                if (c && c.at === d.at && c.e === e && c.nowM === nowM) return c.res;
                const info = Sched.tripInfo(e), today0 = new Date().setHours(0, 0, 0, 0);
                const all = d.vehicles.filter(v => v.sub === sub && v.dir === dir);
                // TripStartTime 太舊 (超過 maxTripMin) 多半是停駛/待班車沿用上一趟資料，不拿來配對
                const fresh0 = Math.max(today0, Date.now() - TRIP_MATCH.maxTripMin * 60000);
                const veh = all.filter(v => v.start !== null && v.start >= fresh0).sort((a, b) => a.start - b.start);
                const T = info.order;   // 依表定發車排序的班次
                const cost = (v, k) => {
                    const diff = msToMin(v.start) - info.dep[k];
                    if (diff < -TRIP_MATCH.early || diff > TRIP_MATCH.late) return Infinity;
                    // 提早發車少見 (多為 1~2 分內)，早發成本加重，避免晚發的車被配到下一班
                    return diff < 0 ? -diff * TRIP_MATCH.earlyWeight : diff;
                };
                // 保序配對 DP：f[i][j] = 前 i 台車、前 j 班的最小成本 (車可不配對、班次可略過)
                const n = veh.length, m = T.length, S = TRIP_MATCH.skipCost;
                const f = Array.from({ length: n + 1 }, () => new Float64Array(m + 1));
                const how = Array.from({ length: n + 1 }, () => new Uint8Array(m + 1));
                for (let i = 1; i <= n; i++) { f[i][0] = i * S; how[i][0] = 1; }
                for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
                    let best = f[i - 1][j] + S, h = 1;                       // 車 i 不配對
                    if (f[i][j - 1] < best) { best = f[i][j - 1]; h = 2; }   // 班次 j 略過
                    const cc = cost(veh[i - 1], T[j - 1]);
                    if (f[i - 1][j - 1] + cc < best) { best = f[i - 1][j - 1] + cc; h = 3; }
                    f[i][j] = best; how[i][j] = h;
                }
                const byPlate = new Map(), running = [], used = new Set();
                for (let i = n, j = m; i > 0;) {
                    const h = how[i][j];
                    if (h === 3) {
                        const v = veh[i - 1], k = T[j - 1];
                        const r = { k, label: info.label(k), dep: info.dep[k], start: v.start, late: Math.round(msToMin(v.start) - info.dep[k]), v };
                        byPlate.set(v.plate, r); running.unshift(r); used.add(k);
                        i--; j--;
                    } else if (h === 1 || j === 0) i--;
                    else j--;
                }
                // 尚未發車：表定已過 (近 60 分內)、沒有車配對，且也沒有更晚的班次已配對 (否則多半是已跑完或脫班)
                const lastUsed = T.reduce((a, k, j) => used.has(k) ? j : a, -1);
                const pending = [];
                T.forEach((k, j) => {
                    if (used.has(k) || j <= lastUsed) return;
                    const late = nowMin() - info.dep[k];
                    if (late >= 1 && late <= TRIP_MATCH.pendingWindow) pending.push({ k, label: info.label(k), dep: info.dep[k], late: Math.floor(late) });
                });
                // 在線但沒有配對到班次的車 (例如在起站待發、TripStartTime 還是上一趟)
                const idle = all.filter(v => !byPlate.has(v.plate));
                const res = { byPlate, running, pending, idle, at: d.at };
                this.cache.set(key, { at: d.at, e, nowM, res });
                return res;
            }
        };
        const lateTxt = m => m >= 1 ? `晚${m}分` : m <= -1 ? `早${-m}分` : '準點';
        const lateCls = m => m >= 1 ? 'late' : m <= -1 ? 'early' : 'ontime';

        // ---------- 依行進方向分類的站牌卡片 (所有公車路廊) ----------
        //   low/high = 往路廊站序較小/較大的一端 (左欄/右欄)，標題只寫下一站名
        const CORR_INDEX = {};
        function corrIndex(lid) {
            if (!CORR_INDEX[lid]) {
                const m = new Map();
                DATA[lid].stops.forEach((st, i) => aliasesOf(st).forEach(n => { if (!m.has(n)) m.set(n, i); }));
                CORR_INDEX[lid] = m;
            }
            return CORR_INDEX[lid];
        }
        // 這班車在此站之後往哪裡：side = low / high / mid (下一站離開路廊或終點)
        function nextStopInfo(lid, idx, sub, dir) {
            const names = aliasesOf(DATA[lid].stops[idx]), CI = corrIndex(lid);
            const R = routeStops(sub, dir);
            if (R) {
                const k = R.s.findIndex(n => names.includes(n));
                if (k >= 0) {
                    let j = k + 1;
                    while (j < R.s.length && CI.get(R.s[j]) === idx) j++;   // 同站其他月台
                    if (j >= R.s.length) return { side: 'mid', term: true };
                    for (let t = j; t <= Math.min(j + 1, R.s.length - 1); t++) {
                        const ci = CI.get(R.s[t]);
                        if (ci !== undefined && ci !== idx) return { side: ci < idx ? 'low' : 'high' };
                    }
                    return { side: 'mid', next: R.s[j] };
                }
            }
            const r = DATA[lid].routes.find(x => x.name === sub) || DATA[lid].routes.find(x => x.name === baseRoute(sub));
            const d = r && r.dirs[dir];
            if (d) {
                if (idx === d.leave) return d.after ? { side: 'mid', next: d.after } : { side: 'mid', term: true };
                return { side: d.leave < idx ? 'low' : 'high' };
            }
            return { side: 'mid', next: null };
        }
        function routeColorOf(base, lid) {
            const own = LINES[lid] && LINES[lid].groupOfRoute && LINES[lid].groupOfRoute[base];
            if (own) return own.color;
            // 主要行經規劃捷運路線的公車：用該路線顏色
            let best = null;
            BUS_LINES.forEach(l => { const r = DATA[l].routes.find(x => x.name === base); if (r && (!best || r.cov.length > best.n)) best = { l, n: r.cov.length }; });
            if (best && LINES[best.l].plan) return LINES[best.l].color;
            for (const l of BUS_LINES) { const g = LINES[l].groupOfRoute && LINES[l].groupOfRoute[base]; if (g) return g.color; }
            return '#666';
        }

        function renderDirStationPanel(fresh) {
            const { lid, idx } = UI.current;
            const st = DATA[lid].stops[idx], Ln = LINES[lid];
            const names = aliasesOf(st);
            const keepScroll = fresh ? 0 : panel.scrollTop;
            const chunkId = chunkOfStation(lid, idx);
            loadRouteTable();
            title.textContent = st.name;
            desc.innerHTML = `${Ln.full} · <span id="data-age" data-chunk="${chunkId}">${dataAgeText(chunkId)}</span>`;
            panel.classList.add('active');
            const xfer = transferButtons(lid, idx);
            if (!EtaStore.snaps[chunkId]) { badgesContainer.innerHTML = xfer + '<div class="grp-mini">資料載入中...</div>'; return; }

            // 同子路線同方向取最快的一筆 (多月台)
            const best = new Map();
            EtaStore.rowsForStation(st).forEach(r => {
                const key = r[1] + '|' + r[2], prev = best.get(key);
                if (!prev || (r[3] !== null && (prev[3] === null || r[3] < prev[3]))) best.set(key, r);
            });
            const cols = { low: [], mid: [], high: [] };
            const now = Date.now();
            best.forEach(r => {
                const [, sub, dir, deadline, status, nextBus] = r;
                const info = nextStopInfo(lid, idx, sub, dir);
                const done = deadline === null && (status === 3 || status === 4);
                const sortT = deadline !== null ? deadline : (status === 1 && nextBus ? Date.parse(nextBus) : Infinity);
                cols[info.side].push({ r, info, done, sortT });
            });
            const sortList = a => a.sort((x, y) => (x.done - y.done) || (x.sortT - y.sortT) || x.r[1].localeCompare(y.r[1], 'zh-TW', { numeric: true }));
            Object.values(cols).forEach(sortList);

            const missing = new Set();
            const item = ({ r, info, done }, side) => {
                const [, sub, dir, deadline, status, nextBus, plate] = r;
                const base = baseRoute(sub), rt = routeOf(sub);
                if (Sched.state(rt) === 'none') missing.add(rt);
                const to = DEST[sub] && DEST[sub][dir];
                let eta;
                if (deadline !== null) eta = `<span class="live-time" data-deadline="${deadline}">${remainHtml(deadline)}</span>`;
                else if (status === 1 && nextBus) eta = `<span class="eta-text muted">${hhmm(nextBus)} 發車</span>`;
                else eta = `<span class="eta-text muted">${STATUS_TEXT[status] || '--'}</span>`;
                let cmp = deadline !== null ? delayHtml(Sched.compare(sub, dir, names, deadline, plate)) : '';
                // 已載入該路線線上車輛時：表定已過仍未發車的班次 → 遲發
                if (!plate && !done) {
                    const tm = TripLive.match(sub, dir), pd = tm && tm.pending[0];
                    if (pd) cmp += `<span class="dly late" title="${pd.label} 表定 ${minToHm(pd.dep)} 發車，線上無對應車輛">遲發${pd.late}分</span>`;
                }
                const sched = Sched.state(rt) === 'loading' ? '<span class="dly muted">時刻表…</span>' : '';
                const color = routeColorOf(base, lid);
                const sub2 = side === 'mid'
                    ? (info.term ? '終點站' : `→ ${info.next ? shortName(lid, info.next) : '離開路廊'}`) + (to ? `・往 ${to}` : '')
                    : (to ? `往 ${to}` : (dir ? '返程' : '去程'));
                return `<div class="dir-item${done ? ' done' : ''}" data-sub="${sub}" data-dir="${dir}">
                    <div class="dir-line">${badgeHtml(sub, color)}${eta}${cmp}${sched}</div>
                    <div class="dir-to">${sub2}</div></div>`;
            };
            const head = side => {
                if (side === 'mid') return `<div class="dir-head">離開路廊</div>`;
                const j = side === 'low' ? idx - 1 : idx + 1;
                const nb = DATA[lid].stops[j];
                return side === 'low'
                    ? `<div class="dir-head">◀ 往 ${nb ? shortName(lid, nb.name) : '（端點）'}</div>`
                    : `<div class="dir-head right">往 ${nb ? shortName(lid, nb.name) : '（端點）'} ▶</div>`;
            };
            const col = side => `<div class="dir-col ${side}">${head(side)}${cols[side].map(x => item(x, side)).join('') || '<div class="dir-empty">無班次</div>'}</div>`;
            const hasMid = cols.mid.length > 0;
            const card = `<div class="dir-card${hasMid ? ' with-mid' : ''}">${col('low')}${hasMid ? col('mid') : ''}${col('high')}</div>`;
            const loading = [...best.values()].map(r => routeOf(r[1])).filter((b, i, a) => a.indexOf(b) === i && Sched.state(b) === 'loading').length;
            const schedBtn = missing.size
                ? `<button class="panel-btn" id="btn-sched">比對時刻表（${missing.size} 條路線，背景排隊，每條約 1~2 次 API）</button>`
                : (loading ? `<span class="grp-mini" style="grid-column:auto">時刻表載入中（剩 ${loading} 條）…</span>` : '');
            badgesContainer.innerHTML = xfer + card +
                `<div class="panel-actions">${schedBtn}<span class="grp-mini" style="grid-column:auto">點路線看整條路線即時與各站時刻表</span></div>`;
            const b = document.getElementById('btn-sched');
            if (b) b.onclick = () => { missing.forEach(rt => Sched.load(rt, { low: true }).catch(() => {})); renderStationPanel(false); };
            badgesContainer.querySelectorAll('.dir-item').forEach(e => e.addEventListener('click', () => openRoutePanel(e.dataset.sub, Number(e.dataset.dir))));
            panel.scrollTop = keepScroll;
        }

        // ---------- 路線面板：單一方向完整站牌即時 + 各站時刻表 ----------
        function openRoutePanel(sub, dir) {
            const from = UI.current ? { ...UI.current } : (UI.route && UI.route.from) || null;
            const base = baseRoute(sub), rt = routeOf(sub);
            const fromPlan = UI.panelMode === 'plan' && UI.plan ? UI.plan : (UI.route && UI.route.fromPlan) || null;
            UI.route = { sub, dir, from: fromPlan ? null : from, fromPlan, open: new Set(), scrolled: false };
            UI.panelMode = 'route';
            UI.current = null;
            UI.focus = { key: `route|${sub}|${dir}`, lid: from ? from.lid : null, base, sub, dir, plate: null, color: routeColorOf(base, from ? from.lid : 'tb'), route: true };
            loadRouteTable();
            RouteEta.request(rt);
            Sched.load(rt).catch(() => {});
            TripLive.request(rt);
            renderRoutePanel();
            renderMap();
        }
        function backToStation() {
            const f = UI.route && UI.route.from, fp = UI.route && UI.route.fromPlan;
            UI.focus = null;
            UI.route = null;
            if (fp) { UI.plan = fp; UI.panelMode = 'plan'; runPlan(true); return; }
            if (!f) { closePanel(); renderMap(); return; }
            UI.current = f;
            UI.panelMode = 'station';
            renderStationPanel(true);
            renderMap();
        }
        function renderRoutePanel() {
            const R0 = UI.route;
            if (!R0) return;
            const { sub, dir, from } = R0, base = routeOf(sub);
            const R = routeStops(sub, dir);
            const re = RouteEta.data.get(base);
            const rows = re ? re.rows.filter(r => r[1] === sub && r[2] === dir) : [];
            const stops = R ? R.s : [...new Map(rows.slice().sort((a, b) => (a[7] || 0) - (b[7] || 0)).map(r => [r[0], 1])).keys()];
            const to = (DEST[sub] && DEST[sub][dir]) || (stops.length ? stops[stops.length - 1] : '');
            const color = UI.focus ? UI.focus.color : '#666';
            const keepScroll = panel.scrollTop;
            title.innerHTML = `${badgeHtml(sub, color)} 往 ${to}`;
            const sState = Sched.state(base), sv = Sched.get(base), se = sv && sv.subs[sub] && sv.subs[sub][dir];
            const etaTxt = RouteEta.loading.has(base) ? '即時資料更新中…' : re ? `即時 ${new Date(re.at).toLocaleTimeString('zh-TW', { hour12: false })}（${Math.round(RouteEta.age(base) / 1000)} 秒前）` : (RouteEta.errors.get(base) || '即時資料排隊中…');
            const schTxt = sState === 'ok' && sv.none ? '今日時刻表無此路線班次（今日可能不營運）'
                : sState === 'ok' ? (se ?(se.kind === 'table' ? `每日時刻表 ${se.trips.length} 班` : `每日時刻表 ${se.trips.length} 班（只有起訖站時刻，中間站依里程推估）`) : '今日時刻表無此方向')
                : sState === 'loading' ? '時刻表載入中…' : sState === 'err' ? '時刻表：' + Sched.errors.get(base) : '';
            desc.innerHTML = (UI.focus && UI.focus.plate ? `車牌 <b>${UI.focus.plate}</b> · ` : '') + `${etaTxt} · ${schTxt}`;
            panel.classList.add('active');

            const hereNames = from && DATA[from.lid] ? aliasesOf(DATA[from.lid].stops[from.idx]) : [];
            const nm = nowMin();
            const list = stops.map((name, i) => {
                const r = rows.find(x => x[0] === name);
                let eta = '<span class="muted">--</span>', cmp = '';
                if (r) {
                    const [, , , deadline, status, nextBus, plate] = r;
                    if (deadline !== null) { eta = `<span class="live-time" data-deadline="${deadline}">${remainHtml(deadline)}</span>`; cmp = delayHtml(Sched.compare(sub, dir, [name], deadline, plate)); }
                    else if (status === 1 && nextBus) eta = `<span class="muted">${hhmm(nextBus)} 發車</span>`;
                    else eta = `<span class="muted">${STATUS_TEXT[status] || '--'}</span>`;
                }
                const ts = Sched.timesAt(sub, dir, [name]);
                const nexts = ts ? ts.times.filter(t => t >= nm - 1).slice(0, 2).map(minToHm).join('、') : '';
                const here = hereNames.includes(name);
                const open = R0.open.has(i);
                const full = open && ts ? `<div class="rt-times">${ts.times.map(t => `<span class="${t < nm - 1 ? 'past' : ''}">${minToHm(t)}</span>`).join('')}${ts.kind === 'interp' ? '<div class="muted">（推估時刻）</div>' : ''}</div>`
                    : open ? '<div class="rt-times muted">此站無時刻表資料</div>' : '';
                return `<div class="rt-row${here ? ' here' : ''}${open ? ' open' : ''}" data-i="${i}">
                    <span class="rt-dot" style="border-color:${color}"></span>
                    <span class="rt-name">${name}</span>
                    <span class="rt-eta">${eta}${cmp}</span>
                    <span class="rt-sch">${nexts ? (ts.kind === 'interp' ? '≈' : '') + nexts : ''}</span>
                    ${full}</div>`;
            }).join('');
            // 班次狀態：線上車牌 ↔ 今日班次配對，發車晚/早；表定已過仍未發車 → 遲發
            const tm = TripLive.match(sub, dir);
            let trips = '';
            if (tm) {
                const run = tm.running.map(x => `<div class="tp-row"><span class="tp-plate">${x.v.plate}</span><span>${x.label}</span>
                    <span>表定 ${minToHm(x.dep)} · 實際 ${hhmm(x.start)} 發</span>
                    <span class="dly ${lateCls(x.late)}">發車${lateTxt(x.late)}</span>${x.v.stop ? `<span class="muted">在 ${x.v.stop}</span>` : ''}</div>`).join('');
                const pend = tm.pending.map(x => `<div class="tp-row"><span class="tp-plate muted">—</span><span>${x.label}</span>
                    <span>表定 ${minToHm(x.dep)} 發</span><span class="dly late">尚未發車・遲${x.late}分</span></div>`).join('');
                const idle = tm.idle.length ? `<div class="tp-row muted">在線未配對班次：${tm.idle.map(v => v.plate + (v.stop ? `（${v.stop}）` : '')).join('、')}</div>` : '';
                trips = `<div class="tp-box"><div class="tp-title">班次狀態（線上車牌 ↔ 今日時刻表）</div>${pend}${run}${idle}${!run && !pend && !idle ? '<div class="tp-row muted">目前無此方向的線上車輛</div>' : ''}</div>`;
            } else if (TripLive.loading.has(base)) trips = '<div class="tp-box muted">線上車輛載入中…</div>';
            else if (TripLive.errors.get(base)) trips = `<div class="tp-box muted">線上車輛：${TripLive.errors.get(base)}</div>`;
            const other = routeStops(sub, 1 - dir) || (DEST[sub] && DEST[sub][1 - dir]);
            badgesContainer.innerHTML = `<div class="panel-actions">
                    ${R0.fromPlan ? `<button class="panel-btn" id="rt-back">← 返回行程</button>`
                      : from ? `<button class="panel-btn" id="rt-back">← 返回 ${DATA[from.lid] ? DATA[from.lid].stops[from.idx].name : '站牌'}</button>` : ''}
                    ${other ? `<button class="panel-btn" id="rt-rev">⇄ 反方向</button>` : ''}
                    <button class="panel-btn" id="rt-refresh">更新即時</button></div>
                ${trips}
                <div class="rt-head"><span></span><span>站牌（點選看全日時刻表）</span><span>即時／比對</span><span>表定下兩班</span></div>
                <div class="rt-list">${list || '<div class="muted">站序資料載入中…</div>'}</div>`;
            const $b = id => document.getElementById(id);
            if ($b('rt-back')) $b('rt-back').onclick = backToStation;
            if ($b('rt-rev')) $b('rt-rev').onclick = () => { UI.route.dir = 1 - dir; UI.route.open = new Set(); UI.route.scrolled = false; UI.focus.dir = 1 - dir; UI.focus.key = `route|${sub}|${1 - dir}`; renderRoutePanel(); renderMap(); };
            $b('rt-refresh').onclick = () => { RouteEta.request(base, true); TripLive.request(base, true); };
            badgesContainer.querySelectorAll('.rt-row').forEach(e => e.addEventListener('click', () => {
                const i = Number(e.dataset.i);
                UI.route.open.has(i) ? UI.route.open.delete(i) : UI.route.open.add(i);
                renderRoutePanel();
            }));
            if (!R0.scrolled && stops.length) {
                const h = badgesContainer.querySelector('.rt-row.here');
                if (h) { R0.scrolled = true; panel.scrollTop = Math.max(0, h.offsetTop - panel.clientHeight / 3); }
                else if (R) R0.scrolled = true;
            } else panel.scrollTop = keepScroll;
        }

        // ==========================================
        //  PART 8c: 行程規劃 (起訖站 → 直達 / 轉乘 1~2 次)
        // ==========================================
        //   路網：taichung-routes.js 的子路線站序 + 捷運綠線；同一站名或同一轉乘站視為同一「地點」
        //   時間：上車時刻 = 即時預估 (路廊站牌快取 / 已載入的路線即時) → 每日時刻表 → 班距推估
        //         乘車時間 = 時刻表同班次的站間差 → 依里程 (約 17 km/h) 推估；捷運用官方站間時間
        //   全部用已有快取計算，不額外呼叫 API；需要更準時由使用者按鈕載入
        //   上車時刻只採用 API 提供的時間 (即時預估、NextBusTime、每日時刻表)；都沒有＝待載入時刻表，不顯示推估時間
        //   RANK_WAIT_MS 只用於排序「待載入」方案以決定先載入哪些時刻表
        const PLAN = { MAX_WAIT: 75 * 60000, SAME_STOP_MS: 60000, WALK_MS: 180000, BUS_M_PER_MIN: 280, DWELL_MIN: 0.3, RANK_WAIT_MS: 8 * 60000,
                       AUTO_PER_ROUND: 3, AUTO_MAX: 6 };
        let PLAN_NET = null;
        let PLAN_DEAD = null;   // 「子路線|方向」：所有即時資料都表示目前沒有車 (末班已過/未營運/尚未發車且無發車時刻)
        function buildPlanDead() {
            const live = new Set(), dead = new Set(), now = Date.now();
            const scan = x => {
                const k = x[1] + '|' + x[2];
                if (x[3] !== null || (x[4] === 1 && x[5] && Date.parse(x[5]) > now - 60000)) live.add(k);
                else if (x[4] === 3 || x[4] === 4 || x[4] === 1) dead.add(k);
            };
            EtaStore.byStop.forEach(rows => rows.forEach(scan));
            RouteEta.data.forEach(c => c.rows.forEach(scan));
            PLAN_DEAD = new Set([...dead].filter(k => !live.has(k)));
        }

        function buildPlanNet() {
            const parent = new Map();
            const find = k => { let r = k; while (parent.has(r) && parent.get(r) !== r) r = parent.get(r); parent.set(k, r); if (!parent.has(r)) parent.set(r, r); return r; };
            const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent.set(ra, rb); };
            ALL_BUS_LINES.forEach(lid => DATA[lid].stops.forEach((st, i) => aliasesOf(st).forEach(n => union('s:' + lid + ':' + i, 'n:' + n))));
            const xs = [...MAP_DESIGN.interchanges.common, ...MAP_DESIGN.interchanges.base, ...MAP_DESIGN.interchanges.center];
            xs.forEach(x => x.at.slice(1).forEach(([l, i]) => union('s:' + x.at[0][0] + ':' + x.at[0][1], 's:' + l + ':' + i)));
            const routes = [];
            Object.entries(window.TXG_ROUTES || {}).forEach(([sub, e]) => [0, 1].forEach(dir => {
                if (!e[dir]) return;
                routes.push({ kind: 'bus', sub, dir, base: baseRoute(sub), stops: e[dir].s, d: e[dir].d, places: e[dir].s.map(n => find('n:' + n)) });
            }));
            const n = MRT.stations.length;
            [['south', [...Array(n).keys()]], ['north', [...Array(n).keys()].reverse()]].forEach(([dirKey, order]) => routes.push({
                kind: 'mrt', sub: '綠線', dirKey, order, base: null, stops: order.map(i => MRT.stations[i].name),
                places: order.map(i => find('s:mrt:' + i))
            }));
            const at = new Map();   // 地點 → [[路線序號, 站位]]
            routes.forEach((r, ri) => r.places.forEach((p, k) => { if (!at.has(p)) at.set(p, []); at.get(p).push([ri, k]); }));
            PLAN_NET = { routes, at, place: key => find(key) };
        }

        const stationLabel = (lid, idx) => {
            const xf = XFER_OF.get(lid + ':' + idx);
            if (xf && xf.kind !== 'join') return xf.name;
            return lid === 'mrt' ? `捷運${MRT.stations[idx].name}站` : stopsOf(lid)[idx].name;
        };
        function setPlanPoint(kind, lid, idx) {
            UI.plan = UI.plan || {};
            UI.plan[kind] = { lid, idx };
            UI.planPick = null;
            UI.current = null;
            const other = kind === 'from' ? 'to' : 'from';
            if (!UI.plan[other]) {
                UI.planPick = other;
                UI.panelMode = 'plan';
                title.textContent = '行程規劃';
                desc.textContent = `${kind === 'from' ? '起點' : '目的地'}：${stationLabel(lid, idx)}`;
                badgesContainer.innerHTML = `<div class="plan-hint">請在地圖上點選${other === 'to' ? '目的地' : '出發'}站</div>
                    <div class="panel-actions"><button class="panel-btn" onclick="closePanel()">取消</button></div>`;
                panel.classList.add('active');
                renderMap();
                return;
            }
            UI.planSel = 0;
            UI.planAuto = new Set();
            UI.panelMode = 'plan';
            loadRouteTable().then(() => { PLAN_NET = null; runPlan(true); });
            runPlan(true);
        }
        function swapPlan() { const p = UI.plan; [p.from, p.to] = [p.to, p.from]; UI.planSel = 0; UI.planAuto = new Set(); runPlan(true); }
        function repickPlan() { UI.plan = null; UI.planPick = 'from'; UI.focus = null; title.textContent = '行程規劃'; desc.textContent = '';
            badgesContainer.innerHTML = `<div class="plan-hint">請在地圖上點選出發站</div><div class="panel-actions"><button class="panel-btn" onclick="closePanel()">取消</button></div>`; renderMap(); }

        // ---- 時間估計 ----
        function liveRowsFor(r, pos) {
            const name = r.stops[pos];
            const rows = (EtaStore.byStop.get(name) || []).filter(x => x[1] === r.sub && x[2] === r.dir);
            const re = RouteEta.data.get(routeOf(r.sub));
            if (re && Date.now() - re.at < 5 * 60000) re.rows.forEach(x => { if (x[0] === name && x[1] === r.sub && x[2] === r.dir) rows.push(x); });
            return rows;
        }
        // 在 pos 站、t 時刻之後最早可上車的時間
        function boardAt(r, pos, t) {
            if (r.kind === 'mrt') {
                const next = mrtNextArrivals(r.order[pos], r.dirKey, t, 1)[0];
                return next ? { t: next, src: 'mrt' } : null;
            }
            if (pos >= r.stops.length - 1) return null;
            // 上車時刻只用 API 給的時間：1 即時預估 2 NextBusTime (TDX 此站下一班時刻) 3 每日時刻表 (不含里程內插站)
            const rows = liveRowsFor(r, pos);
            const live = rows.filter(x => x[3] !== null && x[3] >= t - 20000).map(x => x[3]).sort((a, b) => a - b)[0];
            if (live !== undefined) return { t: live, src: 'live' };
            const nb = rows.map(x => x[4] === 1 && x[5] ? Date.parse(x[5]) : NaN).filter(v => isFinite(v) && v >= t - 20000).sort((a, b) => a - b)[0];
            if (nb !== undefined) return { t: nb, src: 'next' };
            const rt = routeOf(r.sub), sv = Sched.get(rt);
            if (sv) {
                if (sv.none) return null;   // 時刻表確認今日無班次
                const s = Sched.timesAt(r.sub, r.dir, [r.stops[pos]], true);
                if (!s) return null;        // 此方向/此站沒有 API 時刻
                const base = new Date(t); base.setHours(0, 0, 0, 0);
                const m = msToMin(t), nx = s.times.find(x => x >= m - 0.2);
                if (nx === undefined) return null;   // 今日已無班次
                return { t: base.getTime() + nx * 60000, src: 'sched' };
            }
            // 整條路線此方向在各站都沒有預估、且回報不營運 → 其他站也不列入
            if (PLAN_DEAD && PLAN_DEAD.has(r.sub + '|' + r.dir)) return null;
            // 末班已過 / 今日未營運 / 尚未發車但沒有發車時刻 (常見於當日不開的延駛、區間車) → 不列入
            if (rows.length && rows.every(x => x[3] === null && (x[4] === 3 || x[4] === 4 || (x[4] === 1 && !(x[5] && Date.parse(x[5]) > Date.now() - 60000))))) return null;
            if (Sched.state(rt) === 'err') return null;
            return { pending: true, route: rt };   // 需要時刻表才能知道下一班
        }
        function rideMs(r, i, j) {
            if (r.kind === 'mrt') {
                const prof = MRT[r.dirKey];
                return (prof.arr[j] - prof.dep[i]) * 1000;
            }
            const v = Sched.get(routeOf(r.sub)), e = v && v.subs[r.sub] && v.subs[r.sub][r.dir];
            if (e) {
                const ii = e.stops.indexOf(r.stops[i]), jj = e.stops.indexOf(r.stops[j]);
                if (ii >= 0 && jj > ii) {
                    const ds = e.trips.map(tr => tr[ii] !== null && tr[jj] !== null ? tr[jj] - tr[ii] : null).filter(x => x !== null && x >= 0).sort((a, b) => a - b);
                    if (ds.length) return ds[Math.floor(ds.length / 2)] * 60000;
                }
            }
            return ((r.d[j] - r.d[i]) / PLAN.BUS_M_PER_MIN + PLAN.DWELL_MIN * (j - i)) * 60000;
        }

        // 站點本身 (含月台別名、非步行轉乘的同站成員) 的站牌名；不在其中＝要步行
        function nearNames(s) {
            const names = new Set(s.lid === 'mrt' ? [MRT.stations[s.idx].name] : aliasesOf(DATA[s.lid].stops[s.idx]));
            [...MAP_DESIGN.interchanges.common, ...MAP_DESIGN.interchanges.base, ...MAP_DESIGN.interchanges.center].forEach(x => {
                if (x.walk || !x.at.some(([l, i]) => l === s.lid && i === s.idx)) return;
                x.at.forEach(([l, i]) => (l === 'mrt' ? [MRT.stations[i].name] : aliasesOf(DATA[l].stops[i])).forEach(n => names.add(n)));
            });
            return names;
        }

        function planSearch(fromSt, toSt, t0) {
            const N = PLAN_NET, O = N.place('s:' + fromSt.lid + ':' + fromSt.idx), D = N.place('s:' + toSt.lid + ':' + toSt.idx);
            if (O === D) return { same: true, plans: [] };
            const R = N.routes, at = N.at;
            const nearO = nearNames(fromSt), nearD = nearNames(toSt);
            const out = new Map();   // 路線組合 → 最佳
            const consider = legs => {
                // legs: [[ri, i, j], ...]，依序計算時間
                let t = t0, prevStop = null;
                const L = [];
                const walkStart = !nearO.has(R[legs[0][0]].stops[legs[0][1]]);
                if (walkStart) t += PLAN.WALK_MS;
                for (const [ri, i, j] of legs) {
                    const r = R[ri];
                    let ready = t;
                    let walk = false;
                    if (prevStop !== null) { walk = prevStop !== r.stops[i]; ready += walk ? PLAN.WALK_MS : PLAN.SAME_STOP_MS; }
                    const b = boardAt(r, i, ready);
                    if (!b) return;
                    // 沒有 API 時刻 (需先載入時刻表)：只用來挑選要載入哪些時刻表，不顯示時間
                    const bt = b.pending ? ready + PLAN.RANK_WAIT_MS : b.t;
                    if (bt - ready > PLAN.MAX_WAIT) return;
                    const arr = bt + rideMs(r, i, j);
                    L.push({ ri, i, j, board: bt, src: b.pending ? 'pending' : b.src, pending: !!b.pending, alight: arr, walk, ready });
                    t = arr; prevStop = r.stops[j];
                }
                const walkEnd = !nearD.has(prevStop);
                if (walkEnd) t += PLAN.WALK_MS;
                const pending = L.some(l => l.pending);
                const key = legs.map(([ri]) => R[ri].kind === 'mrt' ? 'M' + R[ri].dirKey : R[ri].sub + '/' + R[ri].dir).join('>');
                const prev = out.get(key);
                if (!prev || (prev.pending && !pending) || (prev.pending === pending && t < prev.arrive)) out.set(key, { legs: L, arrive: t, transfers: legs.length - 1, walkStart, walkEnd, pending });
            };
            const firstAfter = (r, k, P) => { for (let x = k + 1; x < r.places.length; x++) if (r.places[x] === P) return x; return -1; };
            const fromO = at.get(O) || [];
            // 直達
            fromO.forEach(([ri, i]) => { const j = firstAfter(R[ri], i, D); if (j > 0) consider([[ri, i, j]]); });
            // 到達終點的路線：地點 → [[ri, m, n]]
            const toD = new Map();
            (at.get(D) || []).forEach(([ri, n]) => R[ri].places.forEach((p, m) => {
                if (m >= n || p === D) return;
                if (!toD.has(p)) toD.set(p, []);
                toD.get(p).push([ri, m, n]);
            }));
            // 轉乘 1 次
            fromO.forEach(([a, i]) => {
                const A = R[a];
                for (let k = i + 1; k < A.places.length; k++) {
                    const P = A.places[k];
                    if (P === O) continue;
                    if (P === D) break;
                    (toD.get(P) || []).forEach(([b, m, n]) => { if (R[b].sub !== A.sub) consider([[a, i, k], [b, m, n]]); });
                }
            });
            // 轉乘 2 次 (只在選項不足時搜尋)
            if (out.size < 4) {
                let budget = 6000;
                fromO.forEach(([a, i]) => {
                    const A = R[a];
                    for (let k = i + 1; k < A.places.length && budget > 0; k++) {
                        const P = A.places[k];
                        if (P === O || P === D) continue;
                        (at.get(P) || []).forEach(([b, m]) => {
                            const B = R[b];
                            if (B.sub === A.sub) return;
                            for (let l = m + 1; l < B.places.length && budget > 0; l++) {
                                const Q = B.places[l];
                                if (Q === P || Q === O) continue;
                                if (Q === D) break;
                                (toD.get(Q) || []).forEach(([c, mm, nn]) => {
                                    if (R[c].sub === B.sub || R[c].sub === A.sub || budget-- <= 0) return;
                                    consider([[a, i, k], [b, m, l], [c, mm, nn]]);
                                });
                            }
                        });
                    }
                });
            }
            // 上下車站相同的方案合併成一張卡 (各段列出可搭的其他路線)，依抵達時間排序
            // 排序成本：抵達時間 + 每次轉乘 5 分 + 每段步行 1 分 (相差無幾時優先直達)
            const cost = p => p.arrive + p.transfers * 300000 + ((p.walkStart ? 1 : 0) + (p.walkEnd ? 1 : 0) + p.legs.filter(l => l.walk).length) * 60000;
            const all = [...out.values()].sort((x, y) => cost(x) - cost(y));
            const groupBy = list => {
                const groups = new Map();
                list.forEach(p => {
                    const gk = p.legs.map(l => R[l.ri].stops[l.i] + '>' + R[l.ri].stops[l.j]).join('|');
                    const g = groups.get(gk);
                    if (!g) { groups.set(gk, { ...p, alts: p.legs.map(l => [l]) }); return; }
                    p.legs.forEach((l, k) => { if (!g.alts[k].some(x => R[x.ri].sub === R[l.ri].sub)) g.alts[k].push(l); });
                });
                return [...groups.values()];
            };
            // 前兩名 (含待載入時刻表的方案) 中缺時刻表的路線 → 自動載入
            const top = groupBy(all).slice(0, 2);
            const needLoad = [...new Set(top.flatMap(p => p.alts.flat().filter(l => l.pending).map(l => routeOf(R[l.ri].sub))))];
            // 只顯示每段都有 API 時刻的方案
            const ready = groupBy(all.filter(p => !p.pending));
            const best = ready.length ? Math.min(...ready.map(p => p.arrive)) : 0;
            const plans = [];
            let minTr = Infinity;
            for (const p of ready) {
                if (plans.length >= 6) break;
                if (p.arrive - best > 40 * 60000 && p.transfers >= minTr) continue;
                plans.push(p); minTr = Math.min(minTr, p.transfers);
            }
            return { plans, needLoad, pendingCount: all.filter(p => p.pending).length };
        }

        const SRC_TXT = { live: ['即時', 'live'], next: ['下一班', 'live'], sched: ['表定', 'sched'], mrt: ['捷運班距', ''] };
        const clock = ms => new Date(ms).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

        function runPlan(fresh = false) {
            if (UI.panelMode !== 'plan' || !UI.plan || !UI.plan.from || !UI.plan.to) return;
            const { from, to } = UI.plan;
            const keepScroll = fresh ? 0 : panel.scrollTop;
            setTimeout(() => { panel.scrollTop = keepScroll; }, 0);
            title.textContent = '行程規劃';
            panel.classList.add('active');
            const head = `${stationLabel(from.lid, from.idx)} → ${stationLabel(to.lid, to.idx)}`;
            const actions = `<div class="panel-actions">
                <button class="panel-btn" onclick="swapPlan()">⇄ 交換起訖</button>
                <button class="panel-btn" onclick="repickPlan()">重新選擇</button>
                <span id="plan-extra"></span></div>`;
            if (!window.TXG_ROUTES) {
                desc.textContent = head;
                badgesContainer.innerHTML = actions + '<div class="plan-hint">載入路線站序中…（需要 taichung-routes.js）</div>';
                return;
            }
            if (!PLAN_NET) buildPlanNet();
            buildPlanDead();
            const now = Date.now();
            const res = planSearch(from, to, now);
            desc.innerHTML = `${head} · ${clock(now)} 出發試算`;
            if (res.same) { badgesContainer.innerHTML = actions + '<div class="plan-hint">起點與目的地是同一站。</div>'; return; }

            // 自動載入：前兩名方案中沒有 API 時刻的路線 (每輪最多 3 條、每次查詢最多 6 條，當日快取)
            UI.planAuto = UI.planAuto || new Set();
            const toLoad = res.needLoad.filter(rt => Sched.state(rt) === 'none' && !UI.planAuto.has(rt))
                .slice(0, Math.max(0, Math.min(PLAN.AUTO_PER_ROUND, PLAN.AUTO_MAX - UI.planAuto.size)));
            toLoad.forEach(rt => { UI.planAuto.add(rt); Sched.load(rt).catch(() => {}); });
            const loadingN = [...UI.planAuto].filter(rt => Sched.state(rt) === 'loading').length;
            const loadingNote = loadingN
                ? `<div class="plan-hint">⏳ 正在載入 ${loadingN} 條路線的當日時刻表（每條 1~2 次 API，依額度排隊），完成後自動更新方案。</div>` : '';
            if (!res.plans.length) {
                badgesContainer.innerHTML = actions + loadingNote + `<div class="plan-hint">${loadingN ? '目前還沒有每段都能從 API 取得上車時刻的方案。' : '找不到 2 次轉乘內、每段都有 API 上車時刻的方案（或今日班次已結束）。'}</div>`;
                return;
            }
            const R = PLAN_NET.routes;
            if (UI.planSel >= res.plans.length) UI.planSel = 0;
            UI.planResult = res.plans;

            const cards = res.plans.map((p, k) => {
                const mins = Math.round((p.arrive - now) / 60000);
                const legs = p.legs.map((l, n) => {
                    const r = R[l.ri];
                    const color = r.kind === 'mrt' ? LINES.mrt.color : routeColorOf(r.base, from.lid);
                    const badge = r.kind === 'mrt' ? badgeHtml('捷運', color) : badgeHtml(r.sub, color, `onclick="event.stopPropagation(); openRoutePanel('${r.sub}', ${r.dir})"`);
                    const toTxt = r.kind === 'mrt' ? (r.dirKey === 'south' ? '往 高鐵臺中站' : '往 北屯總站') : `往 ${(DEST[r.sub] && DEST[r.sub][r.dir]) || r.stops[r.stops.length - 1]}`;
                    const [st, cls] = SRC_TXT[l.src];
                    const boardTxt = (l.src === 'live' || l.src === 'next') && l.board - now < 3600000
                        ? `<span class="live-time" data-deadline="${l.board}">${remainHtml(l.board)}</span>`
                        : clock(l.board);
                    const wmin = PLAN.WALK_MS / 60000;
                    const xfer = n === 0
                        ? (p.walkStart ? `<div class="plan-xfer">🚶 步行至 ${r.stops[l.i]}（約 ${wmin} 分）</div>` : '')
                        : `<div class="plan-xfer">↳ ${l.walk ? `步行至 ${r.stops[l.i]}（約 ${wmin} 分）` : `${r.stops[l.i]} 同站轉乘`}，候車約 ${Math.max(0, Math.round((l.board - l.ready) / 60000))} 分</div>`;
                    // 同一段可搭的其他路線 (同上下車站)
                    const more = p.alts[n].length > 9 ? ` <span class="muted">等 ${p.alts[n].length - 1} 條</span>` : '';
                    const alts = p.alts[n].slice(1, 9).map(a => {
                        const ar = R[a.ri];
                        return ar.kind === 'mrt' ? '' : badgeHtml(ar.sub, routeColorOf(ar.base, from.lid), `onclick="event.stopPropagation(); openRoutePanel('${ar.sub}', ${ar.dir})" title="${clock(a.board)} 上車（${SRC_TXT[a.src][0]}）"`, 'alt');
                    }).join('') + more;
                    const end = n === p.legs.length - 1 && p.walkEnd ? `<div class="plan-xfer">🚶 步行至 ${stationLabel(to.lid, to.idx)}（約 ${wmin} 分）</div>` : '';
                    return xfer + `<div class="plan-leg">${badge}<span class="lg-main">${toTxt}</span>
                        <span class="lg-sub">${r.stops[l.i]} 上車 ${boardTxt}<span class="src ${cls}">${st}</span> · 搭 ${l.j - l.i} 站 → ${r.stops[l.j]} 下車 約 ${clock(l.alight)}</span>
                        ${alts ? `<span class="lg-sub">也可搭 ${alts}</span>` : ''}</div>` + end;
                }).join('');
                return `<div class="plan-card${k === UI.planSel ? ' sel' : ''}" data-k="${k}">
                    <div class="plan-sum"><span>約 ${clock(p.arrive)} 抵達 <small>（${mins} 分）</small></span><small>${p.transfers ? `轉乘 ${p.transfers} 次` : '直達'}</small></div>${legs}
                    ${k === UI.planSel ? `<div class="panel-actions"><button class="panel-btn nav-go" onclick="event.stopPropagation(); startNav(${k})">🧭 開始導航</button></div>` : ''}</div>`;
            }).join('');

            // 精準度：缺時刻表的路線 / 非路廊站牌上車 (沒有即時) 可另外載入
            const used = [...new Set(res.plans.slice(0, 3).flatMap(p => p.legs.map(l => R[l.ri]).filter(r => r.kind === 'bus').map(r => routeOf(r.sub))))];
            const needSched = used.filter(rt => Sched.state(rt) === 'none');
            const needLive = [...new Set(res.plans.slice(0, 3).flatMap(p => p.legs.filter(l => l.src === 'sched').map(l => R[l.ri]).filter(r => r.kind === 'bus').map(r => routeOf(r.sub))))]
                .filter(rt => !RouteEta.loading.has(rt) && RouteEta.age(rt) > API_POLICY.freshMs);
            badgesContainer.innerHTML = actions + loadingNote + cards +
                `<div class="grp-mini">上車時刻都取自 TDX API：<span class="src live">即時</span>預估到站、<span class="src live">下一班</span>TDX 此站下一班時刻、<span class="src sched">表定</span>市區公車每日營運時刻表；<span class="src">捷運班距</span>依 TDX 捷運班距與站間時間。
                沒有 API 上車時刻的路線不列入${res.pendingCount ? `（${res.pendingCount} 個方案待時刻表）` : ''}。下車時間依時刻表站間時間或里程估算，轉乘預留同站 1 分、步行 3 分。</div>`;
            const extra = document.getElementById('plan-extra');
            const btns = [];
            if (needSched.length) btns.push(`<button class="panel-btn" id="plan-sched">載入時刻表（${needSched.length} 條，約 ${needSched.length}~${needSched.length * 2} 次 API）</button>`);
            if (needLive.length) btns.push(`<button class="panel-btn" id="plan-live">轉乘路線即時（${needLive.length} 次 API）</button>`);
            extra.innerHTML = btns.join(' ');
            if (document.getElementById('plan-sched')) document.getElementById('plan-sched').onclick = () => { needSched.forEach(rt => Sched.load(rt).catch(() => {})); runPlan(); };
            if (document.getElementById('plan-live')) document.getElementById('plan-live').onclick = () => { needLive.forEach(rt => RouteEta.request(rt)); runPlan(); };
            badgesContainer.querySelectorAll('.plan-card').forEach(c => c.addEventListener('click', () => { UI.planSel = Number(c.dataset.k); runPlan(); }));

            // 地圖亮出選取方案的各段路線
            const sel = res.plans[UI.planSel];
            const legsF = sel.legs.map(l => R[l.ri]).filter(r => r.kind === 'bus').map(r => ({ base: r.base, sub: r.sub, dir: r.dir, color: routeColorOf(r.base, from.lid) }));
            const key = 'plan|' + legsF.map(f => f.sub).join('>');
            if (!UI.focus || UI.focus.key !== key) {
                UI.focus = legsF.length ? { key, legs: legsF, base: legsF[0].base, color: legsF[0].color, plate: null } : null;
                renderMap();
            } else if (fresh) renderMap();
        }

        // 跟隨班次導航：把選取的方案交給查詢頁 (taichung-query.html?nav=…) 的 3D 導航模式
        function startNav(k) {
            const p = UI.planResult && UI.planResult[k];
            if (!p || !UI.plan) return;
            const R = PLAN_NET.routes;
            const pt = s => { const o = s.lid === 'mrt' ? MRT.stations[s.idx] : DATA[s.lid].stops[s.idx]; return { name: stationLabel(s.lid, s.idx), lat: o.lat, lng: o.lng }; };
            const legs = p.legs.map(l => { const r = R[l.ri];
                return r.kind === 'mrt' ? { k: 'mrt', dirKey: r.dirKey, b: r.stops[l.i], a: r.stops[l.j] } : { k: 'bus', sub: r.sub, dir: r.dir, b: r.stops[l.i], a: r.stops[l.j] }; });
            location.href = 'taichung-query.html?nav=' + encodeURIComponent(JSON.stringify({ from: pt(UI.plan.from), to: pt(UI.plan.to), legs, ws: p.walkStart, we: p.walkEnd }));
        }
        function renderMrtStationPanel(idx) {
            const st = MRT.stations[idx];
            const now = Date.now();
            title.textContent = '捷運 ' + st.name + ' 站';
