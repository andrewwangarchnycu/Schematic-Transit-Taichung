            desc.textContent = '臺中捷運綠線 · 依官方班距與站間行駛時間推估，非即時資料';
            panel.classList.add('active');
            const dirs = [['south', '往 高鐵臺中站'], ['north', '往 北屯總站']].map(([key, label]) => {
                const arr = mrtNextArrivals(idx, key, now);
                if (!arr.length && ((key === 'south' && idx === MRT.stations.length - 1) || (key === 'north' && idx === 0))) return '';
                const rows = arr.length
                    ? arr.map(t => `<div class="bus-info-row"><span class="bus-dir">${label}</span><span class="live-time" data-deadline="${t}">${remainHtml(t)}</span></div>`).join('')
                    : `<div class="bus-info-row"><span class="bus-dir">${label}</span><span class="eta-text muted">今日已收班</span></div>`;
                return `<div class="line-group">${badgeHtml('綠線', LINES.mrt.color)}<div class="arrival-time">${rows}</div></div>`;
            }).join('');
            badgesContainer.innerHTML = transferButtons('mrt', idx) + dirs;
        }

        // 路廊收合/展開 (捷運為單一路線，點擊只顯示路線資訊)
        function toggleCorridor(lid) {
            if (LINES[lid].kind === 'mrt') { renderMrtLinePanel(); return; }
            UI.focus = null;
            // 展開/收合都維持目前畫面 (不縮放)；正在看該路廊的站牌時保留站牌卡片
            const keepStation = UI.panelMode === 'station' && UI.current && UI.current.lid === lid;
            if (UI.expanded === lid) {
                UI.expanded = null;
                UI.highlight = null;
                if (UI.panelMode === 'corridor') closePanel();
                if (keepStation) renderStationPanel(false);
                renderMap();
                return;
            }
            UI.expanded = lid;
            UI.highlight = null;
            if (keepStation) renderStationPanel(false); else renderCorridorPanel(lid);
            renderMap();
            EtaStore.request(primaryChunkOf(lid));
        }

        function renderMrtLinePanel() {
            UI.panelMode = 'mrtline';
            const now = new Date();
            const wd = now.getDay();
            const table = MRT.headways[(wd === 0 || wd === 6) ? 'holiday' : 'weekday'];
            const cur = table.find(([s, e]) => { const t = now.getHours() * 60 + now.getMinutes(); const [sh, sm] = s.split(':').map(Number), [eh, em] = e.split(':').map(Number); return t >= sh * 60 + sm && t < eh * 60 + em; });
            title.textContent = '臺中捷運綠線';
            desc.textContent = `北屯總站 ↔ 高鐵臺中站 · 18 站 · ${cur ? `目前班距約 ${cur[2]} 分` : '非營運時段'}`;
            panel.classList.add('active');
            badgesContainer.innerHTML = `<div class="grp-mini">${table.map(([s, e, h]) => `${s}–${e}：每 ${h} 分`).join('<br>')}<br><br>地圖上的列車位置依班距與站間行駛時間推估。</div>`;
        }

        function selectGroup(key, fromMap) {
            const lid = key.split(':')[0];
            UI.focus = null;
            UI.highlight = UI.highlight === key ? null : key;
            if (UI.panelMode !== 'corridor' || UI.expanded !== lid) renderCorridorPanel(lid);
            badgesContainer.querySelectorAll('[data-key]').forEach(c => c.classList.toggle('hl', c.dataset.key === UI.highlight));
            renderMap();
            if (fromMap && UI.highlight) {
                const card = badgesContainer.querySelector(`[data-key="${CSS.escape(key)}"]`);
                if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function renderCorridorPanel(lid) {
            const Ln = LINES[lid];
            const stops = DATA[lid].stops;
            UI.panelMode = 'corridor';
            const drawn = Ln.groups.filter(g => g.lane !== null), rest = Ln.groups.filter(g => g.lane === null);
            title.textContent = Ln.full + ' 路廊';
            desc.textContent = `${DATA[lid].routes.length} 條路線 · ${Ln.groups.length} 種共線模式 · 點卡片或地圖線段可高亮路線`;
            panel.classList.add('active');

            const cards = drawn.map(g => {
                const first = g.cov[0], last = g.cov[g.cov.length - 1];
                let cov;
                if (g.cov.length === Ln.n) cov = `全段共線：${stops[0].name} ↔ ${stops[Ln.n - 1].name}（${Ln.n} 站）`;
                else cov = `${stops[first].name} ↔ ${stops[last].name}，停靠 ${g.cov.length} 站` + (g.express ? '（跳站/快速）' : '');
                const skipped = [];
                splitRuns(g.cov).forEach((r, i, runs) => {
                    if (i > 0) skipped.push(stops.slice(runs[i - 1][1] + 1, r[0]).map(s => s.name).join('、'));
                });
                const lines = [cov];
                if (!g.express && skipped.length) lines.push('不經：' + skipped.join(' / '));
                if (g.ends.low.length) lines.push(`${Ln.ends[0]}分岔 → ${g.ends.low.join('、')}`);
                if (g.ends.high.length) lines.push(`${Ln.ends[1]}分岔 → ${g.ends.high.join('、')}`);
                const variants = g.routes.flatMap(r => r.variants || []);
                if (variants.length) lines.push(`含支線：${variants.join('、')}`);
                return `<div class="grp-card${UI.highlight === g.key ? ' hl' : ''}" data-key="${g.key}">
                            <div class="grp-bar" style="background:${g.color}"></div>
                            <div class="grp-body">
                                <div class="grp-chips">${g.routes.map(r => badgeHtml(r.name, g.color)).join('')}</div>
                                <div class="grp-info">${lines.join('<br>')}</div>
                            </div>
                        </div>`;
            }).join('');

            const mini = rest.length ? `<div class="grp-mini">其他短程共線路線（點選才畫出）：<br>${
                rest.map(g => g.routes.map(r => badgeHtml(r.name, g.color,
                    `data-key="${g.key}" title="${stops[g.cov[0]].name} ↔ ${stops[g.cov[g.cov.length - 1]].name}"`, UI.highlight === g.key ? 'hl' : '')).join('')).join('')
            }</div>` : '';

            badgesContainer.innerHTML = cards + mini +
                `<div class="panel-actions"><button class="panel-btn" onclick="toggleCorridor('${lid}')">收合為代表線</button></div>`;
            badgesContainer.querySelectorAll('[data-key]').forEach(c => c.addEventListener('click', () => selectGroup(c.dataset.key, false)));
        }

        function closePanel() {
            panel.classList.remove('active');
            if (UI.panelMode === 'plan' || UI.planPick || UI.plan) { UI.plan = null; UI.planPick = null; UI.focus = null; renderMap(); }
            UI.panelMode = null;
            UI.current = null;
            UI.route = null;
            if (UI.focus) { UI.focus = null; renderMap(); }
        }

        // 點擊公車方塊：顯示完整路線資訊並亮出行駛區間 (再點一次取消)
        function focusVehicle(k) {
            if (UI.focus && UI.focus.key === k) { closePanel(); return; }
            UI.current = null;
            UI.highlight = null;
            if (k.startsWith('mrt|')) {
                UI.focus = { key: k, mrt: true };
                renderMrtLinePanel();
                renderMap();
                return;
            }
            const lid = k.split('|')[0];
            const t = (BUS_TRACKS[lid] || []).find(x => lid + '|' + x.key === k);
            if (!t) return;
            // 與查詢頁相同的路線資訊 (各站即時／時刻表、班次狀態)，地圖只畫這台車的行駛方向
            UI.route = null;
            openRoutePanel(t.sub, t.dir);
            Object.assign(UI.focus, { key: k, lid, plate: t.plate, color: LINES[lid].plan ? LINES[lid].color : UI.focus.color });
            renderRoutePanel();
            renderMap();
        }

        function renderVehiclePanel() {
            const f = UI.focus;
            UI.panelMode = 'vehicle';
            const t = (BUS_TRACKS[f.lid] || []).find(x => f.lid + '|' + x.key === f.key);
            const to = DEST[f.sub] && DEST[f.sub][f.dir];
            title.innerHTML = `${badgeHtml(f.sub, f.color)} ${to ? '往 ' + to : (f.dir ? '返程' : '去程')}`;
            desc.textContent = `車牌 ${f.plate} · 位置依預估到站時間推算`;
            panel.classList.add('active');

            const corridors = BUS_LINES.filter(l => DATA[l].routes.some(r => r.name === f.base)).map(l => {
                const r = DATA[l].routes.find(x => x.name === f.base), st = DATA[l].stops;
                return `<span style="color:${LINES[l].color}">●</span> ${LINES[l].full}：${shortName(l, st[r.cov[0]].name)} ↔ ${shortName(l, st[r.cov[r.cov.length - 1]].name)}（${r.cov.length} 站）`;
            });
            const now = Date.now();
            const upcoming = t ? t.pts.filter(p => p.dl > now - 30000).slice(0, 10) : [];
            const rows = upcoming.map(p => `<div class="bus-info-row"><span class="bus-dir">${DATA[f.lid].stops[p.idx].name}</span><span class="live-time" data-deadline="${p.dl}">${remainHtml(p.dl)}</span></div>`).join('');
            const nextLine = t && t.nextLine ? `<br>離開${LINES[f.lid].name}後接續：<span style="color:${LINES[t.nextLine].color}">●</span> ${LINES[t.nextLine].full}` : '';
            badgesContainer.innerHTML =
                `<div class="grp-mini">行經路廊（地圖已亮出行駛區間）<br>${corridors.join('<br>')}${nextLine}</div>` +
                (rows ? `<div class="line-group" style="grid-column: 1 / -1">${badgeHtml('此車接下來停靠', '#444')}<div class="arrival-time">${rows}</div></div>` : '') +
                `<div class="panel-actions"><button class="panel-btn" onclick="closePanel()">取消路線聚焦</button></div>`;
        }

        // ==========================================
        //  PART 9: 自動更新 / 倒數 / 定位
        // ==========================================

        function toggleAutoRefresh() {
            const btn = document.getElementById('btn-auto-refresh');
            const icon = document.getElementById('refresh-icon');
            isAutoRefreshOn = !isAutoRefreshOn;
            btn.classList.toggle('active', isAutoRefreshOn);
            icon.textContent = isAutoRefreshOn ? "II" : "▶";
            if (isAutoRefreshOn) autoRefreshTick();
        }

        // 自動更新：正在看的區塊 30 秒一次，其他區塊 2 分鐘一次 (仍受每分鐘 3 次上限控管)
        function focusChunk() {
            if (UI.current && LINES[UI.current.lid].kind === 'bus') return chunkOfStation(UI.current.lid, UI.current.idx);
            if (UI.expanded) return primaryChunkOf(UI.expanded);
            return null;
        }
        function autoRefreshTick() {
            if (!isAutoRefreshOn || document.visibilityState !== 'visible' || EtaStore.busy()) return;
            if (UI.panelMode === 'route' && UI.route) {
                const base = routeOf(UI.route.sub);
                if (RouteEta.age(base) >= API_POLICY.focusRefreshMs && !ApiTasks.pending()) RouteEta.request(base);
                // 線上車輛配對：60 秒一次即可 (發車時刻不常變)
                else if (TripLive.age(base) >= 60000 && !ApiTasks.pending()) TripLive.request(base);
                return;
            }
            const focus = focusChunk();
            if (focus && EtaStore.age(focus) >= API_POLICY.focusRefreshMs) { EtaStore.request(focus); return; }
            if (!liveOn()) return;   // 即時車輛關閉：不在背景更新其他區塊
            const oldest = CHUNKS.map(c => c.id).sort((a, b) => EtaStore.age(b) - EtaStore.age(a))[0];
            if (EtaStore.age(oldest) >= API_POLICY.backgroundRefreshMs) EtaStore.request(oldest);
        }

        // 回到畫面時繼續排隊中的請求
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { EtaStore._pump(); autoRefreshTick(); }
        });

        // API 狀態：平常只顯示倒數，點一下展開完整資訊
        const statusEl = document.getElementById('api-status');
        let statusOpen = false;
        statusEl.addEventListener('click', e => {
            if (!tdxKey() || e.target.closest('[data-act="key"]')) { openKeyDialog(); return; }
            if (e.target.closest('[data-act="refresh-all"]')) { CHUNKS.forEach(c => EtaStore.request(c.id, { force: true })); updateStatusPill(); return; }
            statusOpen = !statusOpen;
            updateStatusPill();
        });

        function updateStatusPill() {
            const used = ApiBudget.used(), wait = ApiBudget.waitMs();
            const busy = EtaStore.inflight || ApiTasks.busy;
            // 倒數：額度用完→等待額度；自動更新→下次更新；否則顯示最舊資料的秒數
            let short;
            if (busy) short = '⟳ 更新中';
            else if (wait > 0) short = `⏳ ${Math.ceil(wait / 1000)}s`;
            else if (isAutoRefreshOn) {
                const f = focusChunk();
                const ages = f ? [EtaStore.age(f)] : CHUNKS.map(c => EtaStore.age(c.id));
                const due = f ? API_POLICY.focusRefreshMs : API_POLICY.backgroundRefreshMs;
                const left = Math.max(0, Math.ceil((due - Math.max(...ages.filter(isFinite), 0)) / 1000));
                short = `↻ ${left}s`;
            } else short = EtaStore.hasData() ? `${Math.round(Math.max(...CHUNKS.map(c => EtaStore.age(c.id)).filter(isFinite)) / 1000)}s` : '--';
            if (!tdxKey()) { statusEl.className = 'warn'; statusEl.textContent = '🔑 設定 TDX 金鑰'; statusEl.title = '需要 TDX API 金鑰才能取得即時資料'; return; }
            statusEl.className = (EtaStore.lastError ? 'err' : (wait > 0 ? 'warn' : '')) + (statusOpen ? ' open' : '');
            if (!statusOpen) {
                statusEl.textContent = short;
                statusEl.title = EtaStore.lastError || '點擊查看 API 用量與資料時間';
                return;
            }
            const lines = [
                `API 呼叫：${used}/${API_POLICY.maxCallsPerMinute}（每分鐘）${wait > 0 ? `，${Math.ceil(wait / 1000)} 秒後可再呼叫` : ''}`,
                EtaStore.inflight ? '即時資料更新中' : EtaStore.queue.length ? `即時資料排隊 ${EtaStore.queue.length} 區塊` : '',
                ApiTasks.pending() ? `時刻表／路線查詢排隊 ${ApiTasks.pending()} 筆` : '',
                EtaStore.hasData() ? '各區塊資料：' + CHUNKS.map(c => isFinite(EtaStore.age(c.id)) ? Math.round(EtaStore.age(c.id) / 1000) + 's' : '--').join(' / ') + ' 前' : '尚無資料',
                isAutoRefreshOn ? '自動更新：開（看的區塊 30 秒、其他 2 分鐘）' : '自動更新：關（右側 ▶ 開啟）',
                EtaStore.lastError ? '錯誤：' + EtaStore.lastError : ''
            ].filter(Boolean);
            statusEl.innerHTML = `<b>${short}</b><br>${lines.join('<br>')}<br><span class="pill-btn" data-act="refresh-all">立即更新全部</span> <span class="pill-btn" data-act="key">TDX 金鑰</span>`;
            statusEl.title = '點擊收合';
        }

        // 每秒：倒數、車輛移動 (純前端運算，不消耗 API) + 自動更新排程
        setInterval(() => {
            document.querySelectorAll('.live-time').forEach(e => {
                const dl = Number(e.dataset.deadline);
                if (dl) e.innerHTML = remainHtml(dl);
            });
            const age = document.getElementById('data-age');
            if (age) age.textContent = dataAgeText(age.dataset.chunk);
            if (UI.panelMode === 'station' && UI.current && UI.current.lid === 'mrt' && new Date().getSeconds() === 0) renderMrtStationPanel(UI.current.idx);
            updateStatusPill();
            updateVehicles();
            autoRefreshTick();
        }, 1000);

        EtaStore.onChange(kind => {
            if (kind === 'data') {
                rebuildBusTracks();
                updateVehicles();
                if (UI.panelMode === 'station' && UI.current) renderStationPanel(false);
                if (UI.panelMode === 'vehicle' && UI.focus) renderVehiclePanel();
                if (UI.panelMode === 'plan') runPlan();
            }
            updateStatusPill();
        });

        function handleGeolocation() {
            if (!navigator.geolocation) {
                alert("您的裝置不支援定位功能");
                return;
            }
            const btn = document.getElementById('btn-location');
            btn.style.opacity = "0.5";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    btn.style.opacity = "1";
                    const { latitude: lat, longitude: lng } = position.coords;
                    const cosLat = Math.cos(lat * Math.PI / 180);
                    let best = null;
                    visibleLines().map(Ln => Ln.id).forEach(lid => stopsOf(lid).forEach((st, idx) => {
                        const dx = (st.lng - lng) * cosLat, dy = st.lat - lat;
                        const dist = Math.sqrt(dx * dx + dy * dy) * 111.32;   // km
                        if (!best || dist < best.dist) best = { lid, idx, dist };
                    }));
                    if (!best) { alert("附近找不到車站資料"); return; }
                    handleStationClick(best.lid, best.idx);
                    if (best.dist > 3) desc.insertAdjacentHTML('beforeend', ` · 距您約 ${best.dist.toFixed(1)} km`);
                },
                (error) => {
                    btn.style.opacity = "1";
                    console.error(error);
                    alert("無法取得定位，請確認權限開啟");
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        // 初始化：先用快取畫圖，各區塊過期才抓 (重新整理頁面不會重複耗用額度)
        EtaStore.init();
        rebuildBusTracks();
        renderMap();
        updateStatusPill();
        if (!window.__EDITOR__ && !window.__PREVIEW__ && liveOn()) CHUNKS.forEach(c => EtaStore.request(c.id));   // 編輯器 / 手機預覽不自動打 API
        // 手機直式：一開始放大到市中心 (臺中車站附近)，按 ↺ 看全圖
        if (!window.__EDITOR__ && layoutName === 'portrait') setTimeout(() => {
            const i = DATA.bl.stops.findIndex(s => s.name === '臺中車站');
            if (i < 0) return;
            const p = stopPoint('bl', i);
            focusSvgPoint(p.x - VB.w * 0.12, p.y - VB.h * 0.06, 2.2);
        }, 300);

        // ===== 編輯器介面 (map-editor.html 使用) =====
        function rebuildFromDesign() {
            Object.entries(MAP_DESIGN.lines).forEach(([id, l]) => Object.assign(LINES[id], l));
            LAYOUTS = buildLayouts(MAP_DESIGN.master);
            BASE_INTERCHANGES = [...MAP_DESIGN.interchanges.base, ...MAP_DESIGN.interchanges.common];
            CENTER_INTERCHANGES = [...MAP_DESIGN.interchanges.center, ...MAP_DESIGN.interchanges.common];
            INTERCHANGES = mapMode === 'center' ? CENTER_INTERCHANGES : BASE_INTERCHANGES;
            indexInterchanges();
            applyLayout(layoutName);
            rebuildBusTracks();
            renderMap();
        }
        window.__mapApi = {
            get design() { return MAP_DESIGN; },
            setDesign(d) { MAP_DESIGN = d; rebuildFromDesign(); },
            rebuild: rebuildFromDesign,
            setLayout(name) { applyLayout(name); renderMap(); },
            get layoutName() { return layoutName; },
            get mapMode() { return mapMode; },
            toggleCenterMode, LINES, stopsOf, stopPoint, pointAt, distOf, mapRoot,
            get VB() { return VB; },
            get skippedLabels() { return skippedLabels; }
        };
    </script>
</body>
