<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>臺中公車查詢</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
    :root { --bg: #161719; --panel: #1f2124; --line: #34373c; --text: #ececec; --muted: #9aa0a6; --accent: #4caf50; --live: #00bcd4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    #app { display: grid; grid-template-columns: 440px minmax(0, 1fr); grid-template-rows: auto 1fr; height: 100%; }
    header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); padding-top: max(8px, env(safe-area-inset-top)); }
    header h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
    header a { color: var(--muted); font-size: 12px; text-decoration: none; }
    .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .tabs button { background: none; border: 0; color: var(--muted); padding: 6px 14px; font: inherit; cursor: pointer; }
    .tabs button.on { background: #2f6b3a; color: #fff; }
    input[type=search], select { background: #2a2d31; color: var(--text); border: 1px solid #44484e; border-radius: 8px; padding: 6px 10px; font: inherit; }
    input[type=search] { flex: 1; min-width: 140px; }
    button.btn { background: #2f3338; color: #fff; border: 1px solid #474c53; border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
    button.btn:hover { background: #3a3f45; }
    button.btn:disabled { opacity: .45; cursor: default; }
    #api { font-size: 12px; color: #ccc; background: #2a2d31; border: 1px solid #44484e; border-radius: 14px; padding: 3px 10px; cursor: pointer; font-variant-numeric: tabular-nums; }
    #api.warn { color: #ffeb3b; } #api.err { color: #ff8a80; }
    #api-detail { position: absolute; z-index: 2000; background: #26292d; border: 1px solid #44484e; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #ccc; line-height: 1.7; display: none; max-width: 320px; }
    #panel { overflow-x: hidden; overflow-y: auto; border-right: 1px solid var(--line); padding: 10px 12px 60px; }
    #map { height: 100%; background: #222; }
    .muted { color: var(--muted); }
    .hint { color: var(--muted); font-size: 13px; margin: 8px 0; }
    .list-item { display: flex; gap: 8px; align-items: center; padding: 7px 6px; border-bottom: 1px solid #2a2d31; cursor: pointer; }
    .list-item:hover { background: #26292d; }
    .list-item .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-block; min-width: 34px; text-align: center; padding: 2px 7px; border-radius: 5px; font-weight: bold; font-size: 13px; color: #fff; white-space: nowrap; }
    h2 { font-size: 18px; margin: 4px 0 2px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
    .stop-card { background: #222428; border: 1px solid #2f3236; border-radius: 10px; margin: 10px 0; overflow: hidden; }
    .stop-head { padding: 7px 10px; background: #2a2d31; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .stop-head b { font-size: 15px; }
    .stop-no { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #111; font-weight: bold; font-size: 12px; }
    .rt { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 10px; border-top: 1px solid #2c2f33; cursor: pointer; }
    .rt:hover { background: #26292d; }
    .rt .to { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rt .eta { font-family: ui-monospace, monospace; color: var(--live); white-space: nowrap; font-size: 13px; text-align: right; }
    .rt .tt { grid-column: 2 / -1; font-family: ui-monospace, monospace; font-size: 12px; color: #bbb; }
    .times { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 10px; font-family: ui-monospace, monospace; font-size: 12px; padding: 4px 0 2px; color: #ddd; }
    .times .past { color: #5f6368; }
    .times .next { color: #ffeb3b; font-weight: bold; }
    .daytab { font-family: ui-monospace, monospace; font-size: 12px; margin: 4px 0 2px; border: 1px solid #2f3236; border-radius: 6px; overflow: hidden; }
    .daytab .hr { display: grid; grid-template-columns: 30px 1fr; border-top: 1px solid #2a2d31; }
    .daytab .hr:first-child { border-top: 0; }
    .daytab .hr b { background: #2a2d31; text-align: center; color: #ccc; padding: 1px 0; }
    .daytab .hr.cur b { background: #5d4f0f; color: #ffeb3b; }
    .daytab .hr.empty { color: #555; }
    .daytab .mins { display: flex; flex-wrap: wrap; gap: 0 9px; padding: 1px 8px; color: #ddd; }
    .daytab .mins .past { color: #5f6368; }
    .daytab .mins .next { color: #ffeb3b; font-weight: bold; }
    .bus-ico { width: 26px; height: 26px; }
    .bus-ico svg { overflow: visible; }
    .soon { color: #ffeb3b; font-weight: bold; } .now { color: #ff5252; font-weight: bold; }
    .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: #3b4148; color: #ccc; margin-left: 4px; white-space: nowrap; }
    .tag.api { background: #1b5e20; color: #b9f6ca; } .tag.sched { background: #283593; color: #c5cae9; } .tag.est { background: #5d4037; color: #ffccbc; }
    .dly { font-size: 11px; padding: 0 4px; border-radius: 3px; white-space: nowrap; font-family: inherit; }
    .dly.late { background: #5a2323; color: #ff9e9e; } .dly.early { background: #1f3f5a; color: #9fd3ff; } .dly.ontime { background: #24452a; color: #a5e0ad; }
    .cmp { font-size: 11px; color: #aaa; white-space: nowrap; font-family: inherit; }
    .cmp s { color: #888; }
    .bike-box { background: #1e2a22; border: 1px solid #2e4a36; border-radius: 10px; margin: 10px 0; padding: 6px 10px; }
    .bike-box .bk { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 4px 0; border-top: 1px solid #2a3a2f; }
    .bike-box .bk:first-of-type { border-top: 0; }
    .bike-box .num { font-family: ui-monospace, monospace; white-space: nowrap; text-align: right; }
    .bike-box .num b { color: #ffd54f; } .bike-box .num i { font-style: normal; color: #80cbc4; }
    .go-btn { flex: none; margin-left: auto; display: inline-flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 6px; border-radius: 8px; background: #1a73e8; color: #fff; text-decoration: none; font-size: 10px; line-height: 1; }
    .go-btn:hover { background: #1765cc; }
    .map-btn { display: block; min-width: 34px; height: 34px; line-height: 32px; padding: 0 8px; text-align: center; font-size: 16px; background: #2a2d31 !important; color: #eee !important; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .map-btn.near-btn { font-size: 14px; font-weight: bold; background: #1a73e8 !important; color: #fff !important; height: 40px; line-height: 38px; padding: 0 14px; border-radius: 20px !important; }
    .bs-opt { display: block; padding: 3px 0; cursor: pointer; }
    .ico { flex: none; width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
    .ico.bus { background: #ffd600; } .ico.bike { background: #2e7d32; }
    .bike-item .num { font-family: ui-monospace, monospace; font-size: 12px; }
    .bike-item .num b { color: #ffd54f; } .bike-item .num i { font-style: normal; color: #80cbc4; }
    .bike-ico { background: #2e7d32; color: #fff; border: 2px solid #fff; border-radius: 8px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .seq { position: relative; margin: 8px 0 0 6px; }
    .seq-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 0 8px; align-items: start; padding: 5px 0; cursor: pointer; }
    .seq-row:hover { background: #222428; }
    .seq-dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid; margin: 3px auto 0; position: relative; z-index: 1; }
    .seq-line { position: absolute; left: 17px; top: 12px; bottom: 12px; width: 6px; border-radius: 3px; }
    .seq-name { overflow: hidden; }
    .seq-name small { color: var(--muted); }
    .seq-eta { font-family: ui-monospace, monospace; font-size: 13px; color: var(--live); text-align: right; white-space: nowrap; }
    .seq-row .times { grid-column: 2 / -1; }
    .seq-row.here { background: rgba(255,235,59,.08); }
    .mrt-svg text { fill: #eee; font-size: 12px; }
    .leaflet-container { background: #1d1f22; font: inherit; }
    .leaflet-control-attribution { background: rgba(20,20,22,.75) !important; color: #aaa; }
    .leaflet-control-attribution a { color: #8ab4f8; }
    .leaflet-bar a { background: #2a2d31; color: #eee; border-color: #444; }
    .leaflet-tooltip { background: #26292d; color: #eee; border-color: #555; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #26292d; color: #eee; box-shadow: 0 3px 14px rgba(0,0,0,.6); }
    .leaflet-popup-content a { color: #8ab4f8; }
    .leaflet-container a.leaflet-popup-close-button { color: #aaa; }
    .loc-btn { display: block; width: 34px; height: 34px; line-height: 32px; text-align: center; font-size: 20px; background: #2a2d31 !important; color: #ccc !important; text-decoration: none; cursor: pointer; }
    .loc-btn.on { color: #1a73e8 !important; }
    .loc-btn.follow { color: #fff !important; background: #1a73e8 !important; }
    .loc-btn.err { color: #ff8a80 !important; }
    .me-ico { pointer-events: auto; }
    .me-pulse { animation: mepulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes mepulse { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.6); opacity: 0; } }
    #key-dlg { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; }
    #key-dlg .key-box { background: #222428; border: 1px solid #44484e; border-radius: 12px; padding: 16px; width: min(420px, 100%); }
    #key-dlg p { color: var(--muted); font-size: 13px; }
    #key-dlg a { color: #8ab4f8; }
    #key-dlg input { width: 100%; margin: 4px 0; padding: 8px; background: #2a2d31; color: var(--text); border: 1px solid #44484e; border-radius: 6px; font: inherit; }
    #base-set { position: absolute; z-index: 2000; right: 12px; top: 56px; width: min(360px, calc(100vw - 24px)); background: #26292d; border: 1px solid #44484e; border-radius: 10px; padding: 10px 12px; display: none; }
    .stn-icon { background: #fff; border: 2px solid #333; border-radius: 50%; color: #111; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    @media (max-width: 760px) {
        #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 36vh 1fr; }
        input[type=search] { min-width: 0; flex-basis: 100%; order: 5; }
        #panel { min-width: 0; }
        #map { grid-row: 2; }
        #panel { grid-row: 3; border-right: 0; border-top: 1px solid var(--line); padding-bottom: max(60px, env(safe-area-inset-bottom)); }
        header h1 { font-size: 15px; }
    }
</style>

<body>
<div id="app">
    <header>
        <h1>臺中公車查詢</h1>
        <div class="tabs"><button id="tab-station" class="on">站位</button><button id="tab-route">路線</button></div>
        <input type="search" id="q" placeholder="輸入站名，例：臺中車站" autocomplete="off">
        <select id="date" title="時刻表日期"></select>
        <span id="api" title="點擊查看 API 用量">--</span>
        <a href="taichung.html">← 路線圖</a>
    </header>
    <div id="panel"><div class="hint">載入站牌資料中…</div></div>
    <div id="map"></div>
</div>
<div id="api-detail"></div>
<div id="base-set"></div>
<div id="key-dlg"></div>
<script src="taichung-network.js"></script>
<!-- 本機開發用金鑰 (gitignore)；公開網站沒有此檔，訪客自行輸入金鑰 -->
<script src="tdx-key.local.js"></script>
<script>
'use strict';
// ==========================================================
//  臺中公車查詢 (分支功能)
//   1. 站位 → 站牌：依行車方向分組，列出各路線即時到站與時刻表
//   2. 路線：即時、各站時刻表 (今日＝每日營運時刻表；未來日＝路線班表)；捷運＝路線簡圖＋實際線形
//   API 額度與 taichung.html 共用 (localStorage 同一組計數，每分鐘 3 次)
// ==========================================================
const TDX = {
    clientId: (window.TDX_LOCAL_KEY || {}).id || "",
    clientSecret: (window.TDX_LOCAL_KEY || {}).secret || "",
    authUrl: "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token",
    bus: "https://tdx.transportdata.tw/api/basic/v2/Bus"
};
const MAX_PER_MIN = 3, FRESH_MS = 25000;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ---------- 本機儲存 ----------
const mem = {};
const store = {
    get(k) { try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : null; },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

// ---------- API 額度 (與路線圖共用) ----------
const ApiBudget = {
    KEY: 'txg_api_calls', BLOCK_KEY: 'txg_api_block',
    stamps() { const now = Date.now(); return (store.get(this.KEY) || []).filter(t => now - t < 60000); },
    used() { return this.stamps().length; },
    waitMs() {
        const now = Date.now(), s = this.stamps();
        return Math.max(0, s.length < MAX_PER_MIN ? 0 : s[0] + 60000 - now, (store.get(this.BLOCK_KEY) || 0) - now);
    },
    take() { if (this.waitMs() > 0) return false; const s = this.stamps(); s.push(Date.now()); store.set(this.KEY, s); return true; },
    blockFor(ms) { store.set(this.BLOCK_KEY, Date.now() + ms); }
};
// TDX 金鑰：使用者在本機設定的優先 (與路線圖共用)，其次為檔案內建 (公開部署版留空)
const tdxKey = () => {
    const k = store.get('txg_tdx_key');
    if (k && k.id && k.secret) return k;
    return TDX.clientId && TDX.clientSecret ? { id: TDX.clientId, secret: TDX.clientSecret } : null;
};
function openKeyDialog() {
    const d = $('key-dlg'), k = store.get('txg_tdx_key') || {};
    d.innerHTML = `<div class="key-box"><b>TDX API 金鑰</b>
        <p>即時資料與時刻表來自交通部 TDX 運輸資料流通服務。請到 <a href="https://tdx.transportdata.tw/" target="_blank" rel="noopener">tdx.transportdata.tw</a> 免費註冊，在「會員中心 → API 金鑰」取得 Client ID 與 Client Secret。金鑰只存在這台裝置的瀏覽器，不會上傳。</p>
        <input id="key-id" placeholder="Client ID" value="${esc(k.id || '')}" autocomplete="off">
        <input id="key-secret" placeholder="Client Secret" value="${esc(k.secret || '')}" autocomplete="off" type="password">
        <div class="row"><button class="btn" id="key-ok">儲存</button><button class="btn" id="key-clear">清除</button><button class="btn" id="key-close">關閉</button></div></div>`;
    d.style.display = 'flex';
    $('key-ok').onclick = () => { const id = $('key-id').value.trim(), secret = $('key-secret').value.trim(); if (!id || !secret) return;
        store.set('txg_tdx_key', { id, secret }); store.del('txg_tdx_token'); Api.lastError = null; d.style.display = 'none'; updateApi(); rerender(); };
    $('key-clear').onclick = () => { store.del('txg_tdx_key'); store.del('txg_tdx_token'); openKeyDialog(); updateApi(); };
    $('key-close').onclick = () => { d.style.display = 'none'; };
}
async function getToken() {
    const c = store.get('txg_tdx_token');
    if (c && c.exp > Date.now() + 60000) return c.token;
    const key = tdxKey();
    if (!key) { setTimeout(openKeyDialog, 0); throw new Error('尚未設定 TDX 金鑰'); }
    const res = await fetch(TDX.authUrl, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'client_credentials', client_id: key.id, client_secret: key.secret }) });
    if (!res.ok) throw new Error('Token 取得失敗 ' + res.status);
    const d = await res.json();
    store.set('txg_tdx_token', { token: d.access_token, exp: Date.now() + d.expires_in * 1000 });
    return d.access_token;
}
// 依序排隊呼叫；high 優先 (使用者剛點的即時資料)
const Api = {
    q: [], busy: false, timer: null, lastError: null, label: '',
    // api：'Bus' (預設) 或 'Bike' (公共自行車)
    run(path, params, { high = false, label = '', api = 'Bus' } = {}) {
        const base = api === 'Bus' ? TDX.bus : TDX.bus.replace(/\/Bus$/, '/' + api);
        const url = `${base}/${path}?` + new URLSearchParams({ ...params, '$format': 'JSON' });
        return new Promise((resolve, reject) => {
            const t = { url, resolve, reject, high, label };
            if (high) this.q.unshift(t); else this.q.push(t);
            this.pump(); updateApi();
        });
    },
    pending() { return this.q.length + (this.busy ? 1 : 0); },
    pump() {
        if (this.busy || this.timer || !this.q.length) return;
        const w = ApiBudget.waitMs();
        if (w > 0) { this.timer = setTimeout(() => { this.timer = null; this.pump(); }, w + 300); return; }
        const t = this.q.shift();
        this.busy = true; this.label = t.label;
        this.fetch(t.url, true).then(v => { this.lastError = null; t.resolve(v); }, e => { this.lastError = e.message; t.reject(e); })
            .finally(() => { this.busy = false; this.label = ''; this.pump(); updateApi(); });
    },
    async fetch(url, retry) {
        const token = await getToken();
        while (!ApiBudget.take()) await new Promise(r => setTimeout(r, ApiBudget.waitMs() + 300));
        const res = await fetch(url, { headers: { authorization: 'Bearer ' + token } });
        if (res.status === 401 && retry) { store.del('txg_tdx_token'); return this.fetch(url, false); }
        if (res.status === 429) { ApiBudget.blockFor(60000); throw new Error('已達 API 頻率上限 (429)'); }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    }
};
let apiOpen = false;
function updateApi() {
    const w = ApiBudget.waitMs(), el = $('api');
    if (!tdxKey()) { el.textContent = '🔑 金鑰'; el.className = 'warn'; el.title = '設定 TDX API 金鑰'; $('api-detail').style.display = 'none'; return; }
    el.textContent =Api.busy ? '⟳' : w > 0 ? `⏳ ${Math.ceil(w / 1000)}s` : Api.q.length ? `排隊 ${Api.q.length}` : `${MAX_PER_MIN - ApiBudget.used()}/${MAX_PER_MIN}`;
    el.className = Api.lastError ? 'err' : w > 0 ? 'warn' : '';
    const d = $('api-detail');
    if (!apiOpen) { d.style.display = 'none'; return; }
    const r = el.getBoundingClientRect();
    d.style.display = 'block'; d.style.left = Math.max(8, Math.min(innerWidth - 330, r.left)) + 'px'; d.style.top = (r.bottom + 6) + 'px';
    d.innerHTML = [`每分鐘可呼叫 ${MAX_PER_MIN} 次 (與路線圖共用)，已用 ${ApiBudget.used()} 次`,
        w > 0 ? `${Math.ceil(w / 1000)} 秒後可再呼叫` : '目前可呼叫',
        Api.busy ? `呼叫中：${esc(Api.label)}` : '', Api.q.length ? `排隊：${Api.q.map(t => esc(t.label)).join('、')}` : '',
        Api.lastError ? '錯誤：' + esc(Api.lastError) : ''].filter(Boolean).join('<br>') +
        '<br><button class="btn" id="api-key-btn" style="margin-top:4px">TDX 金鑰設定</button>';
    $('api-key-btn').onclick = () => { apiOpen = false; updateApi(); openKeyDialog(); };
}
$('api').onclick = () => { if (!tdxKey()) { openKeyDialog(); return; } apiOpen = !apiOpen; updateApi(); };
setInterval(() => { updateApi(); tickLive(); }, 1000);

// ---------- 時間工具 ----------
const pad = n => String(n).padStart(2, '0');
const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
const fmt = m => { const r = Math.round(m); return `${pad(Math.floor(r / 60) % 24)}:${pad(r % 60)}`; };
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const WD_KEY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function remain(dl) {

// 日期：今日 + 未來 6 日
(function () {
    const s = $('date');
    for (let k = 0; k < 7; k++) { const d = new Date(); d.setDate(d.getDate() + k);
        s.insertAdjacentHTML('beforeend', `<option value="${dateKey(d)}">${k ? '' : '今日 '}${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})</option>`); }
    s.onchange = () => rerender();
})();
const selDate = () => $('date').value || todayKey();
function rerender() {
    if (!view) return;
    if (view.type === 'station') renderStation(); else if (view.type === 'route') renderRoute(); else if (view.type === 'near') renderNearRoutes();
    else if (view.type === 'stlist') { const k = panel.scrollTop; listStations(view.list, view.head, view.place, false); panel.scrollTop = k; }
    else renderMrt();
}

// ---------- 搜尋 ----------
function renderSearch() {
    const q = $('q').value.trim();
    if (mode === 'station') {
        if (!q) { panel.innerHTML = `<div class="hint">輸入站名搜尋、按「📍 附近」，或把地圖放大後點選站位。<br>全市 ${STATIONS.size} 個同名站（${SID_COUNT} 個站位、${STOPS.length} 筆站牌）、${SUBS.length} 條路線 (靜態資料 ${NET.gen})。</div>`; return; }
        const hits = [...STATIONS.values()].filter(s => s.name.includes(q)).sort((a, b) => (a.name === q ? -1 : 0) - (b.name === q ? -1 : 0) || b.routes.size - a.routes.size).slice(0, 60);
        listStations(hits, `「${esc(q)}」${hits.length >= 60 ? '前 60 個' : hits.length + ' 個'}站位`);
    } else {
        const subs = SUBS.filter(s => !q || s.includes(q)).sort((a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true }));
        const showMrt = !q || '捷運綠線'.includes(q) || /綠|捷運|mrt/i.test(q);
        panel.innerHTML = (showMrt ? `<div class="list-item" data-mrt="1"><span class="badge" style="background:${NET.mrt.color || '#8cc540'}">綠線</span><div><div>臺中捷運綠線</div><div class="sub">北屯總站 ↔ 高鐵臺中站 · 18 站</div></div></div>` : '') +
            subs.slice(0, 200).map(s => { const ds = routeDirs(s); return `<div class="list-item" data-sub="${esc(s)}">${badge(s)}<div style="min-width:0"><div class="sub">${ds.map(r => '往 ' + esc(destOf(r))).join(' ／ ')}</div></div></div>`; }).join('') +
            (subs.length > 200 ? `<div class="hint">還有 ${subs.length - 200} 條，請輸入更多字</div>` : '');
        panel.querySelectorAll('[data-sub]').forEach(e => e.onclick = () => openRoute(e.dataset.sub, routeDirs(e.dataset.sub)[0].dir));
        const m = panel.querySelector('[data-mrt]'); if (m) m.onclick = openMrt;
    }
}
// 前往：Google 地圖步行導航 (起點＝目前位置)

// 清單圖示：公車站位 / YouBike 站
const ICO_BUS = `<span class="ico bus" title="公車站位"><svg width="16" height="16" viewBox="-8 -8 16 16"><path d="M -5.5 -6 h 11 a 1.5 1.5 0 0 1 1.5 1.5 v 8.5 h -14 v -8.5 a 1.5 1.5 0 0 1 1.5 -1.5 z" fill="#111"/><rect x="-4.6" y="-4.6" width="9.2" height="3.6" rx=".6" fill="#ffd600"/><circle cx="-3.6" cy="1.6" r="1" fill="#ffd600"/><circle cx="3.6" cy="1.6" r="1" fill="#ffd600"/><path d="M -5 4 v 2.4 M 5 4 v 2.4" stroke="#111" stroke-width="2"/></svg></span>`;

// 站位清單；place 有給時 (定位「附近」) 一併列出半徑內 YouBike 站，依距離混排
function listStations(list, head, place = null, fit = true) {
    const bikes = place ? (bikeList(place) || []) : [], av = place ? bikeAvail.get(place.id) : null;
    const items = list.map(s => ({ kind: 'bus', s, d: s.dist })).concat(bikes.map(b => ({ kind: 'bike', b, d: b.dist })));
    if (place) items.sort((a, b) => a.d - b.d);
    const STAT = { 0: '停止營運', 2: '暫停營運' };
    const bikeHead = place ? `<div class="hint">🚲 ${bikeR(place)} 公尺內 YouBike：${loading.has('bk:' + place.id) ? '載入中…' : bikeList(place) ? `${bikes.length} 站${av ? ` · ${new Date(av.at).toLocaleTimeString('zh-TW', { hour12: false })}` : ''}` : '尚未查詢'}
        ${bikeList(place) ? `<button class="btn" id="b-bike" style="padding:1px 8px">更新 (1 次 API)</button>` : ''}</div>` : '';
    panel.innerHTML = `<div class="hint">${head}</div>${bikeHead}` + items.map(it => {
        if (it.kind === 'bus') { const s = it.s;
            return `<div class="list-item" data-id="${esc(s.id)}">${ICO_BUS}
            <div style="min-width:0"><div>${esc(s.name)}${s.dist !== undefined ? ` <small class="muted">${Math.round(s.dist)} m</small>` : ''} <small class="muted">· ${boardsOf(STATIONS.get(s.id)).length} 支站牌</small></div><div class="sub">${[...s.routes].slice(0, 14).map(esc).join('、')}${s.routes.size > 14 ? ` 等 ${s.routes.size} 條` : ''}</div></div>${navBtn(s.lat, s.lng, s.name)}</div>`; }
        const b = it.b, a = av && av.map[b.uid];
        const num = !a ? '<span class="muted">--</span>' : a.status !== 1 ? `<span class="muted">${STAT[a.status] || '狀態不明'}</span>`
            : `可借 <b>${a.rent}</b>${a.ebike ? `<span class="muted">（電輔 ${a.ebike}）</span>` : ''} · 可還 <i>${a.ret}</i>`;
        return `<div class="list-item bike-item" data-bike="${esc(b.uid)}">${ICO_BIKE}<div style="min-width:0;flex:1"><div>${esc(b.name)} <small class="muted">${Math.round(b.dist)} m</small></div>
            <div class="num">${num}</div><div class="sub">${esc(b.addr)}</div></div>${navBtn(b.lat, b.lng, 'YouBike ' + b.name)}</div>`;
    }).join('');
    panel.querySelectorAll('[data-id]').forEach(e => e.onclick = ev => { if (ev.target.closest('.go-btn')) return; openStation(e.dataset.id); });
    panel.querySelectorAll('[data-bike]').forEach(e => e.onclick = ev => { if (ev.target.closest('.go-btn')) return; const b = bikes.find(x => x.uid === e.dataset.bike); if (b) map.setView([b.lat, b.lng], Math.max(map.getZoom(), 17)); });
    if ($('b-bike')) $('b-bike').onclick = () => { loadBikes(place, true).catch(e => alert('YouBike 載入失敗：' + e.message)); rerender(); };
    if (place) drawBikes(place, bikeList(place), av); else clearBikes();
    if (!fit) return;
    layerSel.clearLayers();
    list.forEach(s => L.circleMarker([s.lat, s.lng], { radius: 7, color: '#111', weight: 2, fillColor: '#ffeb3b', fillOpacity: 1 }).bindTooltip(s.name).on('click', () => openStation(s.id)).addTo(layerSel));
    if (list.length) map.fitBounds(L.latLngBounds(list.map(s => [s.lat, s.lng]).concat(place ? [[place.lat, place.lng]] : [])).pad(0.2), { maxZoom: 16 });
}
function nearClick() {
    if (!navigator.geolocation) { alert('此裝置不支援定位'); return; }
    // 持續定位中且位置夠新就直接用
    const fresh = Loc.pos && Date.now() - Loc.pos.at < 30000;
    (fresh ? f => f({ coords: { latitude: Loc.pos.lat, longitude: Loc.pos.lng } }) : f => navigator.geolocation.getCurrentPosition(f, () => alert('無法取得定位'), { enableHighAccuracy: true, timeout: 8000 }))(p => {
        const { latitude: lat, longitude: lng } = p.coords;
        if (mode === 'route') { openNearRoutes(lat, lng); return; }
        setMode('station');
        const list = [...STATIONS.values()].map(s => ({ ...s, dist: Math.hypot((s.lng - lng) * 101700, (s.lat - lat) * 110900) })).sort((a, b) => a.dist - b.dist).slice(0, 20);
        // 附近 YouBike：500 公尺內 (首次 2 次 API，站點清單快取後 1 次)
        const place = { id: `near:${lat.toFixed(4)},${lng.toFixed(4)}`, name: '附近', lat, lng, r: NEAR_BIKE_R };
        view = { type: 'stlist', list, place, head: '附近 20 個公車站位與 YouBike 站' };
        listStations(list, view.head, place);
        if (!Loc.marker) L.circleMarker([lat, lng], { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: .6 }).addTo(layerSel);
        loadBikes(place).catch(() => {});
    });
}
map.addControl(new MapBtn({ position: 'bottomright', cls: 'near-btn', html: '📍 附近', title: '站位：附近公車站位與 YouBike；路線：附近所有公車路線 (依到站先後)', click: nearClick }));

// ---------- 1. 站位 → 站牌 ----------
function openStation(id) {
    if (mode !== 'station') { mode = 'station'; $('tab-station').classList.add('on'); $('tab-route').classList.remove('on'); }
    view = { type: 'station', id };
    layerVeh.clearLayers(); vehDrawn = '';
    open.clear();
    const st = STATIONS.get(id);
    layerSel.clearLayers();
    boardsOf(st).forEach((b, k) => L.marker([b.lat, b.lng], { icon: L.divIcon({ className: 'stn-icon', html: k + 1, iconSize: [22, 22] }) }).bindTooltip(`站牌 ${k + 1}：往${b.head.label}`).addTo(layerSel));
    map.fitBounds(L.latLngBounds(boardsOf(st).map(b => [b.lat, b.lng])).pad(0.6), { maxZoom: 18 });
    // 即時：整個站位的站牌一次查詢
    loadEta('st:' + id, 'EstimatedTimeOfArrival/City/Taichung', { '$filter': st.stops.map(si => `StopUID eq '${STOPS[si].uid}'`).join(' or ') }, `${st.name} 即時`).catch(() => {});
    // 附近 YouBike：排在即時之後 (首次 2 次 API，之後站點清單用快取只要 1 次)
    clearBikes();
    if (selDate() === todayKey()) loadBikes(st).catch(() => {});
    renderStation();
}
function renderStation() {
    const st = STATIONS.get(view.id), ds = selDate(), isToday = ds === todayKey();
    const eta = etaCache.get('st:' + view.id);
    const keep = panel.scrollTop;
    const routeSet = new Set();
    const boards = boardsOf(st);
    const cards = boards.map((b, k) => {
        const h = b.head;
        const rows = b.items.slice().sort((a, c) => a.r.sub.localeCompare(c.r.sub, 'zh-Hant', { numeric: true }) || a.r.dir - c.r.dir);
        const names = [...new Set(b.stops.map(si => STOPS[si].name))];
        return `<div class="stop-card"><div class="stop-head"><span class="stop-no">${k + 1}</span><b>站牌 ${k + 1} · 往${h.label}</b>
                <span class="muted">${h.nexts.length ? '下一站 ' + h.nexts.slice(0, 4).map(esc).join('、') + ' · ' : ''}站位 ${b.sids.map(esc).join('、')}</span></div>` +
            rows.map(({ si, r, pos }) => {
                routeSet.add(r.route);
                const last = pos === r.seq.length - 1;
                const row = eta && eta.rows.filter(x => x.uid === STOPS[si].uid && x.sub === r.sub && x.dir === r.dir)
                    .sort((a, b) => (a.dl ?? Infinity) - (b.dl ?? Infinity))[0];
                const t = timesAt(r, pos, ds);
                const nm = isToday ? nowMin() : -1;
                let tt;
                if (t.pending) tt = loading.has((t.pending[0] === 'today' ? 't:' : 'w:') + r.route) ? '<span class="muted">時刻表載入中…</span>' : '<span class="muted">點選載入時刻表</span>';
                else if (!t.times.length) tt = `<span class="muted">${esc(t.note)}</span>`;
                else tt = isToday ? nextLine(r, pos, t, nm, row) : t.times.slice(0, 3).map(fmt).join('、') + TAG[t.kind];
                const key = `${si}|${r.i}`;
                const full = open.has(key) && t.times && t.times.length ? dayTable(t.times, isToday, nm, t.note, '1/-1') : '';
                return `<div class="rt" data-key="${key}" data-ri="${r.i}" data-pos="${pos}">${badge(r.sub)}<span class="to">${last ? '<span class="muted">終點站 (下車)</span>' : '往 ' + esc(destOf(r))}</span>
                        <span class="eta">${isToday ? etaHtml(row) + cmpHtml(compareEta(r, STOPS[si].name, row)) : ''}</span><span class="tt">${tt}</span>${full}</div>`;
            }).join('') + '</div>';
    }).join('');
    const need = [...routeSet].filter(rt => isToday ? !todaySched(rt) : !weekSched(rt) || !todaySched(rt));
    // 準點比對需要線上車輛班次 (每條路線 1 次 API)：只列已有今日時刻表、尚未載入車輛的路線
    const needA2 = isToday ? [...routeSet].filter(rt => todaySched(rt) && !todaySched(rt).none && !a2Cache.has(rt) && !loading.has('a2:' + rt)) : [];
    const nLoading = [...loading.keys()].filter(k => k.startsWith('t:') || k.startsWith('w:') || k.startsWith('a2:')).length;
    panel.innerHTML = `<h2>${esc(st.name)}</h2>
        <div class="muted">同名站 · ${boards.length} 支站牌 (${st.sids.length} 個站位) · ${routeSet.size} 條路線 · ${eta ? `即時 ${new Date(eta.at).toLocaleTimeString('zh-TW', { hour12: false })}` : loading.has('e:st:' + view.id) ? '即時資料載入中…' : '尚無即時資料'}</div>
        <div class="row"><button class="btn" id="b-eta">更新即時 (1 次 API)</button>
        ${need.length ? `<button class="btn" id="b-all">載入全部時刻表 (${need.length} 條路線，約 ${need.length}~${need.length * 2} 次 API)</button>` : ''}
        ${needA2.length ? `<button class="btn" id="b-a2">比對準點／遲發 (${needA2.length} 條路線，${needA2.length} 次 API)</button>` : ''}
        ${nLoading ? `<span class="muted">排隊載入 ${nLoading} 筆…</span>` : ''}</div>
        <div class="hint">點路線列：載入/展開該站${isToday ? '今日' : ' ' + ds + ' '}全日時刻表${isToday ? '並比對準點' : ''}；點路線號碼：看整條路線。</div>` + cards + (isToday ? bikeHtml(st) : '');
    panel.scrollTop = keep;
    $('b-eta').onclick = () => loadEta('st:' + view.id, 'EstimatedTimeOfArrival/City/Taichung', { '$filter': st.stops.map(si => `StopUID eq '${STOPS[si].uid}'`).join(' or ') }, `${st.name} 即時`, true).catch(() => {});
    if ($('b-all')) $('b-all').onclick = () => { need.forEach(rt => { if (!isToday) loadWeek(rt).catch(() => {}); loadToday(rt).catch(() => {}); if (isToday) loadA2(rt).catch(() => {}); }); renderStation(); };
    if ($('b-a2')) $('b-a2').onclick = () => { needA2.forEach(rt => loadA2(rt).catch(() => {})); renderStation(); };
    bindBike(st);
    panel.querySelectorAll('.rt').forEach(e => e.onclick = ev => {
        const r = ROUTES[+e.dataset.ri];
        if (ev.target.closest('.badge')) { openRoute(r.sub, r.dir, STOPS[r.seq[+e.dataset.pos]].name); return; }
        const t = timesAt(r, +e.dataset.pos, selDate());
        if (t.pending) { if (t.pending[0] === 'week') loadWeek(r.route, true).catch(() => {}); loadToday(r.route, true).catch(() => {}); }
        if (selDate() === todayKey()) loadA2(r.route, false, true).catch(() => {});
        open.has(e.dataset.key) ? open.delete(e.dataset.key) : open.add(e.dataset.key);
        renderStation();
    });
}

// ---------- 1b. 公共自行車 (YouBike)：站位附近 300 公尺 ----------
//   站點清單 Bike/Station ($spatialFilter nearby) 依座標快取 30 天；可借/可還 Bike/Availability 每次查詢 (60 秒內用快取)
const BIKE_R = 300, NEAR_BIKE_R = 500, bikeAvail = new Map();   // 站位 id → { at, map: StationUID → 可借可還 }
const layerBike = L.layerGroup().addTo(map);
let bikeDrawn = '';
// st：站位或「附近」地點 { id, name, lat, lng, r? (搜尋半徑，預設 BIKE_R) }
const bikeR = st => st.r || BIKE_R;
const bikeKey = st => `txg_bike_st_v1:${st.lat.toFixed(4)},${st.lng.toFixed(4)}` + (bikeR(st) === BIKE_R ? '' : `,${bikeR(st)}`);
const bikeList = st => { const v = store.get(bikeKey(st)); return v && Date.now() - v.at < 30 * 86400000 ? v.list : null; };
function loadBikes(st, force = false) {
    const go = async () => {
        let list = bikeList(st);
        if (!list) {
            const js = await Api.run('Station/City/Taichung', { '$spatialFilter': `nearby(${st.lat.toFixed(6)},${st.lng.toFixed(6)},${bikeR(st)})` }, { label: `${st.name} 附近 YouBike 站點`, api: 'Bike' });
            list = js.map(b => ({ uid: b.StationUID, name: ((b.StationName && b.StationName.Zh_tw) || '').replace(/^YouBike\d(\.\d)?_/, ''),
                type: b.ServiceType, lat: b.StationPosition.PositionLat, lng: b.StationPosition.PositionLon, cap: b.BikesCapacity,
                addr: (b.StationAddress && b.StationAddress.Zh_tw) || '' }))
                .map(b => ({ ...b, dist: mDist(b, st) })).sort((a, b) => a.dist - b.dist);
            store.set(bikeKey(st), { at: Date.now(), list });
        }
        if (!list.length) { bikeAvail.set(st.id, { at: Date.now(), map: {} }); return; }
        const js = await Api.run('Availability/City/Taichung', { '$filter': list.map(b => `StationUID eq '${b.uid}'`).join(' or ') }, { label: `${st.name} YouBike 車輛數`, api: 'Bike' });
        const m = {};
        js.forEach(a => { m[a.StationUID] = { rent: a.AvailableRentBikes, ret: a.AvailableReturnBikes, ebike: a.AvailableRentBikesDetail ? a.AvailableRentBikesDetail.ElectricBikes : null,
            status: a.ServiceStatus, upd: Date.parse(a.SrcUpdateTime || a.UpdateTime) }; });
        bikeAvail.set(st.id, { at: Date.now(), map: m });
    };
    const c = bikeAvail.get(st.id);
    if (!force && c && Date.now() - c.at < 60000) return Promise.resolve();
    return loadOnce('bk:' + st.id, go);
}
function bikeHtml(st) {
    const list = bikeList(st), av = bikeAvail.get(st.id), busy = loading.has('bk:' + st.id);
    drawBikes(st, list, av);
    const head = `<div class="row" style="margin:0"><b>🚲 YouBike 公共自行車</b><span class="muted">${bikeR(st)} 公尺內${av ? ` · ${new Date(av.at).toLocaleTimeString('zh-TW', { hour12: false })}` : ''}</span>
        <button class="btn" id="b-bike" style="margin-left:auto">${busy ? '載入中…' : av ? '更新' : '查詢'} (${list ? 1 : 2} 次 API)</button></div>`;
    if (!list) return `<div class="bike-box">${head}${busy ? '' : '<div class="muted">尚未查詢</div>'}</div>`;
    if (!list.length) return `<div class="bike-box">${head}<div class="muted">附近沒有 YouBike 站</div></div>`;
    const STAT = { 0: '停止營運', 2: '暫停營運' };
    return `<div class="bike-box">${head}${list.map(b => {
        const a = av && av.map[b.uid];
        const num = !a ? '<span class="muted">--</span>' : a.status !== 1 ? `<span class="muted">${STAT[a.status] || '狀態不明'}</span>`
            : `可借 <b>${a.rent}</b>${a.ebike ? `<span class="muted">（電輔 ${a.ebike}）</span>` : ''} · 可還 <i>${a.ret}</i>`;
        return `<div class="bk"><div style="min-width:0"><div>${esc(b.name)} <small class="muted">${Math.round(b.dist)} m${b.type === 2 ? ' · 2.0' : b.type === 1 ? ' · 1.0' : ''}</small></div>
            <div class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.addr)}</div></div><div class="num">${num}</div></div>`;
    }).join('')}</div>`;
}
function bindBike(st) { if ($('b-bike')) $('b-bike').onclick = () => { loadBikes(st, true).catch(e => alert('YouBike 載入失敗：' + e.message)); renderStation(); }; }
function drawBikes(st, list, av) {
    const key = list ? `${st.id}|${av ? av.at : 0}` : '';
    if (key === bikeDrawn) return;
    bikeDrawn = key;
    layerBike.clearLayers();
    (list || []).forEach(b => {
        const a = av && av.map[b.uid];
        L.marker([b.lat, b.lng], { icon: L.divIcon({ className: 'bike-ico', html: a && a.status === 1 ? String(a.rent) : '🚲', iconSize: [24, 20] }), zIndexOffset: 200 })
            .bindTooltip(`${b.name}${a && a.status === 1 ? `：可借 ${a.rent} / 可還 ${a.ret}` : ''}`).addTo(layerBike);
    });
}

// ---------- 2a. 路線模式「附近」：附近所有公車路線 (地圖) 依到站先後排列 ----------

function renderNearRoutes() {

// ---------- 2b. 捷運綠線：路線簡圖 + 實際線形 + 依班距的時刻表 ----------
const M = NET.mrt;
function mrtTimes(idx, dirKey, ds) {
    const d = new Date(ds + 'T00:00:00'), wd = d.getDay();
    const table = M.headways[(wd === 0 || wd === 6) ? 'holiday' : 'weekday'];
    const prof = M[dirKey], n = M.stations.length, k = dirKey === 'south' ? idx : n - 1 - idx;
    if (k >= n - 1) return [];
    const deps = [];
    let t = hm(M.start);
    while (t <= hm(M.end)) { deps.push(t); const h = table.find(([s, e]) => t >= hm(s) && t < hm(e)); t += h ? h[2] : 20; }
    let times = deps.map(x => x + prof.dep[k] / 60);
    // 以 TDX 首末班車時刻裁切
    const fl = (M.firstLast[M.stations[idx].id] || []).find(x => dirKey === 'south' ? /高鐵/.test(x.to) : /北屯/.test(x.to));
    if (fl) {
        const f = hm(fl.first), l = hm(fl.last) + (hm(fl.last) < 180 ? 1440 : 0);
        times = times.filter(x => x >= f + 0.5 && x <= l - 0.5);
        times.unshift(f); times.push(l);   // 首末班以 TDX 時刻為準
    }
    return times;
}

}
function renderMrt() {
    const ds = selDate(), isToday = ds === todayKey(), nm = isToday ? nowMin() : -1, c = M.color || '#8cc540';
    const dk = view.dirKey, order = dk === 'south' ? M.stations.map((_, i) => i) : M.stations.map((_, i) => i).reverse();
    const n = M.stations.length;
    // 路線簡圖：一條直線、等距站點
    const svgH = n * 34 + 20;
    const svg = `<svg class="mrt-svg" width="100%" height="${svgH}" viewBox="0 0 300 ${svgH}">
        <line x1="30" y1="20" x2="30" y2="${svgH - 20}" stroke="${c}" stroke-width="10" stroke-linecap="round"/>
        ${order.map((idx, k) => { const y = 20 + k * 34, s = M.stations[idx], ts = mrtTimes(idx, dk, ds), nx = ts.filter(x => x >= nm - 0.2).slice(0, 2);
            return `<g data-idx="${idx}" style="cursor:pointer"><circle cx="30" cy="${y}" r="8" fill="#fff" stroke="#222" stroke-width="3"/>
                <text x="48" y="${y + 4}">${esc(s.name)}</text><text x="292" y="${y + 4}" text-anchor="end" fill="#ffeb3b">${nx.length ? nx.map(fmt).join(' ') : (k === n - 1 ? '終點' : '已收班')}</text></g>`; }).join('')}
    </svg>`;
    const fullRows = [...open].map(key => { const idx = +key.slice(1), ts = mrtTimes(idx, dk, ds), fl = (M.firstLast[M.stations[idx].id] || []);
        return `<div class="stop-card"><div class="stop-head"><b>${esc(M.stations[idx].name)}</b><span class="muted">${dk === 'south' ? '往 高鐵臺中站' : '往 北屯總站'} · ${fl.map(x => `往${esc(x.to)} 首班 ${x.first} 末班 ${x.last}`).join('；')}</span></div>
            <div style="padding:4px 10px">${ts.length ? dayTable(ts, isToday, nm, '', '1/-1') : '<span class="muted">此方向無班次</span>'}</div></div>`; }).join('');
    panel.innerHTML = `<h2><span class="badge" style="background:${c}">綠線</span> 臺中捷運綠線</h2>
        <div class="muted">${ds} · ${(() => { const wd = new Date(ds + 'T00:00:00').getDay(); return wd === 0 || wd === 6 ? '假日' : '平日'; })()}班距；各站時刻依 TDX 班距與站間行駛時間推算，以首末班車時刻裁切 (TDX 未提供臺中捷運逐站時刻表)</div>
        <div class="row"><button class="btn" id="b-dir">⇄ ${dk === 'south' ? '往 北屯總站' : '往 高鐵臺中站'}</button><span class="muted">目前：${dk === 'south' ? '往 高鐵臺中站' : '往 北屯總站'}</span></div>
        <div class="hint">點站名看該站全日時刻表；地圖為實際線形與車站位置。</div>${fullRows}${svg}`;
    $('b-dir').onclick = () => { view.dirKey = dk === 'south' ? 'north' : 'south'; open.clear(); renderMrt(); };
    panel.querySelectorAll('[data-idx]').forEach(g => g.onclick = () => { const key = 'm' + g.dataset.idx; open.has(key) ? open.delete(key) : open.add(key); renderMrt(); panel.scrollTop = 0;
        const s = M.stations[+g.dataset.idx]; map.setView([s.lat, s.lng], 16); });
}

// ---------- 啟動 ----------
(function init() {
    const p = new URLSearchParams(location.search);
    if (p.get('route')) { setMode('route'); const ds = routeDirs(p.get('route')); if (ds.length) openRoute(ds[0].sub, ds[0].dir); return; }
    if (p.get('station')) { const st = [...STATIONS.values()].find(s => s.name === p.get('station')); setMode('station'); if (st) openStation(st.id); return; }
    renderSearch();
    updateApi();
})();
</script>
</body>
</html>
