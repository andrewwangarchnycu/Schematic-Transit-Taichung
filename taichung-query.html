<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="臺中公車">
<title>臺中公車查詢</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script>
    // 外觀：dark (深色 Liquid Glass，預設) / glass (淺色 Liquid Glass)，排版相同；與路線圖共用設定
    (function () {
        let t = null;
        try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('txg_theme'); } catch (e) {}
        document.documentElement.dataset.theme = t === 'light' || t === 'glass' ? 'glass' : 'dark';
        // 瀏覽器分頁的狀態列顏色 (接近地圖底色)；主畫面 App 模式另有漸層半透明遮罩 (#sbar)
        window.syncThemeColor = () => { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = document.documentElement.dataset.theme === 'glass' ? '#ebe8e2' : '#16181b'; };
        syncThemeColor();
        try { if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone'); } catch (e) {}
        // 主畫面 App：螢幕高 (直向 screen.height／橫向 screen.width) 比可視高多出不到 100px (＝狀態列) 時，用螢幕高填滿
        window.fixAppH = () => {
            const r = document.documentElement;
            if (!r.classList.contains('standalone')) return;
            const portrait = matchMedia('(orientation: portrait)').matches, sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
            const ih = window.innerHeight, h = sh > ih && sh - ih < 100 ? sh : ih;
            r.style.setProperty('--app-h', h + 'px');
        };
        fixAppH();
        addEventListener('resize', () => { fixAppH(); setTimeout(fixAppH, 300); });
        addEventListener('orientationchange', () => setTimeout(fixAppH, 300));
    })();
</script>
<style>
    /* 主畫面 App 模式：網頁畫到狀態列底下，上緣加漸層半透明＋模糊遮罩讓時間／電量 (白字) 看得清楚 */
    #sbar { display: none; }
    html.standalone #sbar { display: block; position: fixed; z-index: 4000; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top) + 18px); pointer-events: none;
        background: linear-gradient(to bottom, var(--sbar, rgba(14,15,17,.72)) 0%, var(--sbar, rgba(14,15,17,.72)) 45%, rgba(0,0,0,0) 100%);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent); }
    html[data-theme="glass"] #sbar { --sbar: rgba(60,60,67,.42); }
    html.standalone, html.standalone body { background: var(--map-bg, var(--bg)); min-height: calc(100% + env(safe-area-inset-top)); }
    :root { --bg: #161719; --panel: #1f2124; --line: #34373c; --text: #ececec; --muted: #9aa0a6; --accent: #4caf50; --live: #00bcd4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    #app { display: grid; grid-template-columns: 440px minmax(0, 1fr); grid-template-rows: auto 1fr; height: 100%; }
    header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); padding-top: max(8px, env(safe-area-inset-top)); }
    header h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
    header a { color: var(--muted); font-size: 12px; text-decoration: none; }
    .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .tabs button { background: none; border: 0; color: var(--muted); padding: 6px 14px; font: inherit; cursor: pointer; }
    .tabs button.on { background: #2f6b3a; color: #fff; }
    input[type=search], select { background: #2a2d31; color: var(--text); border: 1px solid #44484e; border-radius: 8px; padding: 6px 10px; font: inherit; }
    input[type=search] { flex: 1; min-width: 140px; }
    /* 搜尋框＋框內右側鍵盤切換鈕 (路線模式：數字 ↔ 一般鍵盤) */
    .qwrap { position: relative; flex: 1; min-width: 140px; display: flex; }
    .qwrap #q { flex: 1; min-width: 0; width: 100%; }
    .qwrap.kb #q { padding-right: 52px; }
    #q-kb { display: none; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: #3b4148; color: #ddd; border: 0; border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 7px; cursor: pointer; }
    .qwrap.kb #q-kb { display: block; }
    button.btn { background: #2f3338; color: #fff; border: 1px solid #474c53; border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
    button.btn:hover { background: #3a3f45; }
    button.btn:disabled { opacity: .45; cursor: default; }
    #api { font-size: 12px; color: #ccc; background: #2a2d31; border: 1px solid #44484e; border-radius: 14px; padding: 3px 10px; cursor: pointer; font-variant-numeric: tabular-nums; }
    #api.warn { color: #ffeb3b; } #api.err { color: #ff8a80; }
    #api-detail { position: absolute; z-index: 2000; background: #26292d; border: 1px solid #44484e; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #ccc; line-height: 1.7; display: none; max-width: 320px; }
    #panel { overflow-x: hidden; overflow-y: auto; border-right: 1px solid var(--line); padding: 10px 12px 60px; }
    #map { height: 100%; background: #222; }
    .muted { color: var(--muted); }
    .hint { color: var(--muted); font-size: 13px; margin: 8px 0; }
    .list-item { display: flex; gap: 8px; align-items: center; padding: 7px 6px; border-bottom: 1px solid #2a2d31; cursor: pointer; }
    .list-item:hover { background: #26292d; }
    .list-item .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-block; min-width: 34px; text-align: center; padding: 2px 7px; border-radius: 5px; font-weight: bold; font-size: 13px; color: #fff; white-space: nowrap; }
    h2 { font-size: 18px; margin: 4px 0 2px; }
    /* 路線頁標題：捲動時置頂 (蓋住 #panel 的內距) */
    .rt-head { position: sticky; top: -10px; z-index: 5; margin: -10px -12px 4px; padding: 8px 12px 6px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .rt-head h2 { margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rt-head button { background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; padding: 3px 8px; white-space: nowrap; }
    .rt-head button:hover { color: var(--text); background: #26292d; }
    .rt-head .rev { font-size: 12px; max-width: 42%; overflow: hidden; text-overflow: ellipsis; }
    /* 🔄 自動更新開關：開＝立即更新並每分鐘更新即時到站、班次配對、公車位置 */
    button.auto { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 3px 8px; white-space: nowrap; }
    button.auto .ic { font-size: 15px; line-height: 1; display: inline-block; }
    button.auto.spin .ic { animation: spin 1s linear infinite; }
    button.auto .sw { position: relative; width: 28px; height: 16px; border-radius: 8px; background: #555; transition: background .2s; }
    button.auto .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .2s; }
    button.auto.on { color: var(--text); border-color: var(--accent); }
    button.auto.on .sw { background: var(--accent); }
    button.auto.on .sw::after { left: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
    .msel { margin-left: auto; padding: 4px 6px; display: flex; align-items: center; cursor: pointer; }
    .msel input { width: 18px; height: 18px; cursor: pointer; margin: 0; }
    .multi-bar .badge { margin-right: 2px; }
    .stop-card { background: #222428; border: 1px solid #2f3236; border-radius: 10px; margin: 10px 0; overflow: hidden; }
    .stop-head { padding: 7px 10px; background: #2a2d31; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .stop-head b { font-size: 15px; }
    .stop-no { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #111; font-weight: bold; font-size: 12px; }
    .rt { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 10px; border-top: 1px solid #2c2f33; cursor: pointer; }
    .rt:hover { background: #26292d; }
    .rt .to { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rt .eta { font-family: ui-monospace, monospace; color: var(--live); white-space: nowrap; font-size: 13px; text-align: right; }
    .rt .tt { grid-column: 2 / -1; font-family: ui-monospace, monospace; font-size: 12px; color: #bbb; }
    .times { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 10px; font-family: ui-monospace, monospace; font-size: 12px; padding: 4px 0 2px; color: #ddd; }
    .times .past { color: #5f6368; }
    .times .next { color: #ffeb3b; font-weight: bold; }
    .daytab { font-family: ui-monospace, monospace; font-size: 12px; margin: 4px 0 2px; border: 1px solid #2f3236; border-radius: 6px; overflow: hidden; }
    .daytab .hr { display: grid; grid-template-columns: 30px 1fr; border-top: 1px solid #2a2d31; }
    .daytab .hr:first-child { border-top: 0; }
    .daytab .hr b { background: #2a2d31; text-align: center; color: #ccc; padding: 1px 0; }
    .daytab .hr.cur b { background: #5d4f0f; color: #ffeb3b; }
    .daytab .hr.empty { color: #555; }
    .daytab .mins { display: flex; flex-wrap: wrap; gap: 0 9px; padding: 1px 8px; color: #ddd; }
    .daytab .mins .past { color: #5f6368; }
    .daytab .mins .next { color: #ffeb3b; font-weight: bold; }
    .bus-ico { width: 26px; height: 26px; }
    /* 公車圖示：白底正圓＋路線色公車；方向箭頭為路線色；塞車＝紅色外框呼吸燈 */
    .bdot { position: relative; width: 100%; height: 100%; }
    .bdot svg.arr { position: absolute; inset: 0; overflow: visible; }
    .bdot-c { position: absolute; inset: 2px; border-radius: 50%; background: #fff; border: 2.5px solid var(--rc); color: var(--rc); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .bdot-c svg { width: 64%; height: 64%; }
    .bdot.jam .bdot-c { border-color: #ff1744; animation: jam 1.2s ease-in-out infinite; }
    @keyframes jam { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,23,68,.85); } 50% { box-shadow: 0 0 0 7px rgba(255,23,68,0); } }
    .seq-bus { position: absolute; left: 13px; width: 22px; height: 22px; margin: -11px 0 0 -11px; z-index: 3; transition: top 1s linear; cursor: pointer; }
    .soon { color: #ffeb3b; font-weight: bold; } .now { color: #ff5252; font-weight: bold; }
    .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: #3b4148; color: #ccc; margin-left: 4px; white-space: nowrap; }
    .tag.api { background: #1b5e20; color: #b9f6ca; } .tag.freq { background: #4a148c; color: #e1bee7; }
    .last { color: #ff5252; font-weight: bold; margin-left: 2px; font-size: 11px; } .tag.sched { background: #283593; color: #c5cae9; } .tag.est { background: #5d4037; color: #ffccbc; }
    button.btn.v3-btn { background: #5a3a00; color: #ffcc80; }
    html[data-theme="glass"] button.btn.v3-btn { background: #fff1d6; color: #9a5b00; }
    .tt-row select { padding: 3px 8px; font-size: 13px; }
    .tag.nb { background: #1565c0; color: #fff; margin-left: 0; font-size: 11px; }
    /* 今日每日營運時刻表比對：取消＝紅字劃掉、增調＝橘字 */
    .cx { color: #ff5252 !important; text-decoration: line-through; opacity: 1 !important; }
    .ad { color: #ffa726 !important; font-weight: bold; }
    .mk-legend { font-size: 11px; color: #bbb; margin-top: 3px; }
    .daytab .mins s.cx { margin-right: 4px; }
    .dly { font-size: 11px; padding: 0 4px; border-radius: 3px; white-space: nowrap; font-family: inherit; }
    .dly.late { background: #5a2323; color: #ff9e9e; } .dly.early { background: #1f3f5a; color: #9fd3ff; } .dly.ontime { background: #24452a; color: #a5e0ad; }
    .cmp { font-size: 11px; color: #aaa; white-space: nowrap; font-family: inherit; }
    .cmp s { color: #888; }
    .bike-box { background: #1e2a22; border: 1px solid #2e4a36; border-radius: 10px; margin: 10px 0; padding: 6px 10px; }
    .bike-box .bk { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 4px 0; border-top: 1px solid #2a3a2f; }
    .bike-box .bk:first-of-type { border-top: 0; }
    .bike-box .num { font-family: ui-monospace, monospace; white-space: nowrap; text-align: right; }
    .bike-box .num b { color: #ffd54f; } .bike-box .num i { font-style: normal; color: #80cbc4; }
    .go-btn { flex: none; margin-left: auto; display: inline-flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 6px; border-radius: 8px; background: #1a73e8; color: #fff; text-decoration: none; font-size: 10px; line-height: 1; }
    .go-btn:hover { background: #1765cc; }
    .map-btn { display: block; min-width: 34px; height: 34px; line-height: 32px; padding: 0 8px; text-align: center; font-size: 16px; background: #2a2d31 !important; color: #eee !important; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .map-btn.srch-btn { display: none; margin-bottom: 4px; }
    .map-btn.near-btn, .map-btn.srch-btn { font-size: 14px; font-weight: bold; background: #1a73e8 !important; color: #fff !important; height: 40px; line-height: 38px; padding: 0 14px; border-radius: 20px !important; }
    .bs-opt { display: block; padding: 3px 0; cursor: pointer; }
    .ico { flex: none; width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
    .ico.bus { background: #ffd600; } .ico.bike { background: #2e7d32; } .ico.poi { background: rgba(127,127,127,.22); font-size: 16px; }
    .bike-item .num { font-family: ui-monospace, monospace; font-size: 12px; }
    .bike-item .num b { color: #ffd54f; } .bike-item .num i { font-style: normal; color: #80cbc4; }
    .bike-ico { background: #2e7d32; color: #fff; border: 2px solid #fff; border-radius: 8px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .seq { position: relative; margin: 8px 0 0 6px; }
    .seq-row { position: relative; display: grid; grid-template-columns: 26px 1fr auto; gap: 0 8px; align-items: start; padding: 5px 0; cursor: pointer; }
    /* 每列畫一段線：上半接上一站、下半接下一站；中心 x = 26/2 = 13px，與站圓圈 (14px，置中) 同心 */
    .seq-row::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 6px; background: var(--rc); }
    .seq-row:first-child::before { top: 15px; }
    .seq-row:last-child::before { bottom: auto; height: 15px; }
    .seq-row:only-child::before { display: none; }
    .seq-row:hover { background: #222428; }
    .seq-dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid; margin: 3px auto 0; position: relative; z-index: 1; }
    .seq-name { overflow: hidden; }
    .seq-name small { color: var(--muted); }
    .seq-eta { font-family: ui-monospace, monospace; font-size: 13px; color: var(--live); text-align: right; white-space: nowrap; }
    .seq-row .times { grid-column: 2 / -1; }
    .seq-row.here { background: rgba(255,235,59,.08); }
    /* 附近追蹤：最接近我的站 — 白色圓角框 (原黑底) ＋藍色呼吸燈站點 */
    .seq-row.track { outline: 2px solid #fff; outline-offset: -2px; border-radius: 8px; }
    .seq-row.track .seq-dot { background: #1a73e8; border-color: #8ab4f8 !important; animation: breathe 1.6s ease-in-out infinite; }
    .trk-d { color: #8ab4f8 !important; font-weight: bold; }
    @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(26,115,232,.7); } 50% { box-shadow: 0 0 0 7px rgba(26,115,232,0); } }
    /* 路線「附近」以地圖中心搜尋：藍色圖釘 (針尖＝中心) */
    .ctr-ico svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
    .trk-ico div { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #1a73e8; background: rgba(26,115,232,.25); animation: breathe 1.6s ease-in-out infinite; }
    .map-btn.near-btn.tracking { background: #0b3d91 !important; box-shadow: 0 0 0 3px rgba(138,180,248,.6); }
    .mrt-svg text { fill: #eee; font-size: 12px; }
    .leaflet-container { background: #1d1f22; font: inherit; }
    .leaflet-control-attribution { background: rgba(20,20,22,.75) !important; color: #aaa; }
    .leaflet-control-attribution a { color: #8ab4f8; }
    .leaflet-bar a { background: #2a2d31; color: #eee; border-color: #444; }
    .leaflet-tooltip { background: #26292d; color: #eee; border-color: #555; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #26292d; color: #eee; box-shadow: 0 3px 14px rgba(0,0,0,.6); }
    .leaflet-popup-content a { color: #8ab4f8; }
    .leaflet-container a.leaflet-popup-close-button { color: #aaa; }
    .loc-btn { display: block; width: 34px; height: 34px; line-height: 32px; text-align: center; font-size: 20px; background: #2a2d31 !important; color: #ccc !important; text-decoration: none; cursor: pointer; }
    .loc-btn.on { color: #1a73e8 !important; }
    .loc-btn.follow { color: #fff !important; background: #1a73e8 !important; }
    .loc-btn { display: flex !important; align-items: center; justify-content: center; }
    .loc-btn.compass, html[data-theme] .loc-btn.compass { color: #fff !important; background: #0b57d0 !important; }
    .loc-btn:not(.follow):not(.compass):not(.err) { color: #1a73e8 !important; }
    .loc-btn.err { color: #ff8a80 !important; }
    .me-ico { pointer-events: auto; }
    .me-pulse { animation: mepulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes mepulse { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.6); opacity: 0; } }
    #key-dlg { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; }
    #key-dlg .key-box { background: #222428; border: 1px solid #44484e; border-radius: 12px; padding: 16px; width: min(420px, 100%); }
    #key-dlg p { color: var(--muted); font-size: 13px; }
    #key-dlg a { color: #8ab4f8; }
    #key-dlg input { width: 100%; margin: 4px 0; padding: 8px; background: #2a2d31; color: var(--text); border: 1px solid #44484e; border-radius: 6px; font: inherit; }
    .bs-x { float: right; margin: -4px -4px 0 8px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(127,127,127,.18); color: inherit; font-size: 18px; line-height: 28px; padding: 0; cursor: pointer; }
    .yb-zero-rent, .yb-zero-rent b, .yb-zero-rent i { color: #ff9f0a !important; font-weight: 600; }
    .yb-zero-ret, .yb-zero-ret b, .yb-zero-ret i { color: #c62828 !important; font-weight: 600; }
    html[data-theme="dark"] .yb-zero-ret, html[data-theme="dark"] .yb-zero-ret b, html[data-theme="dark"] .yb-zero-ret i { color: #e0443a !important; }
    #base-set { position: absolute; z-index: 2000; right: 12px; top: 56px; width: min(360px, calc(100vw - 24px)); background: #26292d; border: 1px solid #44484e; border-radius: 10px; padding: 10px 12px; display: none; }
    .stn-icon { background: #fff; border: 2px solid #333; border-radius: 50%; color: #111; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; }

    /* ===== 跟隨班次導航 (Mapbox GL 3D)：與主畫面相同的 Liquid Glass 設計 (深色／淺色依外觀) ===== */
    #nav { position: fixed; inset: 0; z-index: 3000; background: var(--bg, #0e0f11); display: none; color: var(--text, #f2f2f7); --nsh: 40vh;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", sans-serif; }

    /* ================= 外觀：Liquid Glass 排版 (深色 / 淺色兩種配色，共用同一套浮動玻璃排版) ================= */
    html[data-theme] {

        --hair: rgba(60,60,67,.12); --glass: rgba(255,255,255,.55); --glass-panel: rgba(246,247,250,.62); --glass-edge: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.9);

    html[data-theme] #key-dlg input { background: var(--soft); border: 0; border-radius: 10px; color: var(--text); }
    /* 右上控制組：放大 / 縮小 / 定位 (同一個垂直按鈕組) */
    .map-stack { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-edge, #444); box-shadow: inset 0 1px 0 var(--glass-hi, transparent), 0 6px 20px rgba(0,0,0,.25); }
    .map-stack a { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; text-decoration: none; cursor: pointer;
        background: #2a2d31; color: #eee; border-bottom: 1px solid var(--hair, #444); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    html .map-stack a.loc.err { color: #ff6961 !important; }

    /* 多選＋附近：地圖上最近站的到站卡片 */
    .mn-ico { pointer-events: none; }

        -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }
    .mn-card::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--pop, rgba(36,36,38,.9)); }
    .mn-h { font-size: 13px; margin-bottom: 2px; } .mn-h small { color: var(--muted, #999); }
    .mn-r { display: flex; gap: 6px; align-items: center; } .mn-r .badge { font-size: 11px; min-width: 0; padding: 0 6px; }
    .mn-r b, .mn-sub b { color: var(--live, #64d2ff); }
    .mn-sub { font-size: 12px; color: var(--muted, #999); white-space: normal; }
    .mn-card.pick { pointer-events: auto; border-color: rgba(10,132,255,.6); }
    .mn-go { color: var(--btn-text, #64d2ff); cursor: pointer; margin-left: 6px; font-size: 12px; text-decoration: none; }
    /* 底部抽屜把手：固定在面板上緣，拖曳調整高度、點一下在中/大之間切換 */
    #grip { display: none; position: absolute; z-index: 610; left: 8px; right: 8px; height: 24px; justify-content: center; align-items: center; touch-action: none; cursor: ns-resize;

    #grip.drag { transition: none; }
    #grip span { width: 40px; height: 5px; border-radius: 3px; background: var(--grip, rgba(60,60,67,.35)); }
    .hdr-tools { display: inline-flex; gap: 2px; align-items: center; }   /* 路線圖 · 外觀 (太陽／月亮) · 圖層 */
    #btn-base, #btn-theme, #btn-map { background: none; border: 0; font-size: 18px; cursor: pointer; padding: 2px 4px; line-height: 1; color: var(--text); display: inline-flex; text-decoration: none; }
    @media (max-width: 760px) {

        header h1 { font-size: 15px; }
        /* 首頁＝全地圖；按「搜尋」或點輸入框才出現清單 */
        #app.full { grid-template-rows: auto 1fr; }

        /* 搜尋模式：清單在上、地圖在下 (避免被手機鍵盤擋住) */
        #app.srch { grid-template-rows: auto 1fr 28vh; }
        #app.srch #panel { grid-row: 2; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
        #app.srch #map { grid-row: 3; }
        .map-btn.srch-btn { display: block; }
        /* 手機 Liquid Glass：地圖永遠滿版，標題列浮在上方、面板為可拖曳高度的底部抽屜 (上緣圓角小把手) */
        /* fixed＋inset 0：主畫面 App 模式下 height:100% 會少一個狀態列高度 (底部留白)，改貼齊整個螢幕 */

        /* 主畫面 App：iOS 的可視區域會少一個狀態列高 (連 fixed inset:0 也是)，改用 JS 量到的螢幕高度 */
        html.standalone[data-theme] #app { bottom: auto; height: var(--app-h, calc(100% + env(safe-area-inset-top))); }
        html[data-theme] #map { position: absolute; inset: 0; height: auto; }
        html[data-theme] header { position: absolute; top: 0; left: 0; right: 0; margin: max(8px, env(safe-area-inset-top)) 8px 0; border-radius: 22px; }
        html[data-theme] #panel { position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet-h, 45vh); margin: 0 8px max(8px, env(safe-area-inset-bottom));
            border-radius: 26px; padding-top: 24px; transition: height .28s cubic-bezier(.2, .8, .2, 1); }

        html[data-theme] .leaflet-top { top: calc(var(--hdr-h, 110px) + max(8px, env(safe-area-inset-top))); }
        /* 版權文字永遠貼地圖最下緣 (在抽屜後面)；「附近／搜尋」按鈕隨抽屜高度上移 */
        html[data-theme] .leaflet-bottom { bottom: 0; }

<div id="sbar"></div>
<div id="app">
    <header>
        <h1>臺中公車查詢</h1>

        <span class="qwrap kb"><input type="search" id="q" placeholder="輸入路線，例：300、綠線" autocomplete="off" inputmode="numeric"><button id="q-kb" type="button" title="切換鍵盤">ABC 中</button></span>

<script src="taichung-network.js"></script>
<script src="bus3d.js"></script>
<!-- 本機開發用金鑰 (gitignore)；公開網站沒有此檔，訪客自行輸入金鑰 -->
<script src="tdx-key.local.js"></script>
<script>
'use strict';
// ==========================================================
//  臺中公車查詢 (分支功能)
//   1. 站位 → 站牌：依行車方向分組，列出各路線即時到站與時刻表
//   2. 路線：即時、各站時刻表 (今日＝每日營運時刻表；未來日＝路線班表)；捷運＝路線簡圖＋實際線形
//   API 額度與 taichung.html 共用 (localStorage 同一組計數，每分鐘 3 次)
// ==========================================================
const TDX = {
    clientId: (window.TDX_LOCAL_KEY || {}).id || "",
    clientSecret: (window.TDX_LOCAL_KEY || {}).secret || "",
    authUrl: "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token",
    bus: "https://tdx.transportdata.tw/api/basic/v2/Bus"
};
const MAX_PER_MIN = 3, FRESH_MS = 25000;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ---------- 本機儲存 ----------
const mem = {};
const store = {
    get(k) { try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : null; },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

// ---------- API 額度 (與路線圖共用) ----------
const ApiBudget = {
    KEY: 'txg_api_calls', BLOCK_KEY: 'txg_api_block',
    stamps() { const now = Date.now(); return (store.get(this.KEY) || []).filter(t => now - t < 60000); },
    used() { return this.stamps().length; },
    waitMs() {
        const now = Date.now(), s = this.stamps();
        return Math.max(0, s.length < MAX_PER_MIN ? 0 : s[0] + 60000 - now, (store.get(this.BLOCK_KEY) || 0) - now);
    },
    take() { if (this.waitMs() > 0) return false; const s = this.stamps(); s.push(Date.now()); store.set(this.KEY, s); return true; },
    blockFor(ms) { store.set(this.BLOCK_KEY, Date.now() + ms); }
};
// TDX 金鑰：使用者在本機設定的優先 (與路線圖共用)，其次為檔案內建 (公開部署版留空)
const tdxKey = () => {
    const k = store.get('txg_tdx_key');
    if (k && k.id && k.secret) return k;
    return TDX.clientId && TDX.clientSecret ? { id: TDX.clientId, secret: TDX.clientSecret } : null;
};
function openKeyDialog() {
    const d = $('key-dlg'), k = store.get('txg_tdx_key') || {};
    d.innerHTML = `<div class="key-box"><b>TDX API 金鑰</b>
        <p>即時資料與時刻表來自交通部 TDX 運輸資料流通服務。請到 <a href="https://tdx.transportdata.tw/" target="_blank" rel="noopener">tdx.transportdata.tw</a> 免費註冊，在「會員中心 → API 金鑰」取得 Client ID 與 Client Secret。金鑰只存在這台裝置的瀏覽器，不會上傳。</p>
        <input id="key-id" placeholder="Client ID" value="${esc(k.id || '')}" autocomplete="off">
        <input id="key-secret" placeholder="Client Secret" value="${esc(k.secret || '')}" autocomplete="off" type="password">
        <div class="row"><button class="btn" id="key-ok">儲存</button><button class="btn" id="key-clear">清除</button><button class="btn" id="key-close">關閉</button></div></div>`;
    d.style.display = 'flex';
    $('key-ok').onclick = () => { const id = $('key-id').value.trim(), secret = $('key-secret').value.trim(); if (!id || !secret) return;
        store.set('txg_tdx_key', { id, secret }); store.del('txg_tdx_token'); Api.lastError = null; d.style.display = 'none'; updateApi(); rerender(); };
    $('key-clear').onclick = () => { store.del('txg_tdx_key'); store.del('txg_tdx_token'); openKeyDialog(); updateApi(); };
    $('key-close').onclick = () => { d.style.display = 'none'; };
}
async function getToken() {
    const c = store.get('txg_tdx_token');
    if (c && c.exp > Date.now() + 60000) return c.token;
    const key = tdxKey();
    if (!key) { setTimeout(openKeyDialog, 0); throw new Error('尚未設定 TDX 金鑰'); }
    const res = await fetch(TDX.authUrl, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'client_credentials', client_id: key.id, client_secret: key.secret }) });
    if (!res.ok) throw new Error('Token 取得失敗 ' + res.status);
    const d = await res.json();
    store.set('txg_tdx_token', { token: d.access_token, exp: Date.now() + d.expires_in * 1000 });
    return d.access_token;
}
// 依序排隊呼叫；high 優先 (使用者剛點的即時資料)
const Api = {
    q: [], busy: false, timer: null, lastError: null, label: '',
    // api：'Bus' (預設) 或 'Bike' (公共自行車)
    run(path, params, { high = false, label = '', api = 'Bus' } = {}) {
        const base = api === 'Bus' ? TDX.bus : api === 'V3Map' ? 'https://tdx.transportdata.tw/api/premium/V3/Map' : TDX.bus.replace(/\/Bus$/, '/' + api);
        const url = `${base}/${path}?` + new URLSearchParams({ ...params, '$format': 'JSON' });
        return new Promise((resolve, reject) => {
            const t = { url, resolve, reject, high, label };
            if (high) this.q.unshift(t); else this.q.push(t);
            this.pump(); updateApi();
        });
    },
    pending() { return this.q.length + (this.busy ? 1 : 0); },
    pump() {
        if (this.busy || this.timer || !this.q.length) return;
        const w = ApiBudget.waitMs();
        if (w > 0) { this.timer = setTimeout(() => { this.timer = null; this.pump(); }, w + 300); return; }
        const t = this.q.shift();
        this.busy = true; this.label = t.label;
        this.fetch(t.url, true).then(v => { this.lastError = null; t.resolve(v); }, e => { this.lastError = e.message; t.reject(e); })
            .finally(() => { this.busy = false; this.label = ''; this.pump(); updateApi(); });
    },
    async fetch(url, retry) {
        const token = await getToken();
        while (!ApiBudget.take()) await new Promise(r => setTimeout(r, ApiBudget.waitMs() + 300));
        const res = await fetch(url, { headers: { authorization: 'Bearer ' + token } });
        if (res.status === 401 && retry) { store.del('txg_tdx_token'); return this.fetch(url, false); }
        if (res.status === 429) { ApiBudget.blockFor(60000); throw new Error('已達 API 頻率上限 (429)'); }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    }
};
let apiOpen = false;
function updateApi() {
    const w = ApiBudget.waitMs(), el = $('api');
    if (!tdxKey()) { el.textContent = '🔑 金鑰'; el.className = 'warn'; el.title = '設定 TDX API 金鑰'; $('api-detail').style.display = 'none'; return; }
    el.textContent =Api.busy ? '⟳' : w > 0 ? `⏳ ${Math.ceil(w / 1000)}s` : Api.q.length ? `排隊 ${Api.q.length}` : `${MAX_PER_MIN - ApiBudget.used()}/${MAX_PER_MIN}`;
    el.className = Api.lastError ? 'err' : w > 0 ? 'warn' : '';
    const d = $('api-detail');
    if (!apiOpen) { d.style.display = 'none'; return; }
    const r = el.getBoundingClientRect();
    d.style.display = 'block'; d.style.left = Math.max(8, Math.min(innerWidth - 330, r.left)) + 'px'; d.style.top = (r.bottom + 6) + 'px';
    d.innerHTML = [`每分鐘可呼叫 ${MAX_PER_MIN} 次 (與路線圖共用)，已用 ${ApiBudget.used()} 次`,
        w > 0 ? `${Math.ceil(w / 1000)} 秒後可再呼叫` : '目前可呼叫',
        Api.busy ? `呼叫中：${esc(Api.label)}` : '', Api.q.length ? `排隊：${Api.q.map(t => esc(t.label)).join('、')}` : '',
        Api.lastError ? '錯誤：' + esc(Api.lastError) : ''].filter(Boolean).join('<br>') +
        '<br><button class="btn" id="api-key-btn" style="margin-top:4px">TDX 金鑰設定</button>';
    $('api-key-btn').onclick = () => { apiOpen = false; updateApi(); openKeyDialog(); };
}
$('api').onclick = () => { if (!tdxKey()) { openKeyDialog(); return; } apiOpen = !apiOpen; updateApi(); };
setInterval(() => { updateApi(); tickLive(); }, 1000);

// ---------- 時間工具 ----------
const pad = n => String(n).padStart(2, '0');
const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
const fmt = m => { const r = Math.round(m); return `${pad(Math.floor(r / 60) % 24)}:${pad(r % 60)}`; };
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const WD_KEY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function remain(dl) {
    const s = Math.floor((dl - Date.now()) / 1000);
    if (s <= 30) return '<span class="now">進站中</span>';
    if (s > 15 * 60) { const d = new Date(dl); return `<span class="clk">${pad(d.getHours())}:${pad(d.getMinutes())}</span>`; }   // 15 分以上改顯示到站時刻 HH:MM
    const txt = `${Math.floor(s / 60)}分${pad(s % 60)}秒`;
    return s < 180 ? `<span class="soon">${txt}</span>` : txt;
}
// 表定時刻 (今日分鐘數) → 「?分鐘後」
const inMinTxt = m => { const d = Math.round(m - nowMin()); return d <= 0 ? '即將' : `${d}分鐘後`; };
function tickLive() {
    document.querySelectorAll('[data-dl]').forEach(e => { e.innerHTML = remain(+e.dataset.dl); });
    document.querySelectorAll('[data-in]').forEach(e => { e.textContent = inMinTxt(+e.dataset.in); });
}

// ---------- 靜態路網 ----------
const NET = window.TXG_NET;
const STOPS = NET.stops.map(([uid, name, lat, lng, sid], i) => ({ i, uid: 'TXG' + uid, name, lat, lng, sid }));
const ROUTES = NET.routes.map(([sub, route, dir, seq], i) => ({ i, sub, route, dir, seq }));
const routeOfStop = STOPS.map(() => []);
ROUTES.forEach(r => r.seq.forEach((si, pos) => routeOfStop[si].push([r.i, pos])));
// 名詞 (TDX 臺中資料)：
//   站牌 StopUID：每條路線在每個停靠點各一筆 (同一支實體站牌常有多筆)
//   站位 StationID：同一側 (同一行車方向) 的停靠位置，通常一個方向一個
//   同站：同名且彼此 500 公尺內的站位合併，例如路口兩側往返兩個站位 → 查詢以「同站」為單位
//   實體站牌：同站內 15 公尺內的 StopUID 合併成一支，依停靠位置與行車方位編號 1、2、3…
const mDist = (a, b) => Math.hypot((a.lng - b.lng) * 101700, (a.lat - b.lat) * 110900);
const STATIONS = new Map();          // 同站 id → { id, name, sids, stops, lat, lng, routes }
const SAME_OF = new Array(STOPS.length);
(function buildSameStations() {
    const bySid = new Map();

// ---------- 2a. 路線模式「附近」：附近所有公車路線 (地圖) 依到站先後排列 ----------
//   範圍內最近的 40 支站牌一次查即時 (1 次 API)；每條路線每方向取最近的站牌 (不含終點站)

    if (sz.x - tl[0] - br[0] < 80 || sz.y - tl[1] - br[1] < 80) { tl = [0, 0]; br = [0, 0]; }   // 太窄就用整張地圖
    const a = L.point(tl[0], tl[1]), b = L.point(sz.x - br[0], sz.y - br[1]);

// 規劃模式下點地圖＝設定起點／終點
map.on('click', e => {
    if (mode !== 'plan') return;
    planSet(PL.active, { type: 'point', name: `地圖選點 (${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)})`, lat: e.latlng.lat, lng: e.latlng.lng });
});

// ---------- 啟動 ----------
(function init() {
    const p = new URLSearchParams(location.search);
    if (p.get('nav')) { setMode('route'); updateApi(); try { navOpen(JSON.parse(p.get('nav'))); } catch (e) { alert('導航參數錯誤'); } return; }
    if (p.get('route')) { setMode('route'); const ds = routeDirs(p.get('route')); if (ds.length) openRoute(ds[0].sub, ds[0].dir); return; }
    if (p.get('station')) { const st = [...STATIONS.values()].find(s => s.name === p.get('station')); setMode('station'); if (st) openStation(st.id); return; }
    setMode('route');
    updateApi();
})();
</script>
</body>
</html>
